name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[server,dev,push]' setuptools wheel
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -v
      - run: ruff format --check ascend tests scripts setup.py
      - run: ruff check --select F401,F841 ascend tests scripts setup.py
      - run: find packs/community -name '*.toml' -print0 | xargs -0 -n 1 ascend pack lint
      - run: python scripts/build_registry.py && git diff --exit-code packs/community/registry.json
      - run: python scripts/build_specialist_tracks.py --check
