name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[server,dev,push]' setuptools wheel
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -v
      - run: for pack in packs/community/*.toml; do ascend pack lint "$pack"; done
      - run: python scripts/build_registry.py && git diff --exit-code packs/community/registry.json
