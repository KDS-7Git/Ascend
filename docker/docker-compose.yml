services:
  ascend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ASCEND_OFFLINE: ${ASCEND_OFFLINE:-0}
    # Start manually during development; choose a restart policy when deploying.
    restart: "no"
    ports:
      - "127.0.0.1:${ASCEND_PORT:-8420}:8420"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    volumes:
      - ascend-data:/data
    environment:
      AUTH_MODE: ${AUTH_MODE:-single}
      ASCEND_ALLOW_CODE: ${ASCEND_ALLOW_CODE:-0}
      ASCEND_RUNNER_URL: ${ASCEND_RUNNER_URL:-}
      ASCEND_RUNNER_KEY: ${ASCEND_RUNNER_KEY:-}
      ASCEND_RUNNER_SITE_ID: ${ASCEND_RUNNER_SITE_ID:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      ASCEND_PUBLIC_URL: ${ASCEND_PUBLIC_URL:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-/data/vapid.pem}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
volumes:
  ascend-data:
