services:
  ascend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8420:8420"
    volumes:
      - ascend-data:/data
    environment:
      AUTH_MODE: ${AUTH_MODE:-single}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
volumes:
  ascend-data:
