[[node]]
level = "capstone"
id = "capstone-milestone"
title = "Full defensive posture report (milestone)"
size = "L"
needs = ["close-the-gaps"]
milestone = true
done_when = "wrote one complete report at {lab_dir}/notes/capstone-report.md: what's monitored, what's hardened, what attack chain you tested end to end, what was caught, what gaps you closed, and what's still unmonitored and why that's an acceptable or unacceptable risk for a home lab"
resource = "https://attack.mitre.org/"
verify = { type = "file", path = "{lab_dir}/notes/capstone-report.md", min_bytes = 500 }


[[node]]
level = "mitre"
id = "first-discovery"
title = "Find one event from the last five minutes"
size = "S"
minutes = 10
needs = []
brief = "Start a tiny investigation with one real log entry."
done_when = "On your own Linux host, create a marker with logger -t ascend-lab \"quick check\". Find it using journalctl -t ascend-lab --since \"5 minutes ago\", then record its time, source, and message."
resource = "https://www.freedesktop.org/software/systemd/man/latest/journalctl.html"
verify = { type = "manual" }

# ---------------------------------------------------------------- side lane: quick drills
[[node]]
level = "mitre"
id = "attck-technique-drill"
title = "Read and summarise ATT&CK technique #{n} from the curated list"
series = { from = 1, to = 15 }
size = "S"
needs = []
done_when = "picked one MITRE ATT&CK technique you haven't covered yet, read its page, wrote a 3-line summary (what it is, one real detection idea, one real mitigation) in {lab_dir}/notes/attck-drills.md"
resource = "https://attack.mitre.org/techniques/enterprise/"

[[node]]
"level" = "mitre"
"id" = "discovery-2"
"title" = "Separate two sources in a noisy log"
"size" = "S"
"minutes" = 15
"needs" = ["first-discovery"]
"brief" = "Give your investigator self a clean signal among harmless noise."
"done_when" = "Generate two harmless logger messages using different tags, then use journalctl to show only one tag in the last five minutes. Save the filter and matching output, with a sentence on why the other source disappeared."
"resource" = "https://www.freedesktop.org/software/systemd/man/latest/journalctl.html"
"verify" = { "type" = "manual" }

[[node]]
"level" = "mitre"
"id" = "discovery-3"
"title" = "Test a tiny detection against a harmless lookalike"
"size" = "S"
"minutes" = 20
"needs" = ["discovery-2"]
"brief" = "A useful detection needs a match and a non-match."
"done_when" = "Create a local text fixture with a synthetic failed-login line and a successful-login line. Write a grep or Python filter that returns only the failed event. Save the fixture, command, and result; label the data as synthetic."
"resource" = "https://www.gnu.org/software/grep/manual/grep.html"
"verify" = { "type" = "manual" }
