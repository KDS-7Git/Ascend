verify = { type = "file", path = "{lab_dir}/notes/alert-triage.md", min_bytes = 200 }

[[node]]
level = "siem-basics"
id = "siem-milestone"
title = "Full SIEM-based investigation of a simulated incident (milestone)"
size = "L"
needs = ["siem-search", "alert-triage"]
