verify = { type = "file", path = "{lab_dir}/notes/securityonion-setup.md", min_bytes = 100 }

[[node]]
level = "siem-basics"
id = "siem-search"
title = "Searching and pivoting in a SIEM dashboard"
size = "M"
needs = ["security-onion-setup"]
done_when = "used Security Onion's dashboard (Kibana-based) to search for one specific event type and pivot from it to related events, documented the query and findings at {lab_dir}/notes/siem-search.md"
resource = "https://docs.securityonion.net/en/2.4/kibana.html"
verify = { type = "file", path = "{lab_dir}/notes/siem-search.md", min_bytes = 150 }

[[node]]
level = "siem-basics"
id = "alert-triage"
title = "Alert triage: true positive, false positive, or needs more info"
