# Track 5 of 5: Defensive Security & Detection
# kind = "proficiency": this is the track closest to your ORIGINAL stated reason for wanting cyber at all --
# "learn attacking in my own lab so I can shield systems from real attackers." The other 4 tracks taught you
# to attack; this one teaches you to see an attack happening and stop it. Strongly recommended to do this
# track in parallel with, not strictly after, network-penetration-testing: attacking something and then
# immediately checking what it looked like from the defender's side is the fastest way to learn detection.
#
# DRAFT written by Claude. NOT reviewed. Run `ascend pack lint`, `ascend pack check-links`, read every
# done_when, then `ascend pack review defensive-security-and-detection` before trusting it.

[pack]
id = "defensive-security-and-detection"
title = "Defensive Security & Detection"
kind = "proficiency"
version = 2
source = "ai-draft"
reviewed = false

[vars]
lab_dir = "~/cyber/defense"
pi_ip = "192.168.1.50"

[[level]]
id = "logging-fundamentals"
title = "Logging fundamentals: what gets recorded, and where"
lane = "main"

[[level]]
id = "log-analysis"
title = "Log analysis by hand (before any tooling)"
lane = "main"

[[level]]
id = "network-monitoring"
title = "Network monitoring: Zeek and Suricata"
lane = "main"

[[level]]
id = "siem-basics"
title = "SIEM basics with Security Onion"
lane = "main"

[[level]]
id = "detection-engineering"
title = "Writing your own detection rules"
lane = "main"

[[level]]
id = "hardening"
title = "Hardening baselines, beyond one Pi"
lane = "main"

[[level]]
id = "incident-response"
title = "Incident response fundamentals"
lane = "main"

[[level]]
id = "capstone"
title = "Detect your own earlier attacks"
lane = "main"

[[level]]
id = "mitre"
title = "MITRE ATT&CK technique drills"
lane = "side"

# ---------------------------------------------------------------- 1: logging-fundamentals
[[node]]
level = "logging-fundamentals"
id = "linux-log-locations"
title = "Leave a breadcrumb, then find it in the logs"
size = "S"
needs = []
done_when = "Found my generated log marker and saved its timestamp, source, and a map of the available system log sources in {lab_dir}/notes/log-locations.md."
resource = "https://www.loggly.com/ultimate-guide/linux-logging-basics/"
verify = { type = "file", path = "{lab_dir}/notes/log-locations.md", min_bytes = 150 }
minutes = 20
brief = "Make your first investigation personal: generate a harmless event and prove where Linux recorded it."
steps = ["On your own Linux machine or Pi, run logger -t ascend-lab \"first breadcrumb\".", "Find the marker with journalctl -t ascend-lab or the system’s configured log files.", "Save the matching event in {lab_dir}/notes/log-locations.md and map the available authentication, service, and kernel log sources. Note missing sources rather than inventing five files."]
hints = ["Many distributions keep logs in the journal rather than /var/log/auth.log. Try journalctl --since \"5 minutes ago\"."]

[[node]]
level = "logging-fundamentals"
id = "auth-log-reading"
title = "Tell a failed login from a successful one"
size = "M"
needs = ["linux-log-locations"]
done_when = "triggered one successful login, one failed login, and one sudo command on the Pi, found and annotated the exact log lines each produced at {lab_dir}/notes/auth-log.md"
resource = "https://www.loggly.com/ultimate-guide/linux-logging-basics/"
verify = { type = "file", path = "{lab_dir}/notes/auth-log.md", min_bytes = 200 }
minutes = 45
brief = "Reconstruct three events on your own lab machine using only the evidence they leave behind."
steps = ["Generate one successful login, one deliberate failed login, and one ordinary sudo command on your own lab host.", "Locate the events in the journal or auth log and compare timestamps, identities, and outcomes.", "Save redacted excerpts with a one-line explanation for each in {lab_dir}/notes/auth-log.md."]
hints = ["Filter by a short time window first. The SSH service may be called ssh or sshd."]

[[node]]
level = "logging-fundamentals"
id = "journald-basics"
title = "Cut a noisy log down to the one event that matters"
size = "S"
needs = []
done_when = "used journalctl to filter logs by service, by time range, and by priority, saved 3 example commands and their purpose at {lab_dir}/notes/journald.md"
resource = "https://www.freedesktop.org/software/systemd/man/journalctl.html"
verify = { type = "file", path = "{lab_dir}/notes/journald.md", min_bytes = 100 }
minutes = 20
brief = "Use three filters to turn a wall of logs into a useful answer."
steps = ["Generate another logger marker and find it by tag.", "Narrow results by time range, then inspect one real service and its priority filter.", "Save three useful commands and their outputs in {lab_dir}/notes/journald.md."]
hints = ["A filter with no results is still evidence. Check the unfiltered time range before assuming logging is broken."]

[[node]]
level = "logging-fundamentals"
id = "logging-milestone"
title = "Rebuild a mini incident timeline"
size = "M"
needs = ["auth-log-reading", "journald-basics"]
milestone = true
done_when = "Reconstructed three lab events from their log evidence and saved the source lines, timeline, and an uncertainty in {lab_dir}/notes/logging-milestone.md."
resource = "https://www.loggly.com/ultimate-guide/linux-logging-basics/"
verify = { type = "file", path = "{lab_dir}/notes/logging-milestone.md", min_bytes = 250 }

# ---------------------------------------------------------------- 2: log-analysis
minutes = 60
brief = "A few log lines can tell a complete story. Show what happened, in what order, and what you cannot prove."
steps = ["In a disposable lab session, generate a login, a failed login, and a service event. Alternatively use a saved training log containing these events.", "Set aside your command history and reconstruct the order from log timestamps and event fields.", "Save source lines, a three-event timeline, and one uncertainty in {lab_dir}/notes/logging-milestone.md."]
hints = []

[[node]]
level = "log-analysis"
id = "grep-and-awk-for-logs"
title = "grep/awk/sort/uniq: the real first SIEM"
size = "M"
needs = []
done_when = "wrote and saved 5 one-liners that answer real questions from a log file (top IPs hitting a service, failed logins per user, etc.), at {lab_dir}/notes/log-oneliners.md"
resource = "https://www.gnu.org/software/gawk/manual/gawk.html"
verify = { type = "file", path = "{lab_dir}/notes/log-oneliners.md", min_bytes = 200 }

[[node]]
level = "log-analysis"
id = "web-log-analysis"
title = "Analysing web server access logs for an attack"
size = "M"
needs = ["grep-and-awk-for-logs"]
done_when = "ran a scan or directory brute-force from the network-penetration-testing track against Juice Shop, then found the evidence of it in the access logs, wrote {lab_dir}/notes/web-log-analysis.md"
resource = "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
verify = { type = "file", path = "{lab_dir}/notes/web-log-analysis.md", min_bytes = 150 }

[[node]]
level = "log-analysis"
id = "false-positives"
title = "Why log analysis is mostly about ruling things OUT"
size = "S"
needs = []
done_when = "wrote {lab_dir}/notes/false-positives.md with 3 real examples of log entries that LOOK suspicious but usually aren't, and how you'd confirm either way"
resource = "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"

[[node]]
level = "log-analysis"
id = "log-analysis-milestone"
title = "Find the needle: one real attack hidden in normal traffic (milestone)"
size = "L"
needs = ["web-log-analysis", "false-positives"]
milestone = true
done_when = "generated an hour of normal Juice Shop browsing traffic PLUS one hidden attack somewhere in the middle, then found and proved the attack using log analysis alone, documented the process at {lab_dir}/notes/log-milestone.md"
resource = "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
verify = { type = "file", path = "{lab_dir}/notes/log-milestone.md", min_bytes = 300 }

# ---------------------------------------------------------------- 3: network-monitoring
[[node]]
level = "network-monitoring"
id = "zeek-setup"
title = "Zeek: install it and read your first connection log"
size = "M"
needs = []
done_when = "installed Zeek, ran it against a capture or live interface, found and annotated one entry in conn.log, saved at {lab_dir}/notes/zeek-setup.md"
resource = "https://docs.zeek.org/en/master/quickstart.html"
verify = { type = "file", path = "{lab_dir}/notes/zeek-setup.md", min_bytes = 150 }

[[node]]
level = "network-monitoring"
id = "zeek-attack-trace"
title = "Trace an earlier attack through Zeek logs"
size = "M"
needs = ["zeek-setup"]
done_when = "ran Zeek against a capture of an earlier exploitation attempt (from network-penetration-testing or home-hack-lab), found the relevant log entries, wrote {lab_dir}/notes/zeek-attack-trace.md"
resource = "https://docs.zeek.org/en/master/logs/index.html"
verify = { type = "file", path = "{lab_dir}/notes/zeek-attack-trace.md", min_bytes = 150 }

[[node]]
level = "network-monitoring"
id = "suricata-setup"
title = "Suricata: signature-based detection basics"
size = "M"
needs = []
done_when = "installed Suricata, ran it with a default ruleset against traffic containing a known-bad pattern (e.g. an nmap scan), confirmed an alert fired, saved the alert plus notes at {lab_dir}/notes/suricata-setup.md"
resource = "https://docs.suricata.io/en/latest/quickstart.html"
verify = { type = "file", path = "{lab_dir}/notes/suricata-setup.md", min_bytes = 150 }

[[node]]
level = "network-monitoring"
id = "network-monitoring-milestone"
title = "Detect a full attack chain across both tools (milestone)"
size = "L"
needs = ["zeek-attack-trace", "suricata-setup"]
milestone = true
done_when = "ran a multi-step attack (recon -> exploitation) against the Pi while BOTH Zeek and Suricata were capturing, then wrote {lab_dir}/notes/network-monitoring-milestone.md on what each tool caught that the other didn't"
resource = "https://docs.zeek.org/en/master/"
verify = { type = "file", path = "{lab_dir}/notes/network-monitoring-milestone.md", min_bytes = 300 }

# ---------------------------------------------------------------- 4: siem-basics
[[node]]
level = "siem-basics"
id = "security-onion-setup"
title = "Security Onion: get it running in a VM"
size = "L"
needs = []
done_when = "installed Security Onion in a VM, pointed it at traffic (even just the VM's own interface), confirmed events are flowing into its dashboard, saved a screenshot plus setup notes at {lab_dir}/notes/securityonion-setup.md"
