"steps" = ["Edit the documentation address/user in configs/ansible/inventory.ini for one owned guest. Inspect the inventory and exact target before any playbook run.", "```sh\nansible-inventory -i configs/ansible/inventory.ini --graph\nansible relay_targets -i configs/ansible/inventory.ini --limit relay1 -m ping\n```", "Read the playbook and service template. Run in check/diff mode, then apply only to that guest. Do not publish inventory credentials or raw facts containing private data.", "```sh\nansible-playbook -i configs/ansible/inventory.ini configs/ansible/playbook.yml --limit relay1 --check --diff\nansible-playbook -i configs/ansible/inventory.ini configs/ansible/playbook.yml --limit relay1\n```", "Run the same playbook again and inspect actual service state. Reach the private service through the guest SSH forwarding route from the first track.", "```sh\nansible-playbook -i configs/ansible/inventory.ini configs/ansible/playbook.yml --limit relay1\nssh -N -L 127.0.0.1:18000:127.0.0.1:8000 YOUR_OWN_GUEST\n```", "```sh\npython3 shared/check_service.py --url http://127.0.0.1:18000 --expect-release ansible-v1\n```", "Compare the observed result with your prediction and retain the commands/output in notes/ansible-configuration.md. The intended configuration is applied and a repeated run is idempotent; a drifted service recovers without mutating an unrelated target."]
