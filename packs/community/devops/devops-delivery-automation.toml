"steps" = ["Build and verify a source artifact, then copy its verified entrypoint into a fresh minimal build context. This ties the image bytes to the artifact, rather than building an unrelated working-tree copy. Record the resolved base reference and image ID.", "```sh\npython3 shared/release.py build --source shared/relay.py --out work/ci-artifact --release image-v1 --revision local-reviewed\npython3 shared/release.py verify --artifact work/ci-artifact\nmkdir -p work/image-context/shared\ncp work/ci-artifact/relay.py work/image-context/shared/relay.py\ncp Dockerfile work/image-context/Dockerfile\ncmp work/ci-artifact/relay.py work/image-context/shared/relay.py\ndocker pull python:3.12-slim\ndocker image inspect python:3.12-slim --format '{{json .RepoDigests}}'\ndocker build -t ascend-relay:v1 work/image-context\ndocker image inspect ascend-relay:v1 --format '{{.Id}}'\n```", "For a repeatable rebuild, replace the mutable PYTHON_IMAGE default with the actual repo@sha256 digest you just inspected using docker build --build-arg PYTHON_IMAGE=YOUR_RECORDED_BASE_REFERENCE. Keep the Dockerfile and that reference with the image record.", "Run the image under a disposable name and loopback port. Compare runtime /version with the image metadata and configuration.", "```sh\ndocker run --rm --name ascend-relay-image -p 127.0.0.1:18000:8000 ascend-relay:v1\n```", "```sh\npython3 shared/check_service.py --url http://127.0.0.1:18000 --expect-release container-v1\n```", "For the registry variant, authenticate only to your owned namespace, push the chosen image, record its repository digest, then pull/run that exact digest in another disposable environment. Keep registry secrets out of the notebook.", "Compare the observed result with your prediction and retain the commands/output in notes/image-identity.md. The learner distinguishes source, base, image and runtime identity; a moved-tag negative case cannot silently replace the intended release."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
