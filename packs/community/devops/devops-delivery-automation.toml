"steps" = ["Read gitignore.example and initialize an isolated learning repository in the extracted folder if you do not already have one. Record the original shared files before the experiment. Run the reference checks: they create temporary loopback services and verify actual response, data, release and recovery behaviour.", "```sh\npython3 shared/selfcheck.py\n```", "In a working source copy, change the unknown-endpoint response from 404 to 200. Predict which control will fail, rerun the selfchecks, and retain the actual failure.", "Restore the correct behaviour through Git or your saved source copy. Add a new control not already present, such as rejecting a missing message field, and make an intentional regression prove that control fails for the intended reason.", "```sh\ngit diff -- shared/relay.py shared/selfcheck.py\npython3 shared/selfcheck.py\n```", "Compare the observed result with your prediction and retain the commands/output in notes/change-test.md. An intended wrong behaviour is detected; the legitimate control stays covered and the source change is traceable."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "An intended wrong behaviour is detected; the legitimate control stays covered and the source change is traceable. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

