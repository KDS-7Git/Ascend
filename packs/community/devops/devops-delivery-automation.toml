"steps" = ["Build the local Relay image and record its exact image ID. Inspect configs/tofu/main.tf: it creates a named lab network, volume and container with a loopback publication.", "```sh\ndocker build -t ascend-relay:v1 .\ndocker image inspect ascend-relay:v1 --format '{{.Id}}'\ncd configs/tofu\ntofu init\n```", "Replace the example image ID below with your observed sha256 ID. Inspect the plan before applying it; retain .terraform.lock.hcl with the reviewed source, while state stays private.", "```sh\ntofu plan -var='relay_image_id=sha256:REPLACE_WITH_LOCAL_IMAGE_ID' -out=reviewed.plan\ntofu show reviewed.plan\ntofu apply reviewed.plan\n```", "From the track root, run the following version/write check. Change the release variable in a new reviewed plan and inspect whether replacement is required before applying. Keep a backup before any operation that could remove the owned data volume.", "```sh\ncd ../..\npython3 shared/check_service.py --url http://127.0.0.1:18000 --expect-release tofu-v1 --write\n```", "Inspect the actual named container/network/volume and compare with tofu state list. A saved plan alone is not evidence of provisioned infrastructure.", "Compare the observed result with your prediction and retain the commands/output in notes/iac-plan-apply.md. Plan, applied inventory and observed service agree; drift is detected; restoration or teardown follows an explicit data/ownership decision."]
