"brief" = "Concurrency is work in progress; parallelism is simultaneous execution. Worker/pool/queue limits and CPU quota describe different boundaries. A closed client slows its offered work when the service slows."
"steps" = ["Start an isolated service with a short simulated dependency delay and small worker limit. It remains a local experiment, not a stress test of the shared Ascend machine.", "```sh\npython3 shared/relay.py --port 8000 --data work/load.sqlite --release load-v1 --workers 2 --delay-ms 120\n```", "Run a bounded client experiment and record its printed actual window. Use that window when analyzing the CSV rather than inventing a duration.", "```sh\npython3 shared/probe_load.py --clients 4 --requests 24 --output notes/load-two-workers.csv\n```", "Use the window_seconds printed by that run: python3 shared/analyze.py notes/load-two-workers.csv --window-seconds YOUR_OBSERVED_SECONDS. The default objectives are illustrative; rejected work may correctly make this overload experiment exit with status 1.", "Repeat with one controlled change, such as --workers 1 or --delay-ms 250, using a new output filename. Inspect successful, rejected and failed work plus response durations.", "With k6 installed, run the supplied low-rate ten-second fixed-arrival exercise and record dropped_iterations as well as latency/errors.", "```sh\nk6 run configs/k6.js\n```", "Compare the observed result with your prediction and retain the commands/output in notes/bounded-capacity.md. The comparison counts all work, identifies the limiting boundary, preserves correctness and states the measurement scope and generator limits."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "The comparison counts all work, identifies the limiting boundary, preserves correctness and states the measurement scope and generator limits. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

