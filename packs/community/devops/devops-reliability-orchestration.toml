"id" = "service-signals-practice"
"title" = "Practice: Measure service signals and an SLO"
"size" = "M"
"minutes" = 60
"needs" = []
"brief" = "Latency, traffic, errors and saturation describe different aspects of service behaviour. Count failed/dropped work in the denominator; a lower average after rejecting most traffic is not improved capacity."
"steps" = ["Inspect the recorded baseline and incident CSV fixtures. Both contain 50 attempted requests in the stated 60-second window. Predict which thresholds fail.", "```sh\npython3 shared/analyze.py fixtures/baseline.csv --window-seconds 60\npython3 shared/analyze.py fixtures/incident.csv --window-seconds 60\n```", "Start a real v1 Relay in Terminal A, then inspect /metrics before and after several checks in Terminal B. The counter names distinguish responses, active connections and admission rejections.", "```sh\npython3 shared/relay.py --data work/signals.sqlite --release v1\n```", "```sh\ncurl http://127.0.0.1:8000/metrics\npython3 shared/check_service.py --expect-release v1\ncurl http://127.0.0.1:8000/metrics\n```", "For the live extension, start a local Prometheus with short bounded retention. The supplied target expects Relay on the same host; use the correct actual address if you choose another topology.", "```sh\nprometheus --config.file=configs/prometheus.yml --storage.tsdb.path=work/prometheus --storage.tsdb.retention.time=1h --storage.tsdb.retention.size=128MB --web.listen-address=127.0.0.1:9090\n```", "Query rate(relay_admission_rejected_total[1m]) and target up. Optionally import configs/grafana-dashboard.json into your own local Grafana and select the actual datasource.", "Compare the observed result with your prediction and retain the commands/output in notes/service-signals.md. Correct calculations include all attempts and units; live metrics are distinct from recorded datasets; the learner rejects a misleading green/low-CPU conclusion."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "Correct calculations include all attempts and units; live metrics are distinct from recorded datasets; the learner rejects a misleading green/low-CPU conclusion. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

