"steps" = ["Stop conflicting local deployments. Check kind get clusters first; if ascend-relay already exists, identify its owner and choose an unused lab name or intentionally resume your own cluster. The commands below assume this is a new, distinctly named learner-owned cluster.", "```sh\ndocker build -t ascend-relay:v1 .\nkind create cluster --name ascend-relay\nkind load docker-image ascend-relay:v1 --name ascend-relay\nkubectl --context kind-ascend-relay apply -f configs/namespace.yaml\n```", "Inspect deployment.yaml before applying. It runs two read-only replicas with bounded resources and an ephemeral scratch volume; it is not a writable replicated SQLite design.", "```sh\nkubectl --context kind-ascend-relay apply -f configs/deployment.yaml -f configs/service.yaml\nkubectl --context kind-ascend-relay -n ascend-relay rollout status deployment/relay --timeout=120s\nkubectl --context kind-ascend-relay -n ascend-relay get pods,service,endpoints\n```", "Keep a port-forward in one terminal and verify the actual service from another.", "```sh\nkubectl --context kind-ascend-relay -n ascend-relay port-forward service/relay 18000:80\n```", "```sh\npython3 shared/check_service.py --url http://127.0.0.1:18000 --expect-release k8s-v1\n```", "Compare the observed result with your prediction and retain the commands/output in notes/kubernetes-basics.md. A real cluster serves the expected version; readiness/selection and read-only controls are demonstrated without claiming physical HA."]
