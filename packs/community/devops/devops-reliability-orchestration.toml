"steps" = ["Inventory only the lab's processes/containers/volumes and record host reserve. Use OS tools and the actual resource controls before proposing more replicas.", "```sh\ndf -h\ndf -i\ndocker system df\ndocker stats --no-stream\n```", "Review the supplied container/Pod memory and CPU limits. Record whether the chosen boundary is a quota, weight, request or maximum, and inspect actual events when a bounded owned workload exceeds it.", "For a concrete memory-bound experiment, first confirm ascend-relay-budget is an unused container name. The following container has no network or persistent volume and an explicit 48 MiB cap; it attempts one 80 MiB allocation. An unsupported memory controller or swap setting is a setup failure to diagnose, not evidence that the limit worked.\n```sh\ndocker run --name ascend-relay-budget --memory 48m --memory-swap 48m --cpus 0.25 --network none python:3.12-slim python -c \"sample = bytearray(80 * 1024 * 1024); print(len(sample))\"\ndocker inspect ascend-relay-budget --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}'\ndocker rm ascend-relay-budget\n```", "Keep logs and Prometheus retention bounded on the learner PC. For a systemd guest, inspect its journal usage and configure a guest-local retention policy after retaining required evidence.", "```sh\njournalctl --disk-usage\nsystemctl show ascend-relay -p MemoryMax -p TasksMax\n```", "When available, run the same service on a supported Pi or spare PC. Record uname -m, actual memory, power/cooling and storage observations, with the same release and workload. The advantage is an independent, always-on physical host; a VM on your PC covers software practice without buying hardware, but does not measure flash endurance or a separate power failure.", "Compare the observed result with your prediction and retain the commands/output in notes/operating-budget.md. The learner accounts for aggregate resources and writes, demonstrates bounded failure/recovery, and distinguishes PC models from physical-device measurements."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "The learner accounts for aggregate resources and writes, demonstrates bounded failure/recovery, and distinguishes PC models from physical-device measurements. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

