"steps" = ["Record the current working revision and readiness. Cause a scoped image failure by selecting an unavailable local image; imagePullPolicy Never makes the failure visible without pulling arbitrary content.", "```sh\nkubectl --context kind-ascend-relay -n ascend-relay rollout history deployment/relay\nkubectl --context kind-ascend-relay -n ascend-relay set image deployment/relay relay=ascend-relay:missing\nkubectl --context kind-ascend-relay -n ascend-relay get pods\nkubectl --context kind-ascend-relay -n ascend-relay describe deployment relay\n```", "Recover the recorded good revision and require ready endpoints again.", "```sh\nkubectl --context kind-ascend-relay -n ascend-relay rollout undo deployment/relay\nkubectl --context kind-ascend-relay -n ascend-relay rollout status deployment/relay --timeout=120s\n```", "Create a scoped observer service account and bind the provided read-only role only in this namespace. Use the lab administrator's impersonation capability to check intended permissions.", "```sh\nkubectl --context kind-ascend-relay -n ascend-relay create serviceaccount observer\nkubectl --context kind-ascend-relay apply -f configs/read-only-role.yaml\nkubectl --context kind-ascend-relay -n ascend-relay create rolebinding observer --role=observer --serviceaccount=ascend-relay:observer\nkubectl --context kind-ascend-relay -n ascend-relay auth can-i get pods --as=system:serviceaccount:ascend-relay:observer\nkubectl --context kind-ascend-relay -n ascend-relay auth can-i delete deployments --as=system:serviceaccount:ascend-relay:observer\n```", "Compare the observed result with your prediction and retain the commands/output in notes/rollout-and-permissions.md. A failed rollout is recovered, correct ready endpoints return, and allowed/denied API permissions are observed in the declared lab scope."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "A failed rollout is recovered, correct ready endpoints return, and allowed/denied API permissions are observed in the declared lab scope. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

