"steps" = ["Start a dedicated stateful service and add a named synthetic update. Record its ID and the clock time before the backup.", "```sh\npython3 shared/relay.py --data work/recovery.sqlite --release recovery-v1\n```", "```sh\npython3 shared/check_service.py --expect-release recovery-v1 --write\npython3 shared/backup.py create --source work/recovery.sqlite --destination backups/before-incident.sqlite\n```", "Write another update after the snapshot while the service is still running; retain the new ID.", "```sh\npython3 shared/check_service.py --expect-release recovery-v1 --write\n```", "Now stop the original service with Ctrl+C. Restore into a new path; the helper refuses to overwrite an existing database.\n```sh\npython3 shared/backup.py restore --source backups/before-incident.sqlite --destination restored/relay.sqlite\npython3 shared/backup.py inspect --source restored/relay.sqlite\n```", "Start a new service using restored/relay.sqlite while the original is stopped. Compare IDs, record counts and logical-record hashes, including the deliberately lost later write.", "```sh\npython3 shared/relay.py --data restored/relay.sqlite --release recovered-v1\n```", "Compare the observed result with your prediction and retain the commands/output in notes/consistent-recovery.md. A clean service uses restored data while the original is stopped; integrity/count/hash controls pass and data loss/recovery time are honestly measured."]
