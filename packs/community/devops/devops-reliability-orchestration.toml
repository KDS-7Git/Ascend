"needs" = []
"brief" = "Credentials grant authority and must be revocable; artifact digests detect content changes but do not establish who signed them. Store secrets outside release artifacts and restrict their local permissions."
"steps" = ["Create a synthetic token file and start a fresh service using it. Run an authenticated write check, then attempt the same write without credentials.", "```sh\nmkdir -p secrets work notes\nprintf '%s\\n' 'synthetic-old-token' > secrets/write-token.txt\nchmod 600 secrets/write-token.txt\npython3 shared/relay.py --data work/secret.sqlite --release secret-v1 --token-file secrets/write-token.txt\n```", "```sh\npython3 shared/check_service.py --expect-release secret-v1 --write --token-file secrets/write-token.txt\npython3 shared/check_service.py --expect-release secret-v1 --write\n```", "Save a separate old-client token file, replace the server token file with a new synthetic value, and show that the old client fails while the new client succeeds. Never paste actual tokens into the notebook.", "Build a source artifact and use a temporary local signing key to sign its manifest. Keep the signature outside the immutable artifact directory.", "```sh\npython3 shared/release.py build --source shared/relay.py --out work/signed-artifact --release signed-v1 --revision local-reviewed\nopenssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out secrets/signing.pem\nopenssl pkey -in secrets/signing.pem -pubout -out notes/signer-public.pem\nopenssl dgst -sha256 -sign secrets/signing.pem -out notes/manifest.sig work/signed-artifact/manifest.json\nopenssl dgst -sha256 -verify notes/signer-public.pem -signature notes/manifest.sig work/signed-artifact/manifest.json\n```", "Compare the observed result with your prediction and retain the commands/output in notes/secret-and-artifact.md. Old credentials are denied, current legitimate writes work, and altered content fails signature/digest controls with accurately scoped signer trust."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "Old credentials are denied, current legitimate writes work, and altered content fails signature/digest controls with accurately scoped signer trust. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

