"steps" = ["Extract the ZIP into its own folder. Terminal A stays open while the service runs. The startup record gives the actual database location. Only synthetic notes belong here.", "```sh\npython3 shared/relay.py --host 127.0.0.1 --port 8000 --data work/relay.sqlite --release v1\n```", "In Terminal B, predict each response before checking it. The explicit write creates one sample update and verifies replay/conflict handling.", "```sh\npython3 shared/check_service.py --url http://127.0.0.1:8000 --expect-release v1 --write\n```", "Compare the working URL with port 8001 (where you have started nothing) and /not-an-endpoint. Connection refusal and HTTP 404 come from different layers.", "```sh\ncurl -i http://127.0.0.1:8000/version\ncurl -i http://127.0.0.1:8001/version\ncurl -i http://127.0.0.1:8000/not-an-endpoint\n```", "Compare the observed result with your prediction and retain the commands/output in notes/request-path.md. A request trace identifies the process/address, three distinct failure types and the correct version; actual update and replay results are retained."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "A request trace identifies the process/address, three distinct failure types and the correct version; actual update and replay results are retained. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

