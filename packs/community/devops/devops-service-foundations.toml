"brief" = "Source revision, immutable build output, runtime configuration and persistent data serve different purposes. A checksum detects an artifact change; it does not authenticate who produced it."
"steps" = ["Initialize a separate learning repository in the extracted track folder if needed. Copy gitignore.example to .gitignore before recording source; leave keys, databases and notes untracked.", "```sh\ngit init\ncp gitignore.example .gitignore\ngit add shared Dockerfile configs .gitignore\ngit status\n```", "Commit using your chosen local identity, then record the resulting commit ID. Build two copies with the same source and revision; the manifests should match.", "```sh\ngit -c user.name='Relay Learner' -c user.email='learner@example.invalid' commit -m 'Start Relay lab'\npython3 shared/release.py build --source shared/relay.py --out work/releases/v1 --release v1 --revision \"$(git rev-parse HEAD)\"\npython3 shared/release.py build --source shared/relay.py --out work/releases/v1-copy --release v1 --revision \"$(git rev-parse HEAD)\"\ndiff work/releases/v1/manifest.json work/releases/v1-copy/manifest.json\n```", "Inspect the manifest, select the artifact, and run the selected release in a terminal. Configuration and data stay outside the artifact.", "```sh\npython3 shared/release.py verify --artifact work/releases/v1\npython3 shared/release.py select --artifact work/releases/v1 --state work/current.json\npython3 shared/release.py serve --state work/current.json -- --port 8000 --data work/runtime.sqlite\n```", "Compare the observed result with your prediction and retain the commands/output in notes/versioned-artifact.md. Two identical inputs produce identical manifests; a modified artifact is rejected; v2 has a traceable source/release identity and separate runtime state."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "Two identical inputs produce identical manifests; a modified artifact is rejected; v2 has a traceable source/release identity and separate runtime state. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

