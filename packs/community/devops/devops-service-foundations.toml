"steps" = ["Copy configs/ssh_config.example to a working file, replace its documentation address/user with your owned guest, and choose a dedicated key. Verify its public host-key fingerprint through the guest console before accepting it.", "```sh\nmkdir -p work\ncp configs/ssh_config.example work/ssh_config\nssh -F work/ssh_config relay-lab\n```", "On the guest, prepare a private learning folder; from your PC copy only the reviewed shared tools and service materials. Keep synthetic credentials out of the artifact.", "```sh\nssh -F work/ssh_config relay-lab 'mkdir -p ascend-relay-lab'\nscp -F work/ssh_config -r shared configs relay-lab:ascend-relay-lab/\n```", "Inside the guest, use the service-lifecycle procedure, or start this foreground equivalent from ascend-relay-lab: python3 shared/relay.py --data work/relay.sqlite --release service-v1. Keep that guest terminal open. From a separate PC terminal, forward one private service port.", "```sh\nssh -F work/ssh_config -N -L 127.0.0.1:18000:127.0.0.1:8000 relay-lab\n```", "```sh\npython3 shared/check_service.py --url http://127.0.0.1:18000 --expect-release service-v1\n```", "Compare the observed result with your prediction and retain the commands/output in notes/ssh-deployment.md. The intended guest and release are reached through a scoped authenticated path; a wrong destination is diagnosed and forwarding cleanup is observed."]
