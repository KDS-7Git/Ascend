"level" = "service-lifecycle"
"resource" = "https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html"
"resource_label" = "Free technical reference"
"resource_note" = "The bundled lesson defines the practical task. This optional official reference explains the underlying tool or mechanism; a paid course is not required."
"preview" = "Keep a service running across process failure and a guest reboot while preserving its data."
"requirements" = "An owned Debian/Ubuntu-class Linux guest with systemd, Python and sudo; guest console recovery available."
"setup" = "Download /training/devops-service-foundations.zip and extract it into a new folder you choose on your own PC. Open a terminal in the extracted devops-service-foundations folder; commands use that folder unless a step explicitly changes it. Read README.md and shared/README.md. The core tools need Python 3.11+ and no Python packages. Shell examples use Linux/macOS; use a Linux guest or WSL for POSIX commands on Windows. Keep foreground services in separate terminals and stop earlier listeners before reusing a port. Create notes/service-lifecycle.md from notes-template.md in your editor and keep predictions, exact commands, observed output and explanations there. If that file already exists, append a dated attempt or choose a new name. work/, data/, backups/ and restored/ hold the explicitly named local outputs. These files stay on your computer; opening a challenge does not create or upload them. Use Ascend's notebook or chosen upload control only when you intend to copy evidence into Ascend."
"materials" = [{ "label" = "Download this track's runnable lab files", "url" = "/training/devops-service-foundations.zip" }]
"verify" = { "type" = "manual" }
"auto_complete" = false
"id" = "service-lifecycle-practice"
"title" = "Practice: Operate a persistent Linux service"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "systemd owns a process lifecycle, identity, working directory and restart policy. Liveness, readiness and durable data differ. Restart=on-failure is not an availability guarantee when the host loses power."
"steps" = ["Perform the following only inside your disposable guest, after copying the extracted track there. Inspect configs/relay.service; it uses DynamicUser and StateDirectory to avoid a permanent privileged application user.", "```sh\nsudo install -d /opt/ascend-relay/shared\nsudo install -m 0644 shared/relay.py /opt/ascend-relay/shared/relay.py\nsudo install -m 0644 configs/relay.service /etc/systemd/system/ascend-relay.service\nsudo systemctl daemon-reload\nsudo systemctl enable --now ascend-relay\n```", "Check lifecycle and application state independently. Record the service user and its actual data path.", "```sh\nsystemctl status ascend-relay --no-pager\nsystemctl show ascend-relay -p MainPID -p User -p StateDirectory\njournalctl -u ascend-relay -n 20 --no-pager\npython3 shared/check_service.py --expect-release service-v1 --write\n```", "Stop just the owned process through systemd's signal interface, observe recovery, then deliberately stop the unit. A requested stop should remain stopped.", "```sh\nsudo systemctl kill --signal=SIGKILL --kill-whom=main ascend-relay\nsleep 3\nsystemctl is-active ascend-relay\nsudo systemctl stop ascend-relay\nsystemctl is-active ascend-relay\n```", "Start it again, reboot the owned guest through its normal controls, reconnect and verify that the saved synthetic update survives. Do not reboot the shared Ascend server.", "Compare the observed result with your prediction and retain the commands/output in notes/service-lifecycle.md. A process failure recovers, a deliberate stop remains stopped, reboot restores the service, and required state survives; wrong configuration is diagnosed from observed evidence."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "A process failure recovers, a deliberate stop remains stopped, reboot restores the service, and required state survives; wrong configuration is diagnosed from observed evidence. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

