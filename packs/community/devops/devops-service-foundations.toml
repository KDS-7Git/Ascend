"resource" = "https://caddyserver.com/docs/caddyfile/directives/reverse_proxy"
"resource_label" = "Free technical reference"
"resource_note" = "The bundled lesson defines the practical task. This optional official reference explains the underlying tool or mechanism; a paid course is not required."
"preview" = "Route requests through a private edge and prove TLS name and trust behaviour."
"requirements" = "Python 3.11+ for the local proxy; Caddy and OpenSSL for the real TLS extension."
"setup" = "Download /training/devops-service-foundations.zip and extract it into a new folder you choose on your own PC. Open a terminal in the extracted devops-service-foundations folder; commands use that folder unless a step explicitly changes it. Read README.md and shared/README.md. The core tools need Python 3.11+ and no Python packages. Shell examples use Linux/macOS; use a Linux guest or WSL for POSIX commands on Windows. Keep foreground services in separate terminals and stop earlier listeners before reusing a port. Create notes/edge-tls.md from notes-template.md in your editor and keep predictions, exact commands, observed output and explanations there. If that file already exists, append a dated attempt or choose a new name. work/, data/, backups/ and restored/ hold the explicitly named local outputs. These files stay on your computer; opening a challenge does not create or upload them. Use Ascend's notebook or chosen upload control only when you intend to copy evidence into Ascend."
"materials" = [{ "label" = "Download this track's runnable lab files", "url" = "/training/devops-service-foundations.zip" }]
"verify" = { "type" = "manual" }
"auto_complete" = false
"id" = "edge-tls-practice"
"title" = "Practice: Reach a service through an edge"
"size" = "M"
"minutes" = 60
"needs" = []
"brief" = "The reverse proxy has its own listener and upstream. TLS authenticates a hostname under a trusted CA; trust failure and name mismatch are different. A working process can remain unreachable through an incorrect edge route."
"steps" = ["Start a fresh Relay v1 on port 8000 in Terminal A using the following command. Terminal B will run the edge; Terminal C will run the clients.", "```sh\npython3 shared/relay.py --port 8000 --data work/edge.sqlite --release v1\n```", "```sh\npython3 shared/edge.py --config configs/route.json --port 9000\n```", "```sh\ncurl -i http://127.0.0.1:8000/version\ncurl -i http://127.0.0.1:9000/version\n```", "Stop the teaching edge. Run the equivalent Caddy configuration and compare behaviour. Keep Caddy's listener and origin private to this machine.", "```sh\ncaddy validate --config configs/Caddyfile --adapter caddyfile\ncaddy run --config configs/Caddyfile --adapter caddyfile\n```", "Stop that Caddy process before the TLS extension. Generate a temporary lab certificate, then run the supplied TLS edge. This certificate is trusted only by the following client invocation.", "```sh\nmkdir -p work\nopenssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout work/key.pem -out work/cert.pem -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost'\ncaddy run --config configs/Caddyfile.tls --adapter caddyfile\n```", "```sh\npython3 shared/check_service.py --url https://localhost:9443 --ca-file work/cert.pem --expect-release v1\ncurl --cacert work/cert.pem https://127.0.0.1:9443/version\n```", "Compare the observed result with your prediction and retain the commands/output in notes/edge-tls.md. Direct and edge observations locate a routing fault, legitimate controls survive the repair, and TLS trust/name negative controls reject as expected."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "Direct and edge observations locate a routing fault, legitimate controls survive the repair, and TLS trust/name negative controls reject as expected. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

