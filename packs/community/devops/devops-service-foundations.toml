"steps" = ["Use a fresh local process first; the owned-guest extension can use its systemd data path. From the track root, build/select an identifiable artifact and start it in Terminal A.", "```sh\npython3 shared/release.py build --source shared/relay.py --out work/foundation-artifact --release foundation-v1 --revision local-capstone\npython3 shared/release.py select --artifact work/foundation-artifact --state work/foundation-current.json\npython3 shared/release.py serve --state work/foundation-current.json -- --port 8000 --data work/foundation.sqlite\n```", "In Terminal B start the supplied teaching edge; in Terminal C require the intended release directly and through the edge. Write one synthetic update directly, since the teaching edge is GET-only.", "```sh\npython3 shared/edge.py --config configs/route.json --port 9000\n```", "```sh\npython3 shared/check_service.py --expect-release foundation-v1 --write\npython3 shared/check_service.py --url http://127.0.0.1:9000 --expect-release foundation-v1\npython3 shared/backup.py create --source work/foundation.sqlite --destination backups/foundation.sqlite\n```", "Record the update ID, artifact identity and actual state path. Stop only the teaching edge, then restart it using configs/route-fault.json. Diagnose the failure with direct and edge observations before repairing the route in a working copy.", "Write a handover with the actual release, start/stop commands, restore-to-new-path command, access method, save locations and known limits. A guest variant must inspect its actual /var/lib/ascend-relay state location instead of copying the local work path.", "Compare the observed result with your prediction and retain the commands/output in notes/foundation-capstone.md. A fresh target reproduces the correct release and retained data; the learner diagnoses two distinct faults and provides a usable runbook."]
