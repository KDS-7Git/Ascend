"brief" = "Quoting, paths, permissions, pipes, redirection, exit status and process signals explain why a service starts in one terminal but fails elsewhere. Use a disposable Linux guest for OS operations; owning a terminal does not grant host administration."
"steps" = ["Read shared/README.md. In your extracted folder create named working locations, and keep terminal output separate from application state.", "```sh\nmkdir -p work notes\npython3 --version\npwd\nls -la shared\npython3 shared/relay.py --help > notes/relay-help.txt\n```", "Start Relay in Terminal A using a data path containing a space; quote it. Observe the process and listener from Terminal B.", "```sh\npython3 shared/relay.py --data 'work/first service/relay.sqlite' --release shell-v1\n```", "```sh\nps -ef | grep '[r]elay.py'\nss -ltnp\npython3 shared/check_service.py --expect-release shell-v1\n```", "While the service is stopped, create a new synthetic token file with restricted permissions and inspect its owner. Do not copy a real key into the archive.", "```sh\nmkdir -p secrets\nprintf '%s\\n' 'synthetic-first-token' > secrets/write-token.txt\nchmod 600 secrets/write-token.txt\nls -l secrets/write-token.txt\n```", "Compare the observed result with your prediction and retain the commands/output in notes/linux-shell.md. The learner explains actual stdout/stderr and exit behaviour, repairs a file/identity fault with narrow permissions, and proves the legitimate path works."]
"hints" = ["Use the actual listener, release identity and state path printed by your process; a healthy service at another address may be the wrong deployment.", "If a required environment is unavailable, keep preparation as partial progress and return for the live operation."]
"done_when" = "The learner explains actual stdout/stderr and exit behaviour, repairs a file/identity fault with narrow permissions, and proves the legitimate path works. Review the observations and explanation in your local notes before marking done. A required live operation remains incomplete until you perform it in the stated environment. Manual completion records your assessment; local tool output or a saved file does not automatically verify skill."

