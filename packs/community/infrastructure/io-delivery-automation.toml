"brief" = "Promotion should move the tested artifact into the target, not build a different artifact under the same name. Rollback restores an earlier release only when data/schema compatibility permits it. Keep state separate, serialize competing release changes, and test behaviour and version after promotion and recovery."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 05 --variant guided --out work/05-guided\npython3 lab.py check work/05-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/05-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/05.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Build two retained local artifacts; this example changes release metadata, not database schema.\n# Use actual source revisions from your owned repository in place of the illustrative revision labels.\npython3 shared/release.py build --out work/artifacts/v1 --release v1 --revision lab-revision-v1\npython3 shared/release.py build --out work/artifacts/v2 --release v2 --revision lab-revision-v2\npython3 shared/release.py verify --artifact work/artifacts/v1\npython3 shared/release.py select --artifact work/artifacts/v1 --state work/current.json\n# Terminal A: serve the selected artifact. It owns its release label; do not override it.\npython3 shared/release.py serve --state work/current.json -- --host 127.0.0.1 --port 8000 --data work/release-data.sqlite\n# CLIENT: python3 shared/check_service.py --url http://127.0.0.1:8000 --expect-release v1 --write\n# Stop A. Then select the already built v2 and start serve again:\npython3 shared/release.py select --artifact work/artifacts/v2 --state work/current.json\npython3 shared/release.py resolve --state work/current.json\n# Restart the same serve command in A; CLIENT expected v1 now fails, expected v2 passes.\n# Stop A, select the RETAINED v1 artifact and start serve again. Verify version AND prior updates.\n# Selecting a pointer does not reload a running process; the explicit stop/start is part of this procedure.\n```", "Observe these controls and retain actual output: Show the exact artifact identity, detected wrong-version control and restored version/data. Explain separately why this stateless-compatible change does not prove rollback of a destructive schema migration.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
