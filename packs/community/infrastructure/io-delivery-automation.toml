"title" = "Operate: Package the runtime"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "An image packages application/runtime inputs; a container is a process using that image. Writable runtime state belongs in an explicit persistent location. A recreated container may otherwise lose data even when its image remains available. Build once, inspect the image identity, and use a non-root runtime identity with a writable data volume."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 02 --variant guided --out work/02-guided\npython3 lab.py check work/02-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/02-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/02.md. Predict a successful response and a failure before running the following native operations.", "```sh\ndocker build -f inputs/02/Dockerfile -t ascend-relay:lab .\ndocker image inspect ascend-relay:lab --format '{{.Id}}'\ndocker volume create ascend-relay-data\ndocker run --name ascend-relay-lab --rm -p 127.0.0.1:8088:8000 -v ascend-relay-data:/data ascend-relay:lab\n# Second terminal: python3 shared/check_service.py --url http://127.0.0.1:8088 --expect-release container-v1 --write\n# Stop only ascend-relay-lab, recreate with the SAME volume, and inspect /api/updates.\n# Delete only your named practice volume after recording/backup if no longer needed.\n```", "Observe these controls and retain actual output: Non-root service works, expected image/version is observed and a recorded update survives recreation with the same volume. Track base-image digest during reviewed release authoring.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 02 --out work/02-reference. Record that help was used."]
"done_when" = "Non-root service works, expected image/version is observed and a recorded update survives recreation with the same volume. Track base-image digest during reviewed release authoring. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
