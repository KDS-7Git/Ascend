"id" = "io-delivery-automation-01-practice"
"title" = "Operate: Build an identifiable release"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "A release record connects source revision, tested inputs and an artifact digest to what is actually running. A mutable tag or a directory name cannot establish that identity. Build in an owned workspace, preserve the inputs, and compare the deployed version with the recorded artifact before calling a release successful."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 01 --variant guided --out work/01-guided\npython3 lab.py check work/01-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/01-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/01.md. Predict a successful response and a failure before running the following native operations.", "```sh\nmkdir -p work/release\ncp shared/relay.py work/release/relay.py\ngit -C work/release init\ngit -C work/release add relay.py\ngit -C work/release -c user.name='Lab Learner' -c user.email='learner@example.invalid' commit -m 'Create synthetic Relay release'\ngit -C work/release rev-parse HEAD\npython3 lab.py fingerprint work/release/relay.py\npython3 work/release/relay.py --host 127.0.0.1 --port 8000 --data work/release/relay.sqlite --release artifact-v1\n# Second terminal: python3 shared/check_service.py --url http://127.0.0.1:8000 --expect-release artifact-v1\n```", "Observe these controls and retain actual output: Retain commit/digest and actual running-release evidence, then show a different release is rejected by the expected-release checker.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 01 --out work/01-reference. Record that help was used."]
"done_when" = "Retain commit/digest and actual running-release evidence, then show a different release is rejected by the expected-release checker. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
"checkpoints" = [{ "id" = "diagnosis", "title" = "Explain the failed control", "minutes" = 15, "done_when" = "A prediction and the portable check identify the failing control and state what real observation is still needed.", "next_step" = "Run the named native operation on the owned machine and collect its actual success/failure controls." }, { "id" = "observation", "title" = "Retain the native observation", "minutes" = 30, "done_when" = "The intended native positive and negative observations are retained with their environment and file paths.", "next_step" = "Recover the changed condition, check retained state/access, and complete the named cleanup." }]

