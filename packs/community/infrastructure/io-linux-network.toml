"brief" = "A URL names a protocol, host and optional port. The operating system delivers a TCP connection to a listening socket owned by a process; that process interprets HTTP. A DNS answer or a listening socket proves only one part of the path. Follow one request before changing configuration, and distinguish an HTTP error from failure to connect."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 01 --variant guided --out work/01-guided\npython3 lab.py check work/01-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/01-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/01.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# PC or service GUEST, in this extracted track directory; leave this terminal running.\nmkdir -p data\npython3 shared/relay.py --host 127.0.0.1 --port 8000 --data data/relay.sqlite --release v1\n```", "```sh\n# A second terminal in the SAME machine.\ncurl -i http://127.0.0.1:8000/health\ncurl -i http://127.0.0.1:8000/version\npython3 shared/check_service.py --url http://127.0.0.1:8000 --expect-release v1\n```", "```sh\nss -ltnp | sed -n '1,12p'\ncurl --max-time 2 -i http://127.0.0.1:8999/health\n# Stop Relay with Ctrl+C in its own terminal, then repeat the successful probe.\n```", "Observe these controls and retain actual output: Retain a 200 version response, the matching socket/process, a refused wrong-port request and refusal after stopping only this service.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 01 --out work/01-reference. Record that help was used."]
