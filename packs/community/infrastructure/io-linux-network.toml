"brief" = "A hosts-file substitution, recursive resolver response and authoritative DNS response are different observations. DNS TTL affects caching; changing an application does not repair a wrong A/AAAA record. A bad IPv6 answer can break some clients even when IPv4 works. Use an explicit resolver or curl address override to isolate DNS without claiming the override repaired public DNS."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 04 --variant guided --out work/04-guided\npython3 lab.py check work/04-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/04-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/04.md. Predict a successful response and a failure before running the following native operations.", "```sh\ndig example.com A\ndig example.com AAAA\ndig example.com NS\n# Record answer source and TTL, not only the IP address.\ncurl --resolve relay.test:8000:127.0.0.1 http://relay.test:8000/version\n# The --resolve command needs the local Relay process and affects this curl invocation only.\n```", "```sh\n# Optional isolated DNS GUEST, after installing dnsmasq in that disposable guest.\ndnsmasq --no-daemon --port=1053 --listen-address=127.0.0.1 --bind-interfaces --no-hosts --no-resolv --address=/relay.test/127.0.0.1\n# Second terminal: dig @127.0.0.1 -p 1053 relay.test A\n```", "Observe these controls and retain actual output: Retain the resolver/TTL and explicit override results. For a DNS repair, query the changed resolver again; an HTTP override alone is not DNS evidence.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 04 --out work/04-reference. Record that help was used."]
