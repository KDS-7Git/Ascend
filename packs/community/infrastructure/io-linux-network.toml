"brief" = "The shell parses words before it starts a process. Quoting preserves spaces; pipes connect stdout to stdin; redirection opens a file and stdout/stderr are different streams. Permissions apply to identities and directories as well as a file. Solve the actual path or access problem rather than making all files world-writable."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 02 --variant guided --out work/02-guided\npython3 lab.py check work/02-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/02-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/02.md. Predict a successful response and a failure before running the following native operations.", "```sh\nmkdir -p work/shell\npython3 -c 'import sys; print(\"normal output\"); print(\"diagnostic output\",file=sys.stderr)' > work/shell/stdout.txt 2> work/shell/stderr.txt\ncat work/shell/stdout.txt\ncat work/shell/stderr.txt\nprintf '%s\n' 'two words' | wc -w\ntouch 'work/shell/file with spaces.txt'\nls -l 'work/shell/file with spaces.txt'\nchmod 600 'work/shell/file with spaces.txt'\nstat 'work/shell/file with spaces.txt'\n```", "```sh\n# Optional identity control, only inside your disposable Linux GUEST.\nsudo useradd --system --shell /usr/sbin/nologin ascend-reader\nsudo install -d -m 0755 /var/tmp/ascend-permissions\nprintf 'synthetic practice value\n' > work/shell/synthetic-secret\nsudo install -o \"$USER\" -m 0600 work/shell/synthetic-secret /var/tmp/ascend-permissions/secret\ncat /var/tmp/ascend-permissions/secret\nsudo -u ascend-reader cat /var/tmp/ascend-permissions/secret\n# The last command must fail. Remove only this synthetic file and this newly created lab user at cleanup.\n```", "Observe these controls and retain actual output: Keep distinct output/error files, show the quoted spaced path works, and explain which identity can read the 0600 file. Do not claim another-user denial unless you actually test a second owned lab identity.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 02 --out work/02-reference. Record that help was used."]
"done_when" = "Keep distinct output/error files, show the quoted spaced path works, and explain which identity can read the 0600 file. Do not claim another-user denial unless you actually test a second owned lab identity. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
