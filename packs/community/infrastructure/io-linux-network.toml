"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 05 --variant guided --out work/05-guided\npython3 lab.py check work/05-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/05-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/05.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# PC or service GUEST, in this extracted track directory; leave this terminal running.\nmkdir -p data\npython3 shared/relay.py --host 127.0.0.1 --port 8000 --data data/relay.sqlite --release v1\n```", "```sh\n# A second terminal in the SAME machine.\ncurl -i http://127.0.0.1:8000/health\ncurl -i http://127.0.0.1:8000/version\npython3 shared/check_service.py --url http://127.0.0.1:8000 --expect-release v1\n```", "```sh\nmkdir -p work\ncurl --max-time 2 -v http://127.0.0.1:8999/\nopenssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout work/key.pem -out work/cert.pem -subj /CN=localhost -addext subjectAltName=DNS:localhost\nopenssl s_server -accept 127.0.0.1:8443 -cert work/cert.pem -key work/key.pem -www\n# Second terminal, same PC:\n# curl --cacert work/cert.pem https://localhost:8443/\n# curl --cacert work/cert.pem https://127.0.0.1:8443/    # name rejection\n# curl https://localhost:8443/                         # trust rejection\n```", "Observe these controls and retain actual output: The matching name with scoped CA succeeds; wrong name and untrusted certificate fail. Keep no private key in an uploaded public report.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
