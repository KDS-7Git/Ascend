"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 07 --variant guided --out work/07-guided\npython3 lab.py check work/07-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/07-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/07.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Disposable Linux SERVICE GUEST only; package installation needs its administrator.\nsudo apt-get update\nsudo apt-get install python3\nsudo useradd --system --home /opt/ascend-relay --shell /usr/sbin/nologin relaylab\nsudo install -d -o relaylab -g relaylab /opt/ascend-relay/data /opt/ascend-relay/shared\nsudo install -m 0644 shared/relay.py /opt/ascend-relay/shared/relay.py\nsudo install -m 0644 inputs/07/relay.service /etc/systemd/system/ascend-relay.service\nsudo systemctl daemon-reload\nsudo systemctl enable --now ascend-relay.service\nsystemctl status ascend-relay.service --no-pager\njournalctl -u ascend-relay.service -n 30 --no-pager\ncurl http://127.0.0.1:8000/version\n```", "Observe these controls and retain actual output: Reboot only the disposable guest, then verify service version and retained state. Stop/disable the named unit during cleanup; an unavailable guest reboot is incomplete operational evidence.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
