"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 01 --variant guided --out work/01-guided\npython3 lab.py check work/01-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/01-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/01.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# PC with reviewed Mailpit binary; loopback SMTP and UI only.\nmailpit --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025\n# Second terminal in the extracted track directory:\npython3 inputs/01/send_local.py\npython3 lab.py inspect-mail inputs/01/message.eml\n# Open http://127.0.0.1:8025 and compare the SMTP envelope with From/To headers.\n# Stop only this Mailpit process after retaining the synthetic capture.\n```", "Observe these controls and retain actual output: Inspect an actual local SMTP capture, identify envelope/header differences and verify a wrong local port fails. Do not send these demonstrations to external recipients.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
