"brief" = "Durable state needs a consistency boundary. SQLite WAL allows readers alongside a writer but still has a single-writer design; unrelated writable copies do not form a replicated database. Use the backup API rather than copying arbitrary live database/WAL files. Mailbox state similarly needs a known consistent backup procedure."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 07 --variant guided --out work/07-guided\npython3 lab.py check work/07-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/07-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/07.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# PC or service GUEST, in this extracted track directory; leave this terminal running.\nmkdir -p data\npython3 shared/relay.py --host 127.0.0.1 --port 8000 --data data/relay.sqlite --release v1\n```", "```sh\n# Second terminal after adding a synthetic update:\npython3 shared/check_service.py --url http://127.0.0.1:8000 --expect-release v1 --write\nmkdir -p work/backups\npython3 shared/backup.py create --source data/relay.sqlite --destination work/backups/relay-first.sqlite\npython3 shared/backup.py inspect --source work/backups/relay-first.sqlite\npython3 shared/backup.py restore --source work/backups/relay-first.sqlite --destination work/relay-restored.sqlite\n# Stop the original service, start a new instance using work/relay-restored.sqlite, and inspect the prior update.\n```", "Observe these controls and retain actual output: A clean target restores the required records and passes integrity/content checks while the original service is stopped. Record actual loss/recovery scope; a backup file existing is insufficient.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 07 --out work/07-reference. Record that help was used."]
