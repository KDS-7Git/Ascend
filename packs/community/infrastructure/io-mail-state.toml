"id" = "io-mail-state-02-practice"
"title" = "Operate: Run SMTP between owned hosts"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "An MTA accepts, queues, routes and delivers mail according to domain and relay policy. Local delivery for an owned test domain is different from forwarding arbitrary recipients. Start with a loopback-only MTA in a disposable guest, then a second isolated peer if available. Preserve the refusal of unauthorized relay while enabling the legitimate path."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 02 --variant guided --out work/02-guided\npython3 lab.py check work/02-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/02-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/02.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Disposable Ubuntu/Debian MAIL GUEST only; install/configure its Postfix interactively as local lab mail.\nsudo apt-get install postfix mailutils\nsudo postconf -e 'myhostname = mail.relay.test'\nsudo postconf -e 'mydestination = $myhostname, localhost.$mydomain, localhost, relay.test'\nsudo postconf -e 'inet_interfaces = loopback-only'\nsudo postconf -e 'mynetworks = 127.0.0.1/32 [::1]/128'\nsudo postconf -e 'smtpd_relay_restrictions = permit_mynetworks, permit_sasl_authenticated, reject_unauth_destination'\nsudo postfix check\nsudo systemctl restart postfix\npostconf -n\nprintf 'Synthetic local mail\n' | mail -s 'Relay lab' \"$USER\"\npostqueue -p\n# To add a second owned guest, declare only its explicit lab address and test relay rejection from an untrusted peer.\n```", "```sh\n# GUEST loopback negative control: 127.0.0.2 is outside the explicit trusted /32.\npython3 inputs/02/reject_relay.py\n# The script stops after RCPT rejection; it does not send DATA or contact an external host.\n```", "Observe these controls and retain actual output: Observe local acceptance/delivery and the 127.0.0.2 untrusted RCPT rejection, including its relay-policy status/text. A generic connectivity error or a rejection at MAIL is not this control.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 02 --out work/02-reference. Record that help was used."]
"done_when" = "Observe local acceptance/delivery and the 127.0.0.2 untrusted RCPT rejection, including its relay-policy status/text. A generic connectivity error or a rejection at MAIL is not this control. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
"checkpoints" = [{ "id" = "diagnosis", "title" = "Explain the failed control", "minutes" = 15, "done_when" = "A prediction and the portable check identify the failing control and state what real observation is still needed.", "next_step" = "Run the named native operation on the owned machine and collect its actual success/failure controls." }, { "id" = "observation", "title" = "Retain the native observation", "minutes" = 30, "done_when" = "The intended native positive and negative observations are retained with their environment and file paths.", "next_step" = "Recover the changed condition, check retained state/access, and complete the named cleanup." }]

