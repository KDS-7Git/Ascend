"brief" = "SPF evaluates an envelope domain against a sending IP; DKIM verifies a signature over selected content; DMARC relates authenticated identities to the visible From domain. None is encryption or a guarantee of inbox placement. A local test DNS zone can teach alignment and signing before public delegation exists."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 04 --variant guided --out work/04-guided\npython3 lab.py check work/04-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/04-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/04.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Disposable Ubuntu MAIL/DNS GUEST; use its local resolver, never change the shared host's resolver.\n# Required packages in that owned guest: opendkim-tools, dnsmasq-base, openssl and dnsutils.\nmkdir -p work/dkim\numask 077\nopendkim-genkey -b 2048 -d relay.test -s lab -D work/dkim\nopenssl rsa -in work/dkim/lab.private -pubout -outform DER | openssl base64 -A > work/dkim/lab-public.b64\npython3 inputs/04/make_local_dns.py\ndnsmasq --test --conf-file=work/dkim/dnsmasq.conf\n# Check that no existing guest service owns 127.0.0.1:53 before starting this listener.\nsudo dnsmasq --no-daemon --conf-file=work/dkim/dnsmasq.conf\n# Leave DNS in Terminal A. In guest Terminal B, inspect its actual interface and resolver:\n# ip -br address\n# resolvectl status\n# Set split DNS for .relay.test on this GUEST's actual interface only:\n# sudo resolvectl dns ACTUAL_LAB_INTERFACE 127.0.0.1\n# sudo resolvectl domain ACTUAL_LAB_INTERFACE '~relay.test'\n# Verify the installed resolver uses that route: dig lab._domainkey.relay.test TXT\n# If this guest lacks systemd-resolved, configure its equivalent scoped test resolver explicitly first.\n```", "```sh\n# Same GUEST after the system resolver actually sees the isolated DKIM TXT record.\ndig relay.test MX\ndig relay.test TXT\ndig _dmarc.relay.test TXT\nopendkim-testkey -d relay.test -s lab -k work/dkim/lab.private -vvv\nopendkim-testmsg -d relay.test -s lab -k work/dkim/lab.private < inputs/04/message.eml > work/dkim/signed.eml\nopendkim-testmsg < work/dkim/signed.eml\n# Successful verification exits zero. It may print no output; inspect the exit status.\ncp work/dkim/signed.eml work/dkim/tampered.eml\n# In your editor change one non-whitespace body word in tampered.eml, leaving the signed headers intact.\nopendkim-testmsg < work/dkim/tampered.eml\n# The changed body must now fail signature verification. Header parsing alone cannot establish this result.\n# Compare the signing d=relay.test with the visible From domain and interpret the published SPF/DMARC fixtures.\n# SPF's 192.0.2.10 is an invented documentation input, not this guest's public identity.\n```", "Observe these controls and retain actual output: Observe actual signing/verification and a modified-message failure in the chosen local DNS route. Header parsing alone does not independently verify DKIM or public domain ownership.", "Recover and clean up only the named resources: In the disposable mail guest, revert the exact temporary resolver link with sudo resolvectl revert ACTUAL_LAB_INTERFACE and stop this foreground dnsmasq process with Ctrl+C. Retain public records and redacted signed/tampered observations; keep or remove only this lab private key locally. Recheck the guest resolver after cleanup."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 04 --out work/04-reference. Record that help was used."]
"done_when" = "Observe actual signing/verification and a modified-message failure in the chosen local DNS route. Header parsing alone does not independently verify DKIM or public domain ownership. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
