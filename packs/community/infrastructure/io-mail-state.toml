"brief" = "SMTP submission authenticates a sender to an MTA; IMAP provides mailbox access. These are distinct endpoints with separate TLS and authorization requirements. Use a disposable guest and a synthetic local account. Verify the installed Dovecot version before applying configuration: the supplied teaching fragment uses the Dovecot 2.3 syntax common on Ubuntu 24.04."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 03 --variant guided --out work/03-guided\npython3 lab.py check work/03-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/03-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/03.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Disposable MAIL GUEST with the preceding local Postfix exercise configured.\nsudo apt-get install dovecot-imapd\ndovecot --version\n# Stop here and use that version's reference if it is not Dovecot 2.3.\nsudo useradd --create-home labmail\nsudo passwd labmail\nmkdir -p work/tls\numask 077\nopenssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout work/tls/key.pem -out work/tls/cert.pem -subj /CN=localhost -addext subjectAltName=DNS:localhost\nsudo install -m 0644 work/tls/cert.pem /etc/ssl/certs/ascend-mail-lab.pem\nsudo install -m 0600 work/tls/key.pem /etc/ssl/private/ascend-mail-lab.key\nsudo install -m 0644 inputs/03/dovecot-2.3-lab.conf /etc/dovecot/conf.d/99-ascend-lab.conf\nsudo postconf -e 'home_mailbox = Maildir/'\nsudo postfix check\nsudo doveconf -n\nsudo systemctl restart postfix dovecot\nprintf 'Synthetic message for IMAP\n' | mail -s 'Mailbox control' labmail\nopenssl s_client -connect 127.0.0.1:993 -servername localhost -verify_hostname localhost -verify_return_error -CAfile work/tls/cert.pem -crlf\n# In the TLS IMAP session: a1 LOGIN labmail YOUR_SYNTHETIC_PASSWORD\n# a2 SELECT INBOX\n# a3 FETCH 1 BODY[TEXT]\n# a4 LOGOUT\n# Repeat with a wrong password; repeat s_client using -verify_hostname wrong.invalid to observe name rejection.\n# Next configure the distinct authenticated submission endpoint using the following block.\n```", "```sh\n# Same disposable Ubuntu MAIL GUEST, after TLS, Maildir, local user and Dovecot work.\n# Review existing master.cf, then configure only this guest's loopback submission service.\nsudo cp /etc/postfix/master.cf work/master-before-submission.cf\nsudo postconf -e 'smtpd_tls_cert_file = /etc/ssl/certs/ascend-mail-lab.pem'\nsudo postconf -e 'smtpd_tls_key_file = /etc/ssl/private/ascend-mail-lab.key'\nsudo postconf -M 'submission/inet=submission inet n - y - - smtpd'\nsudo postconf -P 'submission/inet/smtpd_tls_security_level=encrypt'\nsudo postconf -P 'submission/inet/smtpd_sasl_auth_enable=yes'\nsudo postconf -P 'submission/inet/smtpd_sasl_type=dovecot'\nsudo postconf -P 'submission/inet/smtpd_sasl_path=private/auth'\nsudo postconf -P 'submission/inet/smtpd_relay_restrictions=permit_sasl_authenticated,reject'\nsudo postconf -P 'submission/inet/smtpd_recipient_restrictions=permit_sasl_authenticated,reject'\nsudo postfix check\nsudo doveconf -n\nsudo systemctl restart postfix dovecot\nss -ltn\n# Confirm 587 remains loopback-only (inet_interfaces was set in lesson 2).\npython3 inputs/03/submit_authenticated.py\npython3 inputs/03/submit_authenticated.py --wrong-password\npython3 inputs/03/submit_authenticated.py --unauthenticated\n# The script prompts privately for the valid synthetic password and verifies the localhost certificate.\n# Open the earlier IMAP session and fetch the accepted message; refused attempts must not appear.\n# This proves local authenticated submission/mailbox controls, not external SMTP or public deliverability.\n```", "Observe these controls and retain actual output: Authenticated loopback SMTP submission and IMAP retrieval succeed; unauthenticated submission, wrong credentials and a wrong TLS name fail. Retain the actual message/control observations without passwords or private keys. Public delivery remains a separately qualified outcome.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 03 --out work/03-reference. Record that help was used."]
"done_when" = "Authenticated loopback SMTP submission and IMAP retrieval succeed; unauthenticated submission, wrong credentials and a wrong TLS name fail. Retain the actual message/control observations without passwords or private keys. Public delivery remains a separately qualified outcome. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
