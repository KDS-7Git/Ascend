"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 06 --variant guided --out work/06-guided\npython3 lab.py check work/06-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/06-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/06.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Disposable MAIL GUEST with synthetic messages from the earlier lessons.\npostqueue -p\npostqueue -j > work/queue.jsonl\n# Inspect one actual SYNTHETIC queue ID from the output:\n# postcat -q YOUR_LAB_QUEUE_ID\n# Temporarily stop the owned downstream lab MTA, submit one synthetic message, then inspect the deferred reason.\n# Restore the downstream MTA and selectively requeue that lab message according to the installed Postfix tools.\n# Do not delete or flush an unrelated production queue.\n```", "Observe these controls and retain actual output: Observe a deferred synthetic message and its specific cause, then successful delivery after the actual cause is repaired. Receipt at a local MTA is not the same as external mailbox receipt.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
