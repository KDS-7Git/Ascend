"brief" = "WireGuard associates public keys with allowed tunnel addresses. AllowedIPs affects both routing selection and which source addresses a peer may claim. The handshake uses UDP; keys alone do not create an outer-network route. Start with two isolated guest peers and one specific route before experimenting with an exit gateway."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 04 --variant guided --out work/04-guided\npython3 lab.py check work/04-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/04-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/04.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Two disposable Linux PEER guests; install WireGuard in those guests, not the shared host.\nmkdir -p work\numask 077\nwg genkey | tee work/wg-private.key | wg pubkey > work/wg-public.key\n# PEER A: cp inputs/04/wg0.conf work/wg0.conf\n# PEER B: copy wg0-peer-b.conf instead. Replace each private key, the OTHER public key and actual UDP endpoint.\n# Never upload the resulting private-key configuration to a public report.\nsudo wg-quick up ./work/wg0.conf\nsudo wg show\nip route\nping -c 2 10.44.0.2\n# Repeat after revoking the peer on the other guest; then restore and close the lab.\nsudo wg-quick down ./work/wg0.conf\n```", "Observe these controls and retain actual output: Handshake and intended route work; a revoked peer/unlisted route fails. Show actual endpoint/route/MTU observations and remove only this guest tunnel.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
