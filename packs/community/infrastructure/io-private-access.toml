"needs" = []
"brief" = "SSH authenticates the server identity and the user separately. A changed host key can mean reinstall, address reuse or an attack; verify the new fingerprint through the owned console before replacing a known_hosts record. A user key grants only the target account rights. Keep keys scoped, private and revocable, with a recovery path."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 01 --variant guided --out work/01-guided\npython3 lab.py check work/01-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/01-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/01.md. Predict a successful response and a failure before running the following native operations.", "```sh\nmkdir -p work/ssh\nssh-keygen -t ed25519 -f work/ssh/learner-key\nssh-keygen -lf work/ssh/learner-key.pub\n# GUEST console: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub\n# Install the public user key for your owned guest account using its trusted console.\n# CLIENT: ssh -i work/ssh/learner-key learner@ACTUAL_GUEST_ADDRESS\n# Revoke only this key from the guest account, then verify it fails while the recovery identity works.\n```", "Observe these controls and retain actual output: Observe successful intended access and rejected revoked credentials, with verified host identity and a working recovery path.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 01 --out work/01-reference. Record that help was used."]
"done_when" = "Observe successful intended access and rejected revoked credentials, with verified host identity and a working recovery path. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
