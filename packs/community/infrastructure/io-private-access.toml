"brief" = "A relay connects two independently reachable sessions and needs authentication, bounded messages, flow control and a reconnect policy. Use a maintained implementation before writing a small educational protocol. Standard TLS/SSH handles cryptography; a custom framing function does not prove safe public multi-tenant operation. Bind and allowlist every destination."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 08 --variant guided --out work/08-guided\npython3 lab.py check work/08-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/08-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/08.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# First use the free single-PC route: all three listeners stay on loopback.\ncp inputs/08/frps.toml work/frps.toml\ncp inputs/08/frpc.toml work/frpc.toml\n# Generate a fresh token into a local file and put the SAME value into both copies in your editor.\numask 077\nopenssl rand -hex 32 > work/frp-token\n# Terminal A: start Relay on 127.0.0.1:8000 (shared/relay.py).\n# Terminal B: frps -c work/frps.toml\n# Terminal C: frpc -c work/frpc.toml\n# CLIENT: curl http://127.0.0.1:18000/version\n# Stop frpc, change its token, restart and observe rejection. Restore token, try remotePort=18001 and observe rejection.\n# For a two-guest variant, bind frps only to its actual private guest address and adapt serverAddr.\n# Keep proxyBindAddr loopback: use an authenticated SSH forward for a remote client if needed.\n```", "```sh\n# Use reviewed frp binaries on two owned machines. Read the TOML inputs before editing copies.\n# RELAY: frps -c work/frps.toml\n# ORIGIN: frpc -c work/frpc.toml\n# Set a fresh shared token locally with openssl rand -hex 32 and use your actual relay address.\n# Test the single intended route, a wrong token, disconnected origin, then reconnect.\n# For a zero-network protocol exercise:\npython3 inputs/08/framing.py\n# Modify the payload length in that local script and verify an oversized frame is rejected.\n```", "Observe these controls and retain actual output: Show the real relay rejects an unauthorized connection/target and recovers from disconnect, or retain framing-only results as the limited local exercise. Public relay operation needs a reachable owned endpoint and reviewed policy.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
