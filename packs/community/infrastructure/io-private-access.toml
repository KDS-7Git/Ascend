"preview" = "Build loopback-bound reverse forwarding and a separate SOCKS experiment on owned guests."
"requirements" = "Portable model: Python 3.11+ and an editor. Native operation: OpenSSH and an owned reachable relay guest. Two local guests teach the directions; a real CGNAT route additionally needs an eligible reachable relay."
"setup" = "Download /training/io-private-access.zip and extract it into a NEW folder you choose on your PC. Open a terminal in its io-private-access directory; read README.md and bootstrap.md. Python 3.11+ runs the portable tools without extra Python packages. POSIX examples use Linux; Windows users can use a prepared Linux guest or WSL for the initial shell practice. Create work/ and notes/. Copy notes-template.md in your editor to notes/03.md, or append a dated attempt if the note already exists. Input files are in inputs/NN/, portable starting cases in cases/, operational instructions in lessons/NN.md, and the shared synthetic service in shared/. All generated work remains in the local paths printed by the tools. Opening a challenge does not create or upload these files. Use Ascend's notebook/upload control only when you choose to copy evidence into Ascend. Run commands one at a time on the named HOST, GUEST or CLIENT. Replace explicit address/key placeholders after inspection, and keep each foreground service in its own terminal. Stop its process with Ctrl+C before reusing the same listener."
