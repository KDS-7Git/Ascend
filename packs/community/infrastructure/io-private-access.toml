"id" = "io-private-access-03-practice"
"title" = "Operate: Reverse and dynamically forward"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "A reverse SSH forward creates the listening side on the remote SSH server and connects back through the authenticated session. Dynamic forwarding supplies a SOCKS proxy for supporting clients; it is not a full IP VPN. A reverse connection from a CGNAT origin still needs a reachable relay. GatewayPorts and listener bindings decide who can connect to it."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 03 --variant guided --out work/03-guided\npython3 lab.py check work/03-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/03-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/03.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# ORIGIN: Relay listens at its own loopback:8000; RELAY is an owned reachable SSH server.\nssh -N -o ExitOnForwardFailure=yes -R 127.0.0.1:18000:127.0.0.1:8000 learner@ACTUAL_RELAY_ADDRESS\n# RELAY console: curl http://127.0.0.1:18000/version\n# Separate CLIENT experiment with the owned SSH server:\nssh -N -D 127.0.0.1:1080 learner@ACTUAL_RELAY_ADDRESS\n# CLIENT: curl --socks5-hostname 127.0.0.1:1080 http://PRIVATE_SERVICE_FROM_RELAY:8000/version\n# Close each forwarding session when finished. Keep management access separate.\n```", "Observe these controls and retain actual output: Demonstrate both directions with labelled machines and remove the listeners afterwards. Do not expose a public relay port by accident or claim SOCKS routes all device traffic.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
