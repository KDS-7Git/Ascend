"done_when" = "Demonstrate both directions with labelled machines and remove the listeners afterwards. Do not expose a public relay port by accident or claim SOCKS routes all device traffic. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
