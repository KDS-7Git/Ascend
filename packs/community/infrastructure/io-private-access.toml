"id" = "io-private-access-02-practice"
"title" = "Operate: Forward a local service"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "A local SSH forward listens on the client and connects to the destination from the remote SSH server. The two loopback addresses therefore name different machines. Bind the client listener deliberately and restrict forwarding on the server where appropriate. Forwarding a port does not change application authorization."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 02 --variant guided --out work/02-guided\npython3 lab.py check work/02-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/02-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/02.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# CLIENT: the remote loopback address belongs to the SSH GUEST.\nssh -N -o ExitOnForwardFailure=yes -L 127.0.0.1:18000:127.0.0.1:8000 learner@ACTUAL_GUEST_ADDRESS\n# Keep this foreground session open. Second CLIENT terminal:\n# curl -i http://127.0.0.1:18000/version\n# ss -ltnp\n# Stop the SSH command with Ctrl+C and verify that this listener disappears.\n# GUEST must already run the intended private Relay service on 127.0.0.1:8000.\n```", "Observe these controls and retain actual output: Observe the response through the local forward, deliberate wrong-destination failure, loopback binding and removal after closing SSH.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 02 --out work/02-reference. Record that help was used."]
"done_when" = "Observe the response through the local forward, deliberate wrong-destination failure, loopback binding and removal after closing SSH. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
