"brief" = "A college-style service joins template selection, project identity, resource admission, guest boot, SSH, application publishing, observation and recovery. Each stage needs its own evidence and permissions. Use the existing platform UI/API to prove the workflow before building a custom front end; retain failed-operation state until inventory is reconciled."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 08 --variant guided --out work/08-guided\npython3 lab.py check work/08-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/08-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/08.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# OWNED lab control plane: run the complete two-project scenario with two restricted learner identities.\nincus project list\nincus list --all-projects\nincus operation list\n# For each learner: create a reviewed VM, obtain its unique SSH identity, deploy the site and retain the resource shape.\n# OPERATOR: apply one permitted resize, reject one over-quota request, restore one guest from backup.\n# LEARNER A: demonstrate backend denial for B's private instance/console/configuration.\n# Release only the owned exercise guests; inspect remaining images, volumes and failed tasks before freeing reservations.\n```", "Observe these controls and retain actual output: Submit a reproducible runbook with genuine per-identity authorization, website, resize, over-quota, restore and selective cleanup evidence. All components on one PC still share that physical failure domain.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 08 --out work/08-reference. Record that help was used."]
"done_when" = "Submit a reproducible runbook with genuine per-identity authorization, website, resize, over-quota, restore and selective cleanup evidence. All components on one PC still share that physical failure domain. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
"checkpoints" = [{ "id" = "diagnosis", "title" = "Explain the failed control", "minutes" = 15, "done_when" = "A prediction and the portable check identify the failing control and state what real observation is still needed.", "next_step" = "Run the named native operation on the owned machine and collect its actual success/failure controls." }, { "id" = "observation", "title" = "Retain the native observation", "minutes" = 30, "done_when" = "The intended native positive and negative observations are retained with their environment and file paths.", "next_step" = "Recover the changed condition, check retained state/access, and complete the named cleanup." }]

