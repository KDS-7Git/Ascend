"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 04 --variant guided --out work/04-guided\npython3 lab.py check work/04-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/04-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/04.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# OPERATOR or appropriately scoped learner, on the OWNED lab host.\nincus operation list\nincus info relay-a --project ascend-a\nincus stop relay-a --project ascend-a\nincus config set relay-a limits.memory=2GiB --project ascend-a\nincus config set relay-a limits.cpu=2 --project ascend-a\nincus start relay-a --project ascend-a\nincus info relay-a --project ascend-a\n# GUEST: observe memory/CPU after any required restart.\n# Attempt one over-quota allocation through the restricted identity and verify no partial resource leak.\n```", "```sh\n# CLIENT A after normal resize; the project's 3 GiB total memory bound is lower than this request.\nincus init images:ubuntu/24.04/cloud too-large --vm --project ascend-a --profile lab-small -c limits.memory=4GiB\n# Use college:too-large when invoking through the restricted remote.\n# Rejection is expected. Inspect instances, operations and storage as OPERATOR for a partial allocation.\n# If a cleanup failed, retain it in inventory and release reservation only after reconciliation.\n```", "Observe these controls and retain actual output: Observe requested/configured/guest resources, retained operation status and an over-quota rejection without leaked allocation. Platform feature support must match the selected version.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
