"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 06 --variant guided --out work/06-guided\npython3 lab.py check work/06-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/06-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/06.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# OPERATOR, OWNED Incus host and project only.\nmkdir -p work/instance-backups\nincus stop relay-a --project ascend-a\nincus export relay-a work/instance-backups/relay-a.tar.gz --project ascend-a\n# Restore under a NEW name, inspect/change network identity before starting on the same network.\nincus import work/instance-backups/relay-a.tar.gz relay-restored --project ascend-a\nincus config show relay-restored --project ascend-a --expanded\n# Start only after checking identities/resource quota; verify data with relay-a still stopped.\n# A second physical host enables additional host-failure/migration tests after compatibility preflight.\n```", "```sh\n# The resized source plus a same-size restored guest may exceed the 3 GiB project bound.\n# A stopped VM can still count toward project quotas. OPERATOR must inspect/reserve aggregate resources\n# and, if physically affordable, temporarily raise only ascend-a's memory limit for the restore test.\n# Restore is a replacement: keep the source stopped, inspect MAC/IP/machine ID/SSH identity, and never\n# start both with duplicate guest identities. If both will coexist, disconnect the restored guest NIC,\n# reset guest machine/SSH/cloud-init identity through the operator console and revalidate before reconnecting.\n# After selective cleanup restore the original project limit; do not free a reservation merely because a VM stopped.\n```", "Observe these controls and retain actual output: A new guest restores actual service/data and appropriate identity while the original is stopped. Name the shared physical resources and distinguish restore, offline move and live migration.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 06 --out work/06-reference. Record that help was used."]
"done_when" = "A new guest restores actual service/data and appropriate identity while the original is stopped. Name the shared physical resources and distinguish restore, offline move and live migration. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
