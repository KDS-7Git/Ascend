"brief" = "Multi-user isolation must be enforced by the management API and daemon. Hiding a button cannot restrict a user who has unrestricted host sockets or certificates. Give each learner a confined project identity, test direct denied API calls and preserve a separate operator recovery identity. Quotas and ownership are separate controls."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 03 --variant guided --out work/03-guided\npython3 lab.py check work/03-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/03-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/03.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# OPERATOR on that OWNED Incus lab host. Only this host identity retains full administration.\nincus project create ascend-b -c features.images=true -c features.profiles=true -c features.networks=false\n# Repeat the lab-small profile creation/root/NIC commands from level 2 for --project ascend-b.\nincus project set ascend-a restricted=true limits.instances=2 limits.memory=3GiB\nincus project set ascend-a restricted.devices.nic=managed restricted.networks.access=incusbr0\nincus project set ascend-b restricted=true limits.instances=2 limits.memory=3GiB\nincus project set ascend-b restricted.devices.nic=managed restricted.networks.access=incusbr0\nincus config trust list\n# Enable TLS management only on a chosen PRIVATE host address reachable by the two owned clients.\n# Example after replacing ACTUAL_PRIVATE_HOST_ADDRESS: incus config set core.https_address ACTUAL_PRIVATE_HOST_ADDRESS:8443\n# Record/verify the server certificate fingerprint through the operator's trusted console.\nincus config trust add learner-a --projects ascend-a --restricted\nincus config trust add learner-b --projects ascend-b --restricted\n# Each command produces a separate enrollment token; deliver to its OWN client and do not submit it as evidence.\n# CLIENT A and CLIENT B must be different client configurations/identities with no full host socket access.\n# CLIENT A: incus remote add college TOKEN_FOR_A --project ascend-a\n# CLIENT B: incus remote add college TOKEN_FOR_B --project ascend-b\n# The remote's --project option selects a project; the server's restricted certificate enforces confinement.\n```", "```sh\n# CLIENT A: use its enrolled restricted remote for all these calls.\nincus list college: --project ascend-a\nincus info college:relay-a --project ascend-a\n# OPERATOR first creates a B-owned relay-b using B's profile/cloud-init as in level 2.\nincus info college:relay-b --project ascend-b\nincus config set college:relay-b limits.memory=2GiB --project ascend-b\n# Those B requests must be denied by the daemon, not merely absent from a UI.\n# Repeat A access from CLIENT B and record the denial. A single unrestricted client changing --project is not this test.\n# Revoke a learner certificate by its exact recorded fingerprint at cleanup:\n# OPERATOR: incus config trust remove ACTUAL_LEARNER_CERTIFICATE_FINGERPRINT\n# Confirm that client's subsequent allowed-project request is now denied.\n```", "Observe these controls and retain actual output: Two actual learner identities can use only their own allowed resources; direct cross-project requests fail at the backend. A single operator account or a hidden UI control is not this test.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
