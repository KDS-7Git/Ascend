"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 07 --variant guided --out work/07-guided\npython3 lab.py check work/07-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/07-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/07.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Learner PC with a reviewed kind/kubectl setup and enough remaining RAM; keep this separate from other heavy labs.\nkind create cluster --name ascend-infra\nkubectl config current-context\ndocker build -f inputs/07/Dockerfile -t ascend-relay:lab .\n# Inspect the built image ID; this exercise uses the local Never-pull image only.\nkind load docker-image ascend-relay:lab --name ascend-infra\nkubectl apply -f inputs/07/relay.yaml\nkubectl rollout status deployment/relay-lab\nkubectl get pods,services,endpointslices\nkubectl port-forward service/relay-lab 18080:8000 --address 127.0.0.1\n# CLIENT: curl http://127.0.0.1:18080/version\n# After the fault/recovery controls: kind delete cluster --name ascend-infra\n```", "Observe these controls and retain actual output: The actual cluster serves the expected image/release, a selector/readiness fault removes the intended traffic path, and recovery plus owned-cluster cleanup are observed.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
