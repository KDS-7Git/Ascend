"id" = "io-private-cloud-platform-02-practice"
"title" = "Operate: Offer reproducible guest templates"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "An image provides a common base; an instance profile chooses resources and network settings; per-instance initialization supplies unique identities. A project may share selected images/profiles or keep them isolated. CPU/memory shapes are allocations, not guaranteed requests-per-second figures."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 02 --variant guided --out work/02-guided\npython3 lab.py check work/02-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/02-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/02.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# OPERATOR, owned supported Incus Linux HOST only. Check KVM, free memory and disk first.\nincus version\n# For a fresh host use incus admin init interactively: a directory pool named default,\n# a private managed bridge named incusbr0, and no public management listener.\n# Existing installations: inspect and adapt to their chosen pool/network; do not reinitialize them.\nincus storage list\nincus network list\nincus image list images: ubuntu/24.04\nincus project create ascend-a -c features.images=true -c features.profiles=true -c features.networks=false\nincus profile create lab-small --project ascend-a\nincus profile set lab-small limits.memory=1GiB limits.cpu=1 --project ascend-a\nincus profile device add lab-small root disk path=/ pool=default size=12GiB --project ascend-a\nincus profile device add lab-small eth0 nic network=incusbr0 name=eth0 --project ascend-a\nssh-keygen -t ed25519 -f work/incus-learner-key\ncp inputs/02/user-data work/incus-user-data\n# Replace the PUBLIC-key placeholder, then inspect the file before passing it to cloud-init.\nincus init images:ubuntu/24.04/cloud relay-a --vm --project ascend-a --profile lab-small\nincus config set relay-a cloud-init.user-data - --project ascend-a < work/incus-user-data\nincus config show relay-a --project ascend-a --expanded\nincus start relay-a --project ascend-a\nincus info relay-a --project ascend-a\nincus exec relay-a --project ascend-a -- cloud-init status --wait\nincus exec relay-a --project ascend-a -- ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub\n# Compare this trusted fingerprint on first SSH connection. Record guest type, address and identity.\n# The cloud image alias is a concrete starting choice; confirm it exists for your architecture/version.\n```", "Observe these controls and retain actual output: Host configuration and the guest identify a real VM with the intended resources and unique identity. Containers are a useful alternate exercise but cannot satisfy the separate guest-kernel outcome.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 02 --out work/02-reference. Record that help was used."]
"done_when" = "Host configuration and the guest identify a real VM with the intended resources and unique identity. Containers are a useful alternate exercise but cannot satisfy the separate guest-kernel outcome. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
"checkpoints" = [{ "id" = "diagnosis", "title" = "Explain the failed control", "minutes" = 15, "done_when" = "A prediction and the portable check identify the failing control and state what real observation is still needed.", "next_step" = "Run the named native operation on the owned machine and collect its actual success/failure controls." }, { "id" = "observation", "title" = "Retain the native observation", "minutes" = 30, "done_when" = "The intended native positive and negative observations are retained with their environment and file paths.", "next_step" = "Recover the changed condition, check retained state/access, and complete the named cleanup." }]

