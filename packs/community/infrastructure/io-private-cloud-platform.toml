"title" = "Operate: Read an existing control plane"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "A cloud-style portal translates authenticated requests into hypervisor, storage and network operations. The guest keeps running under the host even when a browser closes; SSH enters the guest rather than the host management daemon. Begin with an existing platform before building a new portal, and identify which service owns each operation."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 01 --variant guided --out work/01-guided\npython3 lab.py check work/01-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/01-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/01.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# OWNED Linux HOST with the selected supported management platform.\nvirsh -c qemu:///system list --all\n# Or, on an installed Incus lab host:\nincus info\nincus project list\nincus list --all-projects\n# Follow one guest from the UI/API operation to host process, disk, network and guest SSH.\n# Merely reaching an SSH endpoint cannot identify whether the college used a VM, container or bare host.\n```", "Observe these controls and retain actual output: Map actual platform, hypervisor/instance kind, guest service and identities. A UI walkthrough without creating/observing a guest remains architecture preparation.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 01 --out work/01-reference. Record that help was used."]
"done_when" = "Map actual platform, hypervisor/instance kind, guest service and identities. A UI walkthrough without creating/observing a guest remains architecture preparation. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
