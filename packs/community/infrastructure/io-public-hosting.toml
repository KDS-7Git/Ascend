"brief" = "A static host returns built files; a dynamic service executes code for each request and may own durable state. The source project is not necessarily the deployable artifact. Build output paths, base URLs and runtime compatibility determine which hosting option can execute the project. Start by serving both models locally and observe the difference."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 01 --variant guided --out work/01-guided\npython3 lab.py check work/01-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/01-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/01.md. Predict a successful response and a failure before running the following native operations.", "```sh\npython3 -m http.server 8090 --bind 127.0.0.1 --directory inputs/01/site\n# Second terminal: curl -i http://127.0.0.1:8090/\n# Keep this static server running in Terminal A. Start the dynamic service below in Terminal B.\n```", "```sh\n# PC or service GUEST, in this extracted track directory; leave this terminal running.\nmkdir -p data\npython3 shared/relay.py --host 127.0.0.1 --port 8000 --data data/relay.sqlite --release v1\n```", "```sh\n# CLIENT Terminal C while both services run:\ncurl -i http://127.0.0.1:8000/version\ncurl -i http://127.0.0.1:8090/api/updates\n# A static file server does not implement the dynamic API merely because its path exists.\n# Retain the 404 from the static API request, then stop both foreground servers with Ctrl+C.\n```", "Observe these controls and retain actual output: Serve the static build and dynamic API, record the distinction and choose compatible hosting for each. Do not call a source directory or a static placeholder API a deployed dynamic service.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 01 --out work/01-reference. Record that help was used."]
"done_when" = "Serve the static build and dynamic API, record the distinction and choose compatible hosting for each. Do not call a source directory or a static placeholder API a deployed dynamic service. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
