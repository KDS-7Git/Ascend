"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 02 --variant guided --out work/02-guided\npython3 lab.py check work/02-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/02-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/02.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# PC or service GUEST, in this extracted track directory; leave this terminal running.\nmkdir -p data\npython3 shared/relay.py --host 127.0.0.1 --port 8000 --data data/relay.sqlite --release v1\n```", "```sh\ncaddy validate --config inputs/02/Caddyfile --adapter caddyfile\ncaddy run --config inputs/02/Caddyfile --adapter caddyfile\n# In another terminal:\n# curl -i http://127.0.0.1:8080/version\n# ss -ltnp\n# Stop only this Caddy process with Ctrl+C before editing/restarting its configuration.\n```", "Observe these controls and retain actual output: Direct origin and edge version checks pass; a deliberately wrong upstream produces a 502. Verify actual socket binding instead of inferring it from a site hostname.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
