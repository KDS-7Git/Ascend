"brief" = "CPU weight controls relative scheduling, while CPU quota caps bandwidth. memory.high triggers pressure/reclaim and memory.max can lead to an OOM boundary. These do not reserve invisible extra resources. Budget aggregate guests, host services, caches and transient operations, and apply experiments only to owned scopes."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 06 --variant guided --out work/06-guided\npython3 lab.py check work/06-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/06-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/06.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Supported Linux USER session with delegated cgroup controls; this caps only its new scope.\nsystemd-run --user --scope -p MemoryMax=128M -p CPUQuota=50% python3 shared/relay.py --host 127.0.0.1 --port 8500 --data work/bounded.sqlite --release bounded\n# Another terminal: curl http://127.0.0.1:8500/metrics\nsystemctl --user list-units --type=scope\n# Inspect the exact created scope's cgroup counters. A 50% quota is half ONE CPU, not half a 16-core host.\n# If user delegation is unavailable, use the equivalent control inside a disposable guest; do not change shared-host policy.\n```", "Observe these controls and retain actual output: Actual owned-scope counters show the intended limits and recovery; host reserve remains. Configured values alone do not prove the effect on a physical smaller device.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
