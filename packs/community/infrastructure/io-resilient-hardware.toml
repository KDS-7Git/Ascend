"brief" = "MicroSD capacity, write latency and endurance are different constraints. Logs, database journals, swap and build caches can write far more than the apparent user data. tmpfs can reduce writes only for data that may be lost, and consumes bounded RAM. Build and load-test on the PC while retaining necessary service state on appropriate durable storage."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 04 --variant guided --out work/04-guided\npython3 lab.py check work/04-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/04-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/04.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Observe your selected owned device/guest; do not run destructive media benchmarks.\nlsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS,MODEL\ndf -h\ndf -i\nvmstat 1 5\n# A bounded disk-full exercise belongs in a disposable GUEST and a NEW image file only:\nmkdir -p work/fs-lab work/fs-mount\ntruncate -s 32M work/fs-lab/disk.img\n# Inside that disposable guest only: mkfs.ext4 -F work/fs-lab/disk.img\n# Mount the image on work/fs-mount, write only bounded synthetic files there, observe ENOSPC,\n# remove that synthetic data and unmount. Never use mkfs on an actual device path for this lesson.\n```", "Observe these controls and retain actual output: Compare write/space observations, preserve durable state and recover the bounded lab data volume. A VM disk exercise teaches procedure but does not measure microSD endurance.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
