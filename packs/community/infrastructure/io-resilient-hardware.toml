"brief" = "Backup success means the required data can be restored independently with an understood loss window and recovery time. A snapshot on the same disk shares that disk's failure. A cold or application-consistent backup has a defined consistency point. Restore into a new target before trusting the procedure."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 03 --variant guided --out work/03-guided\npython3 lab.py check work/03-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/03-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/03.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# While the local Relay service owns data/relay.sqlite:\nmkdir -p work/backups\npython3 shared/backup.py create --source data/relay.sqlite --destination work/backups/recovery.sqlite\npython3 shared/backup.py inspect --source work/backups/recovery.sqlite\npython3 shared/backup.py restore --source work/backups/recovery.sqlite --destination work/restored.sqlite\n# Stop the source process. Start a new process using work/restored.sqlite, then read prior updates.\n# Record backup time, last retained update, start/end restore time and the physical location of both copies.\n```", "Observe these controls and retain actual output: A new target passes integrity/content checks while the source is stopped; measured RPO/RTO and shared failure domains are documented.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
