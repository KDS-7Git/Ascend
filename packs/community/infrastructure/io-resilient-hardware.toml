[[node]]
"level" = "io-resilient-hardware-05"
"preview" = "Prepare a Pi for headless key-based administration, deploy a boot-managed service and check it from your PC; use the same software procedure in a Linux VM when no device is available."
"requirements" = "Portable model: Python 3.11+ and an editor. Choose one native route. Pi: an owned model supported by the current 64-bit Raspberry Pi OS Lite image (for example Pi 3/4/5), its correctly rated supply/cable, removable microSD/reader and an owned LAN. A 1 GiB Pi with a 16 GB card is a starting allowance for this one small Python service; inspect current OS requirements, free space and measured use rather than treating it as a capacity guarantee. A 2 GiB+ model or larger card provides more working room but is not a purchase requirement. PC/VM: supported Multipass or the earlier libvirt guest, around 1 GiB guest RAM/12 GiB disk initially, plus host reserve. The PC needs OpenSSH/scp, Python and an editor; Imager and all core software are free. One trusted console/provisioning channel is needed to authenticate the initial SSH host fingerprint; a first-use network scan alone cannot do that."
"setup" = "Download /training/io-resilient-hardware.zip and extract it into a NEW folder you choose on your PC. Open a terminal in its io-resilient-hardware directory; read README.md and bootstrap.md. Python 3.11+ runs the portable tools without extra Python packages. POSIX examples use Linux; Windows users can use a prepared Linux guest or WSL for the initial shell practice. Create work/ and notes/. Copy notes-template.md in your editor to notes/05.md, or append a dated attempt if the note already exists. Input files are in inputs/NN/, portable starting cases in cases/, operational instructions in lessons/NN.md, and the shared synthetic service in shared/. All generated work remains in the local paths printed by the tools. Opening a challenge does not create or upload these files. Use Ascend's notebook/upload control only when you choose to copy evidence into Ascend. Run commands one at a time on the named HOST, GUEST or CLIENT. Replace explicit address/key placeholders after inspection, and keep each foreground service in its own terminal. Stop its process with Ctrl+C before reusing the same listener."
"resource" = "https://www.raspberrypi.com/documentation/computers/getting-started.html"
"resource_label" = "Free technical reference"
"resource_note" = "The bundled lesson defines the practical task. This optional official/open reference explains its mechanism; no paid course is needed."
"materials" = [{ "label" = "Download this track's practical lab files", "url" = "/training/io-resilient-hardware.zip" }]
"verify" = { "type" = "manual" }
"auto_complete" = false
"id" = "io-resilient-hardware-05-practice"
"title" = "Operate: Use physical devices well"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "A Pi, spare laptop or mini-PC can remain on while the learner PC sleeps, and supplies an independent power/storage/network failure domain. The host need not keep a VM application window open for a virtual guest to run either; the difference is whether the physical host itself stays powered and awake. A headless system boots from persistent media and obtains an address before SSH can reach its running server. Raspberry Pi Imager prepares the OS, local account and SSH configuration; it does not make a public internet route. A public user key belongs on the target, while its private key stays on the PC.\n\nChoose the Pi or VM route below. Both run the same readable Python service and the same private SSH-forwarded client check. The VM route completes the software operation without purchasing a Pi. Only an actual device can add measurements of its supply, SD/USB storage, temperature and throttling. The portable JSON case describes a supplied Pi planning scenario; its Boolean fields must not be treated as claims that a PC user measured hardware.\n\nFor a Pi, select the exact model in the current official Imager, choose a compatible Raspberry Pi OS Lite (64-bit) image, and identify the removable card by model and capacity before writing. Writing an image erases that selected medium: retain any needed files and unplug unrelated removable disks to make the choice unambiguous. Configure hostname ascend-pi, your own non-root account, timezone and SSH with the generated PUBLIC key. Use a model-rated regulated supply; power requirements and the USB power budget differ across models. Ethernet and DHCP are a simple first boot path. If the model needs Wi-Fi, configure its permitted SSID/country privately in Imager and check peer isolation; no Wi-Fi credentials belong in notes.\n\nAuthenticate the first server fingerprint through a trusted local console or existing provisioning channel. A temporary display/keyboard can be used once, after which operation is headless. The VM route obtains the fingerprint through its owned host control plane. If a fully headless Pi has no separate trusted channel, an isolated first-use connection can be recorded as trust on first use, but leave the independently authenticated identity control incomplete until that channel is available. ssh-keyscan collects the presented key; it does not authenticate the device by itself.\n\nStore service files under the explicit /opt/ascend-device path on the chosen target. A separate service account writes persistent application state in its dedicated data directory; the login operator uses sudo for installation and recovery. Loopback binding plus an authenticated SSH forward keeps the teaching service private. Publishing a website more widely is the separate Web Hosting route. Record the OS/Python architecture and memory/storage use; do not infer performance or power savings from core counts alone. USB SSD storage and suitable cooling can improve a later deployment, with their actual power/boot support checked first."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 05 --variant guided --out work/05-guided\npython3 lab.py check work/05-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/05-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/05.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# PC, in this extracted track folder. Choose a NEW key path; preserve any existing keys.\nmkdir -p work/device notes\nssh-keygen -t ed25519 -f work/device/operator-key\nssh-keygen -lf work/device/operator-key.pub\ncat work/device/operator-key.pub\n# The above fingerprint is your USER key, not the target's HOST key.\n# PI route: download Raspberry Pi Imager from https://www.raspberrypi.com/software/.\n# In Imager choose the exact device, Raspberry Pi OS Lite (64-bit) if supported, and the verified removable card.\n# Customize hostname ascend-pi, a local account such as laboperator, timezone and SSH/public-key authentication.\n# Paste only operator-key.pub. Create a private local-console password in the account options; SSH stays public-key-only.\n# No default pi account is assumed; keep this password and the private key out of notes.\n# Write/verify/eject the selected card. Insert it into the Pi, connect owned Ethernet, then its proper power supply.\n# Allow first-boot provisioning to finish. Find its actual address in your router's DHCP leases using hostname/MAC.\n# ascend-pi.local is a convenience only where mDNS works; a router DHCP observation is not an SSH identity proof.\n# PC/VM route: skip all media-writing and Pi steps and use the next block.\n```", "```sh\n# PC/VM alternative: install a supported Multipass version using the official guide in bootstrap.md.\n# This is a NEW named disposable guest, separate from the shared Ascend server.\nmultipass launch 24.04 --name ascend-device --cpus 1 --memory 1G --disk 12G\nmultipass exec ascend-device -- cloud-init status --wait\nmultipass transfer work/device/operator-key.pub ascend-device:/home/ubuntu/ascend-operator.pub\nmultipass exec ascend-device -- sh -c 'umask 077; mkdir -p /home/ubuntu/.ssh; cat /home/ubuntu/ascend-operator.pub >> /home/ubuntu/.ssh/authorized_keys'\nmultipass info ascend-device\nmultipass exec ascend-device -- ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub\n# Record that HOST-key fingerprint from the trusted host control plane; username is ubuntu for this image.\n# The prior libvirt guest can be used instead with its known user/address and the host-console key setup.\n# An existing owned Linux PC is another target; apply the target installation block directly there.\n# Without a second machine, run the local checker on that PC and label client/server as the same physical host.\n# DIRECT LINUX-PC route only, instead of the VM/SSH transfer: use a NEW ~/ascend-device directory.\n# mkdir ~/ascend-device\n# cp -r shared ~/ascend-device/\n# cp inputs/05/ascend-device.service ~/ascend-device/ascend-device.service\n# Skip remote key enrolment/transfer and continue at the TARGET install block; this PC's local console identifies the target.\n```", "```sh\n# PI trusted local console, once: log in as the account you configured in Imager.\n# Run: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub\n# Retain the public fingerprint through that trusted channel. Do not confuse it with operator-key.pub.\n# PC: choose ONE actual target. Examples below must be replaced with its observed address/user.\nDEVICE_HOST=192.168.1.70\nDEVICE_USER=laboperator\n# VM route: set DEVICE_HOST to multipass info's actual address and DEVICE_USER=ubuntu.\nssh-keyscan -t ed25519 \"$DEVICE_HOST\" > work/device/host-key.candidate\nssh-keygen -lf work/device/host-key.candidate\n# Compare this candidate with the independently obtained fingerprint BEFORE accepting it.\n# A mismatch stops enrolment: check the device/address through the trusted channel, not by disabling host-key checks.\nmv work/device/host-key.candidate work/device/known_hosts\nssh -i work/device/operator-key -o UserKnownHostsFile=\"$PWD/work/device/known_hosts\" -o StrictHostKeyChecking=yes \"$DEVICE_USER@$DEVICE_HOST\" 'mkdir -p ascend-device'\nscp -i work/device/operator-key -o UserKnownHostsFile=\"$PWD/work/device/known_hosts\" -o StrictHostKeyChecking=yes -r shared \"$DEVICE_USER@$DEVICE_HOST\":ascend-device/\nscp -i work/device/operator-key -o UserKnownHostsFile=\"$PWD/work/device/known_hosts\" -o StrictHostKeyChecking=yes inputs/05/ascend-device.service \"$DEVICE_USER@$DEVICE_HOST\":ascend-device/ascend-device.service\nssh -i work/device/operator-key -o UserKnownHostsFile=\"$PWD/work/device/known_hosts\" -o StrictHostKeyChecking=yes \"$DEVICE_USER@$DEVICE_HOST\"\n# The final command opens the TARGET shell. For a direct same-PC route, copy the unit into the chosen local\n# working folder with shared/ and use that folder in the following block instead of /home/USER/ascend-device.\n```", "```sh\n# TARGET (Pi, VM or owned Linux PC); in the directory containing shared/ and ascend-device.service.\ncd ~/ascend-device\npython3 --version\n# On the owned Debian/Ubuntu/Raspberry Pi OS target if Python is absent:\n# sudo apt-get update\n# sudo apt-get install python3\npython3 shared/selfcheck.py\nuname -m\nfree -m\ndf -h .\n# Confirm no earlier owned practice process/unit is using port 8000; stop only that named prior lab if needed.\nss -ltn\n# One-time installation on this target. If this service identity already exists, inspect its ownership first.\nsudo useradd --system --user-group --home-dir /opt/ascend-device --shell /usr/sbin/nologin relaylab-device\nsudo install -d -m 0755 /opt/ascend-device /opt/ascend-device/shared /opt/ascend-device/control\nsudo install -d -m 0750 -o relaylab-device -g relaylab-device /opt/ascend-device/data\nsudo install -m 0644 shared/*.py /opt/ascend-device/shared/\nprintf 'ready\n' | sudo tee /opt/ascend-device/control/ready > /dev/null\nsudo install -m 0644 ascend-device.service /etc/systemd/system/ascend-device.service\nsudo systemctl daemon-reload\nsudo systemctl enable --now ascend-device.service\nsystemctl status ascend-device.service --no-pager\npython3 shared/check_service.py --url http://127.0.0.1:8000 --expect-release device-v1\n# The unit runs as relaylab-device; login credentials are not given to that service account.\n```", "```sh\n# PC Terminal A, with the same actual target variables and verified known_hosts as above.\n# Keep this authenticated foreground tunnel open; the TARGET origin remains on its own loopback.\nssh -N -o ExitOnForwardFailure=yes -i work/device/operator-key -o UserKnownHostsFile=\"$PWD/work/device/known_hosts\" -o StrictHostKeyChecking=yes -L 127.0.0.1:18050:127.0.0.1:8000 \"$DEVICE_USER@$DEVICE_HOST\"\n# PC Terminal B in the extracted folder (separate from A):\n# python3 shared/check_service.py --url http://127.0.0.1:18050 --expect-release device-v1 --write\n# Open http://127.0.0.1:18050/ in your browser to see the privately forwarded service.\n# Wrong-version control (expected failure):\n# python3 shared/check_service.py --url http://127.0.0.1:18050 --expect-release wrong-v0\n# On the same-PC alternative use http://127.0.0.1:8000 directly and record that no LAN path was observed.\n```", "```sh\n# TARGET: retain actual observations; run Pi-specific commands only on a supported physical Pi.\nhostname\ncat /etc/os-release\nuname -m\nlscpu\nlsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS,MODEL\nip -br address\nfree -m\ndf -h\nsystemctl show ascend-device.service -p MainPID -p User -p MemoryCurrent -p CPUUsageNSec\njournalctl -u ascend-device.service -b -n 40 --no-pager\nsudo journalctl -k -b -n 120 --no-pager\n# Physical Pi with the installed firmware tools:\n# vcgencmd measure_temp\n# vcgencmd get_throttled\n# Record the raw hexadecimal flags. Bit 0 means current undervoltage; bit 2 current throttling;\n# bits 16 and 18 record prior occurrences since boot. Historical bits do not assert a current fault.\n# Include model, supply/cable rating, Ethernet/Wi-Fi path and SD/USB backing storage in notes.\n# A VM has no Pi firmware/supply/SD readings: mark them unobserved instead of inventing zeros.\n# Do not induce overheating/undervoltage, unplug live storage, or pull power to manufacture a failure.\n```", "```sh\n# TARGET: non-destructive readiness failure, while keeping SSH and the service process alive.\nsudo -u relaylab-device python3 /opt/ascend-device/shared/backup.py inspect --source /opt/ascend-device/data/relay.sqlite\n# Retain records_sha256 after the PC write check; later checks omit --write so comparisons stay meaningful.\nsudo truncate -s 0 /opt/ascend-device/control/ready\npython3 shared/check_service.py --url http://127.0.0.1:8000 --expect-release device-v1\n# The /ready control must fail. Compare with the PC's forwarded observation; do not broaden listener access.\nprintf 'ready\n' | sudo tee /opt/ascend-device/control/ready > /dev/null\npython3 shared/check_service.py --url http://127.0.0.1:8000 --expect-release device-v1\nsystemctl is-enabled ascend-device.service\n# Only this owned target: perform a clean reboot; SSH and the forwarding session disconnect.\nsudo reboot\n# PC: wait for the target to boot, recheck its address/fingerprint and reopen the SAME SSH forward.\n# Repeat the no-write service check and the TARGET backup.py inspect command; compare retained record hashes.\n# A clean reboot tests OS/service startup. It does not test abrupt power-loss durability.\n# Hardware lesson 01 uses this same installation and reboot/state control.\n```", "```sh\n# TARGET cleanup when you are finished; preserve needed state/evidence before removing any lab files.\nsudo systemctl disable --now ascend-device.service\n# Stop the PC's foreground SSH forward with Ctrl+C and verify the local 18050 listener disappears.\n# Keep /opt/ascend-device/data/relay.sqlite only if you intend to resume; it is the explicitly named TARGET data.\n# Remove only the owned unit when no longer needed:\n# sudo rm /etc/systemd/system/ascend-device.service\n# sudo systemctl daemon-reload\n# Revoke only this exercise's public key from the TARGET account if it will no longer be used.\n# Physical Pi: sudo poweroff, wait for clean shutdown, then disconnect power; never pull a mounted SD card.\n# Multipass alternative: preserve notes/needed data, then multipass stop ascend-device.\n# A chosen multipass delete ascend-device marks only that guest deleted; do not run a global purge.\n# Keep another working administrator/recovery identity when revoking a key on a reused target.\n```", "Observe these controls and retain actual output: Complete the chosen owned Pi, VM or Linux-PC route: verify its host identity through the stated trusted channel, deploy the dedicated service, observe the correct/wrong release and readiness failure/recovery, perform a clean reboot and compare retained synthetic records. A second-machine route must include the actual SSH-forwarded client response. On a Pi also record real architecture, supply/storage and available thermal/throttle observations; the PC/VM route records those physical items as unobserved and still completes the software operation. A clean reboot and one short check do not prove abrupt-power durability, physical availability or sustained capacity.", "Recover and clean up only the named resources: Use the final operation block to stop/disable only ascend-device.service and close its SSH forward. Preserve the specifically named /opt/ascend-device/data state or remove only this lab after retaining evidence. Shut down an owned Pi cleanly before removing power/media; stop only the named Multipass guest. Retain a separate recovery identity before revoking the exercise key."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 05 --out work/05-reference. Record that help was used."]
