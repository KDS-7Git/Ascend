"brief" = "Logs and metrics are useful only while their storage cost remains bounded. Cardinality, retention, rotation, WAL and compaction all consume resources. Deleting all logs conceals the incident instead of controlling growth. Apply limits only to the disposable lab service or guest and keep enough reserve to recover."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 02 --variant guided --out work/02-guided\npython3 lab.py check work/02-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/02-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/02.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Disposable GUEST; inspect existing log usage before changing its policy.\njournalctl --disk-usage\ndf -h\ndf -i\ncat inputs/02/ascend-journal.conf\n# Review and install this guest-only fragment under /etc/systemd/journald.conf.d/ if applicable.\n# Restart that guest's journald deliberately, generate a small number of test events,\n# and compare retained logs/free space; do not apply to a shared production host.\n```", "Observe these controls and retain actual output: Observe bounded retention and retained useful errors while keeping filesystem reserve. The fragment is a lab example, not a measured universal microSD policy.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 02 --out work/02-reference. Record that help was used."]
