"id" = "io-resilient-hardware-01-practice"
"title" = "Operate: Keep an owned service available"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "Availability includes boot, service startup, dependencies, time, network and storage. A process that survives a terminal is not necessarily enabled at boot. An observer on the same machine cannot report while that machine has no power. Use a disposable guest for the software sequence and add physical observations only when you have the device."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 01 --variant guided --out work/01-guided\npython3 lab.py check work/01-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/01-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/01.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Disposable service TARGET, using the complete setup and unit in this bundle's lessons/05.md.\n# That lesson includes a free VM route; a Pi is optional. Perform its transfer/installation block first.\n# The input unit is inputs/05/ascend-device.service and its state is /opt/ascend-device/data/relay.sqlite.\n# Begin after its positive client check has written one synthetic record.\nsystemctl is-enabled ascend-device.service\nsystemctl status ascend-device.service --no-pager\ntimedatectl status\npython3 shared/check_service.py --url http://127.0.0.1:8000 --expect-release device-v1\nsudo -u relaylab-device python3 /opt/ascend-device/shared/backup.py inspect --source /opt/ascend-device/data/relay.sqlite\n# Retain the record hash; omit --write during the before/after comparison.\nsudo reboot\n# After the owned target returns, reopen the trusted SSH connection/forward and repeat these observations.\n# Record actual release, record hash, enabled/running status and observation location.\n# A monitor on the same physical host cannot observe while that host has no power.\n# If the service only worked while your terminal was open, inspect the installed unit's user, paths and journal,\n# apply the smallest repair and repeat the guest reboot. Do not replace the finish line with a process screenshot.\n```", "Observe these controls and retain actual output: Rebooted guest returns the correct release/data, and the observation location is explicit. Physical uptime claims require actual power/network/device evidence.", "Recover and clean up only the named resources: Stop and disable only the ascend-device.service practice unit when finished, close its client SSH forward, and retain the explicitly named target data plus local notes. The complete selective device/VM teardown is in lessons/05.md."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 01 --out work/01-reference. Record that help was used."]
"done_when" = "Rebooted guest returns the correct release/data, and the observation location is explicit. Physical uptime claims require actual power/network/device evidence. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
"checkpoints" = [{ "id" = "diagnosis", "title" = "Explain the failed control", "minutes" = 15, "done_when" = "A prediction and the portable check identify the failing control and state what real observation is still needed.", "next_step" = "Run the named native operation on the owned machine and collect its actual success/failure controls." }, { "id" = "observation", "title" = "Retain the native observation", "minutes" = 30, "done_when" = "The intended native positive and negative observations are retained with their environment and file paths.", "next_step" = "Recover the changed condition, check retained state/access, and complete the named cleanup." }]

