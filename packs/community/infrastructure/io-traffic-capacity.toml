"title" = "Operate: Balance service traffic"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "A balancer chooses an eligible backend according to its policy. Readiness should reflect whether that instance can accept the intended work; a process being alive is weaker evidence. The proxy itself may remain a single failure point. Configure the policy explicitly and distinguish new traffic removal from completion of already active work."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 02 --variant guided --out work/02-guided\npython3 lab.py check work/02-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/02-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/02.md. Predict a successful response and a failure before running the following native operations.", "```sh\nmkdir -p work\nprintf 'ready\n' > work/ready-a\nprintf 'ready\n' > work/ready-b\n# Terminal A:\npython3 shared/relay.py --host 127.0.0.1 --port 8001 --data work/a.sqlite --release a --read-only --ready-file work/ready-a\n# Terminal B uses port 8002, data work/b.sqlite, release b, and work/ready-b.\n# Terminal C:\ncaddy validate --config inputs/02/Caddyfile --adapter caddyfile\ncaddy run --config inputs/02/Caddyfile --adapter caddyfile\n# CLIENT: curl http://127.0.0.1:8080/version repeatedly and record both teaching instance labels.\n# Empty work/ready-b, wait for the configured health interval and observe new traffic.\n# Restore ready in that file and verify B returns. Stop only these three processes.\n```", "```sh\n# Terminal B full command, started separately from A:\npython3 shared/relay.py --host 127.0.0.1 --port 8002 --data work/b.sqlite --release b --read-only --ready-file work/ready-b\n# CLIENT commands, one at a time after A/B/edge are running:\n# curl http://127.0.0.1:8080/version\n# Truncate only this lab readiness file: truncate -s 0 work/ready-b\n# After two health intervals, repeat the client request; restore with: printf 'ready\\n' > work/ready-b\n```", "Observe these controls and retain actual output: Both teaching targets receive traffic while ready, B is removed/restored as readiness changes, and the learner identifies the edge/host failure points. The labels a/b identify targets in this exercise, not a production mixed-version guarantee.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 02 --out work/02-reference. Record that help was used."]
"done_when" = "Both teaching targets receive traffic while ready, B is removed/restored as readiness changes, and the learner identifies the edge/host failure points. The labels a/b identify targets in this exercise, not a production mixed-version guarantee. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
