rk/load-one-client-summary.json\"))[\"window_seconds\"])')\npython3 shared/analyze.py work/load-one-client.csv --window-seconds \"$ASCEND_LOAD_WINDOW\"\n# These are elapsed-time samples in a closed model; do not feed this schema to lab.py analyze.\n```", "Observe these controls and retain actual output: Compare a controlled concurrency change using the same workload and report which boundary is limited. Do not infer more hardware capacity from a short artificial I/O delay.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
