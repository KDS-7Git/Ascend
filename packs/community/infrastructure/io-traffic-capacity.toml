"title" = "Operate: Define the workload"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "A capacity statement needs a workload, an observation window and a success condition. Concurrent users, requests in progress and requests per second are different quantities. Include failed and unfinished requests in accounting, and examine tails rather than only average successful latency. Recorded CSV fixtures let you learn the calculation without generating external load."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 01 --variant guided --out work/01-guided\npython3 lab.py check work/01-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/01-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/01.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# PC or service GUEST, in this extracted track directory; leave this terminal running.\nmkdir -p data\npython3 shared/relay.py --host 127.0.0.1 --port 8000 --data data/relay.sqlite --release v1\n```", "```sh\npython3 lab.py analyze inputs/01/requests.csv\n# Read all ten rows and calculate the observation window by hand.\n# Compare all-request latency with the successful-only subset; explain the 503 record.\n# Then collect a small real local run using shared/probe_load.py according to --help:\npython3 shared/probe_load.py --url http://127.0.0.1:8000/work --clients 4 --requests 24 --output work/load-1.csv > work/load-1-summary.json\nASCEND_LOAD_WINDOW=$(python3 -c 'import json; print(json.load(open(\"work/load-1-summary.json\"))[\"window_seconds\"])')\npython3 shared/analyze.py work/load-1.csv --window-seconds \"$ASCEND_LOAD_WINDOW\"\n# Keep its target loopback/owned and its client/rate bounds below the declared lab envelope.\n```", "Observe these controls and retain actual output: Retain units, window, latency distribution, successful throughput and errors. CSV arithmetic is a dataset observation; a hardware-capacity claim requires an actual measured workload.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 01 --out work/01-reference. Record that help was used."]
"done_when" = "Retain units, window, latency distribution, successful throughput and errors. CSV arithmetic is a dataset observation; a hardware-capacity claim requires an actual measured workload. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
