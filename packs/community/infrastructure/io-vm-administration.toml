"id" = "io-vm-administration-02-practice"
"title" = "Operate: Create a machine from a known image"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "A cloud image is a reusable operating-system disk, while cloud-init supplies each guest with its own identity and startup configuration. A template must not share private keys, machine IDs or mutable application data between users. Verify the image source/digest, create a separate writable disk, and preserve console access before relying on SSH. A host console can show boot output without providing an authenticated guest shell. If first-boot key injection fails before a console password was set, use the owned host's stopped-disk backup and cloud-init reseed procedure below. Never change a running guest disk offline or infer permission to access the host from guest SSH."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 02 --variant guided --out work/02-guided\npython3 lab.py check work/02-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/02-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/02.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Linux HOST, after checking KVM and package/tool availability in level 1.\n# Ubuntu host preparation if these tools are absent (owned host administrator only):\n# sudo apt-get install qemu-kvm libvirt-daemon-system libvirt-clients virtinst cloud-image-utils\n# Use sudo virsh consistently below. Do not grant a guest learner the host daemon socket.\nsudo virsh -c qemu:///system net-list --all\n# If the shipped default NAT network is inactive: sudo virsh -c qemu:///system net-start default\n# If default does not exist, create a reviewed isolated NAT network before importing a guest.\nmkdir -p work/vm\ncurl -fL https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img -o work/vm/noble-server-cloudimg-amd64.img\ncurl -fL https://cloud-images.ubuntu.com/noble/current/SHA256SUMS -o work/vm/SHA256SUMS\nsha256sum work/vm/noble-server-cloudimg-amd64.img\n# Compare with the exact noble-server-cloudimg-amd64.img entry in SHA256SUMS.\n# Downloads over HTTPS plus a matched digest detect an incomplete/mismatched download;\n# verify Ubuntu's signed checksum file as well when validating publisher provenance.\nssh-keygen -t ed25519 -f work/vm/relay-a-key\ncp inputs/02/user-data work/vm/user-data\ncp inputs/02/meta-data work/vm/meta-data\n# In your editor replace the PUBLIC-key placeholder in work/vm/user-data; never paste the private key.\ncloud-localds work/vm/seed.iso work/vm/user-data work/vm/meta-data\n# This NEW directory is beneath the supported libvirt image path, not a private home directory.\nsudo mkdir /var/lib/libvirt/images/ascend-lab\nsudo qemu-img convert -O qcow2 work/vm/noble-server-cloudimg-amd64.img /var/lib/libvirt/images/ascend-lab/relay-a.qcow2\nsudo qemu-img resize /var/lib/libvirt/images/ascend-lab/relay-a.qcow2 12G\nsudo install -m 0644 work/vm/seed.iso /var/lib/libvirt/images/ascend-lab/seed-a.iso\n# Ubuntu's QEMU service identity; inspect getent first if using a different distribution.\ngetent passwd libvirt-qemu\ngetent group kvm\nsudo chown -R libvirt-qemu:kvm /var/lib/libvirt/images/ascend-lab\nsudo virt-install --connect qemu:///system --name relay-a --memory 1024 --vcpus 1,maxvcpus=2 --import --disk path=/var/lib/libvirt/images/ascend-lab/relay-a.qcow2,format=qcow2 --disk path=/var/lib/libvirt/images/ascend-lab/seed-a.iso,device=cdrom --network network=default --osinfo detect=on,require=off --graphics none --noautoconsole\nsudo virsh -c qemu:///system console relay-a\n# Console escape: Ctrl+]. Cloud images generally have no password login: watch boot/cloud-init here.\n# HOST: sudo virsh -c qemu:///system net-dhcp-leases default\n# Connect with the public-key identity after verifying the guest fingerprint from trusted boot/console output.\n# GUEST: cloud-init status --wait; hostname; ip -br address; sudo systemctl status ssh --no-pager\n# GUEST: set a guest-local console recovery password with sudo passwd learner after key login.\n# SSH password login remains disabled; retain the password privately and test the owned console path.\n```", "```sh\n# RECOVERY variant: OWNED HOST, for this newly created disposable guest only.\n# First inspect boot output through virsh console and retain the original cloud-init input files.\n# A console login prompt does not imply the cloud image has a usable password.\nsudo virsh -c qemu:///system shutdown relay-a\nsudo virsh -c qemu:///system domstate relay-a\n# Do not continue until the guest is shut off. If this failed first-boot guest cannot obey ACPI shutdown,\n# the explicit host force-stop is sudo virsh -c qemu:///system destroy relay-a (a forced power cut).\n# Use that only for this disposable failed-first-boot target; keep its disk for diagnosis, not for a durability claim.\nmkdir -p work/backups\nsudo virsh -c qemu:///system dumpxml relay-a > work/backups/relay-a-before-reseed.xml\nsudo qemu-img convert -O qcow2 /var/lib/libvirt/images/ascend-lab/relay-a.qcow2 work/backups/relay-a-before-reseed.qcow2\ncp inputs/02/user-data work/vm/recovery-user-data\n# Edit recovery-user-data: paste the exact existing operator PUBLIC key from work/vm/relay-a-key.pub.\n# Keep ssh_pwauth false. Check YAML indentation, username and the assigned public key before rebuilding the seed.\nprintf 'instance-id: relay-a-reseed-01\nlocal-hostname: relay-a\n' > work/vm/recovery-meta-data\ncloud-localds work/vm/recovery-seed.iso work/vm/recovery-user-data work/vm/recovery-meta-data\n# With libguestfs-tools on the HOST, clear only the stopped guest's cloud-init cache; the backup stays untouched.\nsudo virt-customize --add /var/lib/libvirt/images/ascend-lab/relay-a.qcow2 --run-command 'cloud-init clean --logs'\nsudo install -o libvirt-qemu -g kvm -m 0644 work/vm/recovery-seed.iso /var/lib/libvirt/images/ascend-lab/seed-a-recovery.iso\nsudo virsh -c qemu:///system domblklist relay-a\n# Identify the actual CD-ROM target containing seed-a.iso (do not guess the primary disk target).\n# Replace ACTUAL_SEED_CDROM_TARGET below with that observed CD-ROM target.\nsudo virsh -c qemu:///system change-media relay-a ACTUAL_SEED_CDROM_TARGET --source /var/lib/libvirt/images/ascend-lab/seed-a-recovery.iso --update --config\nsudo virsh -c qemu:///system start relay-a\nsudo virsh -c qemu:///system console relay-a\n# Re-check trusted boot/key output and DHCP address, then use the corrected public-key login.\n# A changed server key after reseeding needs independent verification before updating that host's known_hosts entry.\n# GUEST after key login: cloud-init status --wait; sudo passwd learner\n# Test the new PRIVATE console password through the owned console while SSH still works.\n# SSH password authentication remains disabled. Subsequent lockout practice can use this tested console login.\n# This first-boot repair retains the original disk path; later resize/backup lessons still refer to that same guest.\n```", "Observe these controls and retain actual output: Observe the real guest boot, unique cloud-init identity and verified-key login. For the changed first-boot failure, retain the failed input/console observation, independent cold backup and corrected reseed result; a passwordless console prompt is not a recovery shell. After first successful key login, establish and test the private console recovery password before an intentional SSH lockout. Guest sudo remains separate from host administration.", "Recover and clean up only the named resources: Retain the named disk, seed and private key for levels 3–8, outside public notes. At final teardown stop only relay-a/relay-restore, inspect each domain disk path, undefine the named domains and remove only their identified lab files. Do not remove a pool or default network used by other guests."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 02 --out work/02-reference. Record that help was used."]
"done_when" = "Observe the real guest boot, unique cloud-init identity and verified-key login. For the changed first-boot failure, retain the failed input/console observation, independent cold backup and corrected reseed result; a passwordless console prompt is not a recovery shell. After first successful key login, establish and test the private console recovery password before an intentional SSH lockout. Guest sudo remains separate from host administration. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
"checkpoints" = [{ "id" = "diagnosis", "title" = "Explain the failed control", "minutes" = 15, "done_when" = "A prediction and the portable check identify the failing control and state what real observation is still needed.", "next_step" = "Run the named native operation on the owned machine and collect its actual success/failure controls." }, { "id" = "observation", "title" = "Retain the native observation", "minutes" = 30, "done_when" = "The intended native positive and negative observations are retained with their environment and file paths.", "next_step" = "Recover the changed condition, check retained state/access, and complete the named cleanup." }]

