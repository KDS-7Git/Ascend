"brief" = "A snapshot may depend on the original disk and storage pool. It is not an independent restore source. A clone needs a unique machine identity, MAC/IP and host keys. A consistent backup must represent a recoverable application state, not just an arbitrary file copy while writes continue. Test the restored guest with the source stopped."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 07 --variant guided --out work/07-guided\npython3 lab.py check work/07-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/07-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/07.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# HOST: stop only your owned source; do not continue until domstate is shut off.\nsudo virsh -c qemu:///system shutdown relay-a\nsudo virsh -c qemu:///system domstate relay-a\nmkdir -p work/backups\nsudo virsh -c qemu:///system dumpxml relay-a > work/backups/relay-a.xml\nsudo qemu-img convert -O qcow2 /var/lib/libvirt/images/ascend-lab/relay-a.qcow2 work/backups/relay-a-cold.qcow2\nsudo qemu-img check work/backups/relay-a-cold.qcow2\n# RESTORE from the BACKUP into a new disk; the live source disk is not the input.\nsudo qemu-img convert -O qcow2 work/backups/relay-a-cold.qcow2 /var/lib/libvirt/images/ascend-lab/relay-restore.qcow2\n# Offline guest customization uses libguestfs-tools on the HOST and extra temporary appliance memory.\n# The following command modifies the new restore disk only.\nsudo virt-customize --add /var/lib/libvirt/images/ascend-lab/relay-restore.qcow2 --hostname relay-restore --run-command 'cloud-init clean --logs --machine-id' --delete '/etc/ssh/ssh_host_*'\nssh-keygen -t ed25519 -f work/vm/relay-restore-key\ncp inputs/07/user-data work/vm/restore-user-data\ncp inputs/07/meta-data work/vm/restore-meta-data\n# Replace the PUBLIC-key placeholder with relay-restore-key.pub in restore-user-data.\ncloud-localds work/vm/restore-seed.iso work/vm/restore-user-data work/vm/restore-meta-data\nsudo install -m 0644 work/vm/restore-seed.iso /var/lib/libvirt/images/ascend-lab/seed-restore.iso\nsudo chown libvirt-qemu:kvm /var/lib/libvirt/images/ascend-lab/relay-restore.qcow2 /var/lib/libvirt/images/ascend-lab/seed-restore.iso\nsudo virt-install --connect qemu:///system --name relay-restore --memory 1024 --vcpus 1 --import --disk path=/var/lib/libvirt/images/ascend-lab/relay-restore.qcow2,format=qcow2 --disk path=/var/lib/libvirt/images/ascend-lab/seed-restore.iso,device=cdrom --network network=default --osinfo detect=on,require=off --graphics none --noautoconsole\nsudo virsh -c qemu:///system domiflist relay-restore\nsudo virsh -c qemu:///system net-dhcp-leases default\n# Keep relay-a STOPPED. Verify new MAC, hostname, /etc/machine-id, SSH host-key fingerprint and cloud-init status.\n# Start the restored application and compare its actual pre-backup synthetic records.\n# A fresh VM without those records or one created from the original disk does not pass recovery.\n```", "Observe these controls and retain actual output: Boot a uniquely identified restored guest and check application records while the source is stopped. A successful clone command without those checks does not prove recovery.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 07 --out work/07-reference. Record that help was used."]
"done_when" = "Boot a uniquely identified restored guest and check application records while the source is stopped. A successful clone command without those checks does not prove recovery. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
"checkpoints" = [{ "id" = "diagnosis", "title" = "Explain the failed control", "minutes" = 15, "done_when" = "A prediction and the portable check identify the failing control and state what real observation is still needed.", "next_step" = "Run the named native operation on the owned machine and collect its actual success/failure controls." }, { "id" = "observation", "title" = "Retain the native observation", "minutes" = 30, "done_when" = "The intended native positive and negative observations are retained with their environment and file paths.", "next_step" = "Recover the changed condition, check retained state/access, and complete the named cleanup." }]

