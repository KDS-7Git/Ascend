"id" = "io-vm-administration-03-practice"
"title" = "Operate: Build virtual networks"
"size" = "M"
"minutes" = 90
"needs" = []
"brief" = "A NAT virtual network gives guests a private subnet and an outward path through the host. A bridge connects virtual NICs to a chosen network but does not grant an address or bypass firewalls. Wireless bridging support varies. Use default libvirt NAT first and examine host/guest/edge routes separately; a successful guest boot does not imply reachability."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 03 --variant guided --out work/03-guided\npython3 lab.py check work/03-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/03-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/03.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# HOST: inspect the existing default lab network; do not replace the host network.\nsudo virsh -c qemu:///system net-list --all\nsudo virsh -c qemu:///system net-dumpxml default\nsudo virsh -c qemu:///system domiflist relay-a\nsudo virsh -c qemu:///system domifaddr relay-a\n# GUEST console:\n# ip -br address\n# ip route\n# ss -ltnp\n# Choose the observed address when connecting from the HOST/CLIENT.\n```", "```sh\n# Optional second private network, on the owned libvirt HOST only.\n# Check first that 172.29.44.0/24 and ascendbr1 do not conflict with an existing host/VPN route.\nip route\nsudo virsh -c qemu:///system net-define inputs/03/isolated-network.xml\nsudo virsh -c qemu:///system net-start ascend-isolated\nsudo virsh -c qemu:///system net-dumpxml ascend-isolated\n# This XML has no <forward> element: it creates an isolated virtual network, not a public LAN bridge.\n# Stop relay-a before attaching its extra persistent NIC; keep its original management NIC.\nsudo virsh -c qemu:///system shutdown relay-a\nsudo virsh -c qemu:///system domstate relay-a\nsudo virsh -c qemu:///system attach-interface relay-a network ascend-isolated --model virtio --config\nsudo virsh -c qemu:///system domiflist relay-a\nsudo virsh -c qemu:///system start relay-a\n# GUEST: match the NEW NIC MAC from domiflist to ip link; do not modify the original NIC.\n# GUEST: sudo ip link set ACTUAL_NEW_LAB_INTERFACE up\n# GUEST: sudo ip address add 172.29.44.10/24 dev ACTUAL_NEW_LAB_INTERFACE\n# GUEST: run Relay bound only to 172.29.44.10:8000, then HOST curl http://172.29.44.10:8000/version\n# A second learner-owned client guest can use 172.29.44.11/24 on this same network.\n# Inspect both routes and test wrong-address/bind failures without granting unrelated ports.\n# At cleanup stop each involved guest, detach only this added NIC by its recorded MAC,\n# then stop/undefine ascend-isolated only after confirming no other guest uses it.\n# This extra interface does not remove an existing default route on the original guest NIC.\n```", "Observe these controls and retain actual output: Retain the guest IP, virtual NIC/network and host route. A peer HTTP/SSH probe must reach that guest; mark simulated/public boundaries accurately.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 03 --out work/03-reference. Record that help was used."]
"done_when" = "Retain the guest IP, virtual NIC/network and host route. A peer HTTP/SSH probe must reach that guest; mark simulated/public boundaries accurately. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
"checkpoints" = [{ "id" = "diagnosis", "title" = "Explain the failed control", "minutes" = 15, "done_when" = "A prediction and the portable check identify the failing control and state what real observation is still needed.", "next_step" = "Run the named native operation on the owned machine and collect its actual success/failure controls." }, { "id" = "observation", "title" = "Retain the native observation", "minutes" = 30, "done_when" = "The intended native positive and negative observations are retained with their environment and file paths.", "next_step" = "Recover the changed condition, check retained state/access, and complete the named cleanup." }]

