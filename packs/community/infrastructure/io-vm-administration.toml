"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 04 --variant guided --out work/04-guided\npython3 lab.py check work/04-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/04-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/04.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Before deliberate SSH lockout, verify the console password configured and tested after level 02's successful key login.\n# If initial key injection failed before that password existed, use level 02's stopped-guest backup/reseed route.\n# The fingerprint of relay-a-key.pub identifies the CLIENT credential; obtain the SERVER fingerprint through the trusted guest console.\n# Console access alone provides boot observation, not an automatic authenticated shell.\n```", "```sh\n# HOST: set this to the actual address discovered in the previous lesson.\nLAB_GUEST_IP=192.168.122.10\nssh-keygen -lf work/vm/relay-a-key.pub\nssh -i work/vm/relay-a-key learner@\"$LAB_GUEST_IP\"\n# GUEST: id; hostname; sudo systemctl status ssh --no-pager\n# HOST rescue path, if SSH is unavailable:\nsudo virsh -c qemu:///system console relay-a\n# If a second owned bastion is required, use a documented key configuration:\n# ssh -J learner@BASTION_ADDRESS learner@PRIVATE_GUEST_ADDRESS\n```", "Observe these controls and retain actual output: Use legitimate guest access and host console recovery; show guest credentials cannot invoke unrelated hypervisor administration. Never disable StrictHostKeyChecking to dismiss a changed identity.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
