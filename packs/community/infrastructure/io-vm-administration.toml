"needs" = []
"brief" = "The guest kernel sees virtual hardware supplied by a host process and hypervisor. A management application sends lifecycle requests; it does not need to remain visible for the guest to run. SSH is an independent service inside the guest. Hardware acceleration requires CPU, firmware, host kernel and permissions; emulation can run some foreign architectures but does not produce native performance evidence."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 01 --variant guided --out work/01-guided\npython3 lab.py check work/01-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/01-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/01.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Intended Linux HOST. These observations do not install or start a guest.\nlscpu\ntest -e /dev/kvm && ls -l /dev/kvm\nfree -h\ndf -h .\n# If the supported libvirt tools are installed:\nvirt-host-validate qemu\nsudo virsh -c qemu:///system list --all\npython3 lab.py inspect-vm inputs/01/guest.xml\n```", "Observe these controls and retain actual output: Identify host, guest and control plane from actual observations. If KVM is not available, report the reason and select a tested alternate host; do not call a JSON definition a created VM.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 01 --out work/01-reference. Record that help was used."]
"done_when" = "Identify host, guest and control plane from actual observations. If KVM is not available, report the reason and select a tested alternate host; do not call a JSON definition a created VM. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
