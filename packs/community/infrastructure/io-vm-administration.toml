"brief" = "Fleet administration requires an inventory and resource accounting, not merely several terminal tabs. A small host can oversubscribe vCPUs but cannot create physical CPU or RAM. Keep headroom for the host and transient work. Failed startup or deletion remains an owned state that needs reconciliation; it must not silently release reservations in a management UI."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 08 --variant guided --out work/08-guided\npython3 lab.py check work/08-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/08-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/08.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# HOST: observe only your named lab guests.\nsudo virsh -c qemu:///system list --all\nsudo virsh -c qemu:///system dominfo relay-a\nsudo virsh -c qemu:///system domstats relay-a --state --vcpu --balloon --block\nsudo virsh -c qemu:///system autostart relay-a\nsudo virsh -c qemu:///system shutdown relay-a\nsudo virsh -c qemu:///system domstate relay-a\n# Retain backups and inventory before final removal; inspect snapshots/storage first.\n# virsh undefine removes a definition, not necessarily every disk; do not use bulk remove-all commands.\n```", "Observe these controls and retain actual output: Reconcile guest definitions, disks, addresses and intended autostart. Check owned guest recovery and retain evidence before selective cleanup.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 08 --out work/08-reference. Record that help was used."]
