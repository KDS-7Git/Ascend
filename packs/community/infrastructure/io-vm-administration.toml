"brief" = "Virtual CPU count, scheduler quota and actual CPU time are different controls. Configured memory may require a reboot, balloon support or guest hotplug support before it changes. Disk capacity exists at multiple layers: virtual block device, partition, volume and filesystem. Back up the owned guest before changing storage and inspect each layer after the change."
"steps" = ["First predict the failed control from the assignment. This short portable exercise checks a configuration model, not a running machine. Create a fresh workspace (the tool refuses to overwrite an existing one):\n```sh\npython3 lab.py prepare 06 --variant guided --out work/06-guided\npython3 lab.py check work/06-guided\n```\nThe initial check intentionally fails. Read assignment.json, edit candidate.json, then repeat the same check. Your files stay in work/06-guided. If repeating the exercise, choose a new --out directory. A green result checks only this data contract. The native operation and its finish line below remain required.", "Read the mechanism and environment boundaries in lessons/06.md. Predict a successful response and a failure before running the following native operations.", "```sh\n# Before resizing: use the cold-backup procedure in level 7, then return here.\n# Retain the guest's sample application record and disk inventory for the after-change comparison.\n# Commands below are HOST commands; do not resize or check a disk while its guest is running.\n```", "```sh\n# HOST; stop only your owned guest and wait until domstate reports shut off.\nsudo virsh -c qemu:///system shutdown relay-a\nsudo virsh -c qemu:///system domstate relay-a\nsudo virsh -c qemu:///system setvcpus relay-a 2 --config\nsudo virsh -c qemu:///system setmaxmem relay-a 2097152 --config\nsudo virsh -c qemu:///system setmem relay-a 2097152 --config\nsudo virsh -c qemu:///system domblklist relay-a\n# Only after shutdown and a verified backup, resize the identified owned qcow2:\nsudo qemu-img resize /var/lib/libvirt/images/ascend-lab/relay-a.qcow2 16G\nsudo virsh -c qemu:///system start relay-a\n# GUEST: lscpu; free -m; lsblk -f; df -h\n# If vda1 is the actual ext4 root layout, use growpart /dev/vda 1 and resize2fs /dev/vda1 in that GUEST.\n# Other partition/filesystem layouts require their corresponding procedure.\n```", "Observe these controls and retain actual output: Record requested/configured/current CPU and RAM, block size and filesystem capacity, plus retained data. Stop if layout or hotplug support differs; do not run guest disk commands on the host.", "Recover and clean up only the named resources: Stop only the service started for this lesson. Keep the edited files and transcript in work/. Remove only the named disposable resources after validating your retained evidence."]
"hints" = ["Check which machine owns the listener, address, file and identity. The same loopback address names a different endpoint on each machine.", "For the portable model only, create a separate help workspace: python3 lab.py reference 06 --out work/06-reference. Record that help was used."]
"done_when" = "Record requested/configured/current CPU and RAM, block size and filesystem capacity, plus retained data. Stop if layout or hotplug support differs; do not run guest disk commands on the host. Retain your prediction, commands, positive and negative results, recovery and help used in your local note. Complete a required native operation in the stated environment before marking it done. Manual completion records your assessment; a saved file or passing portable case is not automatic verified skill."
