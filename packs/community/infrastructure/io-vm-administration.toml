[[node]]
"level" = "io-vm-administration-02"
"preview" = "Create a guest with a unique name, key and network identity using libvirt tooling."
"requirements" = "Python 3.11+ for the portable case. Native route: an owned Ubuntu 24.04 x86-64 Linux host with KVM, libvirt/QEMU, virt-install, cloud-image-utils, curl, and an existing default NAT network. Reserve host memory; one guest starts at 1 GiB RAM, 1 vCPU and a 12 GiB sparse disk. A host administrator must install these packages; guest SSH alone is insufficient. The failed-first-boot repair variant additionally needs host libguestfs-tools/virt-customize and temporary disk/memory room for its appliance and cold backup; no guest password is assumed."
"setup" = "Download /training/io-vm-administration.zip and extract it into a NEW folder you choose on your PC. Open a terminal in its io-vm-administration directory; read README.md and bootstrap.md. Python 3.11+ runs the portable tools without extra Python packages. POSIX examples use Linux; Windows users can use a prepared Linux guest or WSL for the initial shell practice. Create work/ and notes/. Copy notes-template.md in your editor to notes/02.md, or append a dated attempt if the note already exists. Input files are in inputs/NN/, portable starting cases in cases/, operational instructions in lessons/NN.md, and the shared synthetic service in shared/. All generated work remains in the local paths printed by the tools. Opening a challenge does not create or upload these files. Use Ascend's notebook/upload control only when you choose to copy evidence into Ascend. Run commands one at a time on the named HOST, GUEST or CLIENT. Replace explicit address/key placeholders after inspection, and keep each foreground service in its own terminal. Stop its process with Ctrl+C before reusing the same listener."
