# Track 3 of 5: Network & System Penetration Testing
# kind = "proficiency": this is the "attack a whole machine, not just a web form" track. Builds on
# networking-for-security (you need nmap/TCP fundamentals first) and on the home-hack-lab's recon-scan node.
# Covers enumeration, exploitation, privilege escalation, and a first taste of Active Directory.
#
# DRAFT written by Claude. NOT reviewed. Run `ascend pack lint`, `ascend pack check-links`, read every
# done_when, then `ascend pack review network-penetration-testing` before trusting it.
# Legal note baked into this pack: every target referenced is either your own Pi, a deliberately vulnerable VM
# you download and run yourself (VulnHub), or a platform built for this purpose (TryHackMe/HTB free tiers).
# Never point these techniques at anything you don't own or don't have explicit permission to test.

[pack]
id = "network-penetration-testing"
title = "Network & System Penetration Testing"
kind = "proficiency"
version = 2
source = "ai-draft"
reviewed = false

[vars]
lab_dir = "~/cyber/pentest"
pi_ip = "192.168.1.50"

[[level]]
id = "recon"
title = "Enumeration and reconnaissance"
lane = "main"

[[level]]
id = "service-exploitation"
title = "Exploiting common services"
lane = "main"

[[level]]
id = "metasploit"
title = "The Metasploit Framework"
lane = "main"

[[level]]
id = "linux-privesc"
title = "Linux privilege escalation"
lane = "main"

[[level]]
id = "windows-privesc"
title = "Windows privilege escalation"
lane = "main"

[[level]]
id = "active-directory"
title = "Active Directory basics"
lane = "main"

[[level]]
id = "post-exploitation"
title = "Post-exploitation and persistence (defensive framing)"
lane = "main"

[[level]]
id = "capstone"
title = "Full box, start to root"
lane = "main"

[[level]]
id = "boxes"
title = "Retired boxes, one at a time"
lane = "side"

# ---------------------------------------------------------------- 1: recon
[[node]]
level = "recon"
id = "nmap-scan-types"
title = "Discover what your lab is listening for"
size = "M"
needs = []
done_when = "ran 4 different nmap scan types against the Pi, saved all 4 outputs, and wrote {lab_dir}/notes/scan-types.md on what each one actually does differently at the packet level"
resource = "https://nmap.org/book/man-port-scanning-techniques.html"
verify = { type = "file", path = "{lab_dir}/notes/scan-types.md", min_bytes = 150 }
minutes = 45
brief = "Your own lab machine has a small attack surface. Find it, then see how different scans tell different stories."
steps = ["Choose your own Pi or an isolated lab VM. Run connect and version-detection scans against a small explicit port list.", "Try SYN and UDP scans against the same owned target where permissions allow. Record any required elevated privileges or ambiguous UDP results.", "Save the four outputs and one packet-level difference for each in {lab_dir}/notes/scan-types.md."]
hints = ["Open, closed, and filtered are observations, not synonyms. UDP silence may mean open or filtered."]

[[node]]
level = "recon"
id = "service-enumeration"
title = "Turn an open port into a useful lead"
size = "M"
needs = ["nmap-scan-types"]
done_when = "ran nmap -sV -sC against the Pi and documented every service found, its version, and one known-CVE search per service, at {lab_dir}/notes/service-enum.md"
resource = "https://nmap.org/book/man-version-detection.html"
verify = { type = "file", path = "{lab_dir}/notes/service-enum.md", min_bytes = 200 }
minutes = 45
brief = "A port number is only a clue. Build an evidence-backed picture of what is actually running."
steps = ["Run version detection and suitable default scripts against the lab target from your first scan.", "Confirm one service using its own client or protocol, then compare the result with the scan.", "Save the service table and one vendor advisory or CVE search per service in {lab_dir}/notes/service-enum.md. Mark uncertain version matches as unconfirmed."]
hints = ["A banner can be misleading; a matching version string alone does not prove a vulnerability."]

[[node]]
level = "recon"
id = "web-enum"
title = "Find a hidden route without chasing false positives"
size = "M"
needs = []
done_when = "ran a directory brute-force (gobuster or ffuf) against Juice Shop on the Pi, saved the output, wrote 3 lines on what a wordlist actually is at {lab_dir}/notes/web-enum.md"
resource = "https://github.com/OJ/gobuster"
verify = { type = "file", path = "{lab_dir}/notes/web-enum.md", min_bytes = 100 }
minutes = 45
brief = "A lab web app has more routes than its navigation shows. Separate a real discovery from a catch-all response."
steps = ["Use an owned lab app or a designated training target, and request one known path and one nonsense path.", "Run a small directory wordlist with gobuster or ffuf, comparing status codes and response lengths with your baseline.", "Confirm one result manually and save the output plus your false-positive check in {lab_dir}/notes/web-enum.md."]
hints = ["Single-page apps may return the same HTML for nonexistent paths. A 200 status by itself is not a discovery."]

[[node]]
level = "recon"
id = "recon-milestone"
title = "Build an attack-surface map of a fresh lab"
size = "L"
needs = ["service-enumeration", "web-enum"]
milestone = true
done_when = "Saved a fresh lab target’s service map and scan evidence, plus two ranked, testable hypotheses before exploitation, in {lab_dir}/notes/recon-milestone.md."
resource = "https://www.vulnhub.com/"
verify = { type = "file", path = "{lab_dir}/notes/recon-milestone.md", min_bytes = 300 }

# ---------------------------------------------------------------- 2: service-exploitation
minutes = 90
brief = "Prove you can choose a useful next move from evidence before attempting an exploit."
steps = ["Choose an isolated vulnerable VM or a training-platform target in scope.", "Map its reachable ports, services, and web entry points. Keep the raw outputs.", "Save {lab_dir}/notes/recon-milestone.md with the map, two ranked hypotheses, and the next check that would confirm or reject each."]
hints = []

[[node]]
level = "service-exploitation"
id = "ftp-smb-exploitation"
title = "Exploiting misconfigured FTP and SMB"
size = "M"
needs = []
done_when = "found and exploited an anonymous FTP or SMB share on a VulnHub/TryHackMe box, documented the access gained at {lab_dir}/notes/ftp-smb.md"
resource = "https://www.rapid7.com/db/modules/auxiliary/scanner/ftp/anonymous/"
verify = { type = "file", path = "{lab_dir}/notes/ftp-smb.md", min_bytes = 150 }

[[node]]
level = "service-exploitation"
id = "ssh-attacks"
title = "SSH: weak credentials, key reuse, and why brute force is a last resort"
size = "M"
needs = []
done_when = "set up a deliberately weak SSH config on a throwaway VM (NOT your real Pi) and documented a credential-based attack against it at {lab_dir}/notes/ssh-attacks.md, plus why you hardened the real Pi differently in home-hack-lab"
resource = "https://man.openbsd.org/sshd_config"
verify = { type = "file", path = "{lab_dir}/notes/ssh-attacks.md", min_bytes = 150 }

[[node]]
level = "service-exploitation"
id = "exploit-db-usage"
title = "Finding and reading a real CVE/exploit writeup"
size = "S"
needs = ["ftp-smb-exploitation"]
done_when = "found one real CVE for a service version you enumerated earlier, read the exploit-db or vendor writeup, and summarised the root cause in your own words at {lab_dir}/notes/cve-reading.md"
resource = "https://www.exploit-db.com/"
verify = { type = "file", path = "{lab_dir}/notes/cve-reading.md", min_bytes = 150 }

[[node]]
level = "service-exploitation"
id = "service-exploitation-milestone"
title = "Gain a foothold using a public exploit, understood not just run (milestone)"
size = "L"
needs = ["ssh-attacks", "exploit-db-usage"]
milestone = true
done_when = "used a public exploit against a vulnerable service on a VulnHub/TryHackMe box and got a shell, documented at {lab_dir}/notes/service-milestone.md not just the command but WHY the exploit works, line by line if it's a script you read"
resource = "https://www.exploit-db.com/"
verify = { type = "file", path = "{lab_dir}/notes/service-milestone.md", min_bytes = 300 }

