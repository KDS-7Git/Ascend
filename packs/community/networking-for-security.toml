level = "addressing"
id = "private-vs-public"
title = "Private ranges, NAT, and why your Pi has a 192.168.x.x address"
size = "S"
needs = ["ipv4-basics"]
done_when = "explained in 5 lines why my laptop and Pi share a private range but can both reach the internet, saved at {lab_dir}/notes/nat-basics.md"
resource = "https://www.cloudflare.com/learning/network-layer/what-is-nat/"

[[node]]
level = "addressing"
id = "routing-basics"
title = "How a router decides where a packet goes"
size = "M"
needs = ["private-vs-public"]
done_when = "ran `ip route` (or `route print` on Windows) on my own machine and annotated every line of output in {lab_dir}/notes/routing.md"
resource = "https://man7.org/linux/man-pages/man8/ip-route.8.html"
verify = { type = "file", path = "{lab_dir}/notes/routing.md", min_bytes = 150 }

[[node]]
level = "addressing"
id = "addressing-milestone"
title = "Design a subnet plan for my own home lab (milestone)"
size = "M"
needs = ["routing-basics"]
milestone = true
done_when = "wrote a subnet plan at {lab_dir}/notes/lab-subnet-plan.md covering laptop, Pi, and router, with CIDR blocks I chose myself and justified"
resource = "https://www.practicalnetworking.net/stand-alone/subnetting-mastery/"
verify = { type = "file", path = "{lab_dir}/notes/lab-subnet-plan.md", min_bytes = 250 }

# ---------------------------------------------------------------- 3: transport
[[node]]
level = "transport"
id = "tcp-handshake"
title = "The TCP three-way handshake, captured live"
size = "M"
needs = []
done_when = "captured a real TCP handshake (SYN/SYN-ACK/ACK) to {pi_ip} with Wireshark and saved the capture at {lab_dir}/pcaps/handshake.pcapng"
resource = "https://www.rfc-editor.org/rfc/rfc9293.html"
verify = { type = "file", path = "{lab_dir}/pcaps/handshake.pcapng", min_bytes = 500 }

[[node]]
level = "transport"
id = "tcp-vs-udp"
title = "TCP vs UDP: when each is actually used"
size = "S"
needs = []
done_when = "listed 5 real protocols/apps and said TCP or UDP for each, with one sentence of reasoning per item, in {lab_dir}/notes/tcp-vs-udp.md"
resource = "https://www.cloudflare.com/learning/ddos/glossary/user-datagram-protocol-udp/"
verify = { type = "file", path = "{lab_dir}/notes/tcp-vs-udp.md", min_bytes = 150 }

[[node]]
level = "transport"
id = "ports-and-sockets"
title = "Ports, sockets, and what `nmap` is actually asking"
size = "S"
needs = ["tcp-handshake"]
done_when = "ran a basic nmap scan against the Pi, saved the output, and explained in 3 lines what a socket is"
resource = "https://nmap.org/book/man.html"

[[node]]
level = "transport"
id = "transport-milestone"
title = "Build a tiny TCP client/server in Python (milestone)"
size = "L"
needs = ["ports-and-sockets", "tcp-vs-udp"]
milestone = true
done_when = "wrote a working TCP client and server from scratch (no copied code) that exchange one message, saved with the server at {lab_dir}/code/tcp-chat/server.py, and can explain every socket call without notes"
resource = "https://beej.us/guide/bgnet/html/"
verify = { type = "file", path = "{lab_dir}/code/tcp-chat/server.py", min_bytes = 50 }

# ---------------------------------------------------------------- 4: application
[[node]]
level = "application"
id = "dns-resolution"
title = "How DNS resolution actually works"
size = "M"
needs = []
done_when = "ran `dig` or `nslookup` on a real domain, captured the DNS query/response in Wireshark, saved both at {lab_dir}/notes/dns.md"
