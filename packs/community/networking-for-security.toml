verify = { type = "file", path = "{lab_dir}/notes/capstone-report.md", min_bytes = 400 }
minutes = 120
brief = "Use your toolkit on a real fault, or a staged fault in a disposable lab when your network is working well."
steps = ["Choose a fault in your own lab: a real issue, or a wrong DNS setting, gateway, or firewall rule in a disposable VM. Keep a way to restore its configuration.", "Write a prediction, then use at least two tools to narrow down the cause. Save the evidence before fixing it.", "Restore the setting, repeat the failing check, and save symptom, cause, fix, and before/after evidence in {lab_dir}/notes/capstone-report.md."]
hints = []


