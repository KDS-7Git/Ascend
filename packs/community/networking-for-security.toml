verify = { type = "file", path = "{lab_dir}/notes/dns.md", min_bytes = 150 }

[[node]]
level = "application"
id = "http-anatomy"
title = "Anatomy of an HTTP request and response"
size = "S"
needs = []
done_when = "captured one real HTTP request/response pair and annotated every header I recognise, saved at {lab_dir}/notes/http.md"
