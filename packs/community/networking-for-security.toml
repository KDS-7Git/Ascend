# Track 1 of 5: Networking for Security
# kind = "proficiency": foundational track. Everything else in the Cyber set leans on this one, so start here
# unless you can already draw a TCP handshake from memory and explain NAT to someone.
#
# DRAFT written by Claude. NOT reviewed. Run `ascend pack lint`, `ascend pack check-links`, read every
# done_when, then `ascend pack review networking-for-security` before trusting it.

[pack]
id = "networking-for-security"
title = "Networking for Security: how packets actually move"
kind = "proficiency"
version = 2
source = "ai-draft"
reviewed = false

[vars]
lab_dir = "~/cyber/networking"
pi_ip = "192.168.1.50"

[[level]]
id = "models"
title = "OSI/TCP-IP models and Ethernet"
lane = "main"

[[level]]
id = "addressing"
title = "IP addressing, subnetting, routing"
lane = "main"

[[level]]
id = "transport"
title = "TCP, UDP, and the handshake"
lane = "main"

[[level]]
id = "application"
title = "DNS, HTTP, and application-layer protocols"
lane = "main"

[[level]]
id = "capture"
title = "Packet capture with Wireshark/tshark"
lane = "main"

[[level]]
id = "services"
title = "DHCP, NAT, and firewalls"
lane = "main"

[[level]]
id = "wireless"
title = "Wireless and link-layer security basics"
lane = "main"

[[level]]
id = "capstone"
title = "Diagnose a real problem"
lane = "main"

# ---------------------------------------------------------------- 1: models
[[level]]
id = "packet-snacks"
title = "Packet snacks"
lane = "side"

[[node]]
level = "models"
id = "osi-vs-tcpip"
title = "Catch a request in the act"
size = "S"
needs = []
done_when = "Saved {lab_dir}/notes/osi-vs-tcpip.md with an OSI-to-TCP/IP comparison grounded in my own local request, including what I observed and what I could not see."
resource = "https://www.practicalnetworking.net/series/packet-traveling/osi-model/"
verify = { type = "file", path = "{lab_dir}/notes/osi-vs-tcpip.md", min_bytes = 150 }
minutes = 20
brief = "Your browser hides a whole conversation. Make one local request, then connect the packet layers to something you can actually see."
steps = ["Start a temporary local HTTP server with python3 -m http.server 8000 --bind 127.0.0.1 in an empty folder.", "In another terminal, run curl -v http://127.0.0.1:8000/ and find the connection, request, and response.", "Save a small OSI-to-TCP/IP comparison in {lab_dir}/notes/osi-vs-tcpip.md. Tie application, transport, and network layers to this request; mark layers you did not observe. Stop the server with Ctrl+C."]
hints = ["Start with the HTTP request line, the TCP port, and the IP address. You do not need to memorise seven definitions."]

[[node]]
level = "models"
id = "mac-and-arp"
title = "Find the device answering your laptop"
size = "S"
needs = []
done_when = "captured ARP traffic on my own LAN with Wireshark and saved the capture, with 3 lines explaining what ARP resolves"
resource = "https://www.wireshark.org/docs/wsug_html_chunked/"
minutes = 20
brief = "Turn your own LAN into a tiny detective case: which MAC address belongs to your gateway?"
steps = ["Find the default gateway with ip route (or your operating system’s network settings).", "Capture on your LAN interface with Wireshark while pinging your own gateway once. Look for ARP; if the entry is already cached, inspect ip neigh instead.", "Save the capture or neighbour-table output, and identify the requested IP and answering MAC. Explain the lookup in one sentence."]
hints = ["An ARP request asks who has an IP address. The reply supplies a link-layer address."]

[[node]]
level = "models"
id = "ethernet-framing"
title = "Read the envelope around a packet"
size = "S"
needs = ["mac-and-arp"]
done_when = "opened one captured frame in Wireshark, identified source/dest MAC, EtherType, and payload boundary, noted in {lab_dir}/notes/ethernet.md"
resource = "https://www.practicalnetworking.net/series/packet-traveling/ethernet/"
verify = { type = "file", path = "{lab_dir}/notes/ethernet.md", min_bytes = 100 }
minutes = 20
brief = "Find out why a packet can name one machine at the Ethernet layer and another at the IP layer."
steps = ["Open a frame from your own LAN capture and expand Ethernet and IP.", "Identify the source MAC, destination MAC, EtherType, and the start of the payload.", "Save those fields in {lab_dir}/notes/ethernet.md and explain whether this frame is addressed to the final destination or the next hop."]
hints = ["For off-LAN traffic, the destination MAC normally belongs to your gateway."]

[[node]]
level = "models"
id = "layers-milestone"
title = "Follow one request from app to wire"
size = "M"
needs = ["osi-vs-tcpip", "ethernet-framing"]
milestone = true
done_when = "Saved a capture and {lab_dir}/notes/layers-milestone.md mapping a real request to the protocol layers, with frame numbers and clear limits on what the capture shows."
resource = "https://www.practicalnetworking.net/series/packet-traveling/osi-model/"
verify = { type = "file", path = "{lab_dir}/notes/layers-milestone.md", min_bytes = 300 }

# ---------------------------------------------------------------- 2: addressing
minutes = 45
brief = "Bring the first level together: tell the story of one request using your own capture as evidence."
steps = ["Capture one HTTP request to a server on a lab device you control. Use loopback if a second device is unavailable.", "Follow the request and response. Identify the addresses, transport ports, and application data.", "Save {lab_dir}/notes/layers-milestone.md with the relevant frame numbers and an OSI/TCP-IP mapping. Explicitly label anything the capture cannot establish."]
hints = []

[[node]]
level = "addressing"
id = "ipv4-basics"
title = "IPv4 addressing and CIDR notation"
size = "S"
needs = []
done_when = "worked 5 subnetting problems by hand (not a calculator) and saved the worked answers at {lab_dir}/notes/subnetting.md"
resource = "https://www.practicalnetworking.net/stand-alone/subnetting-mastery/"
verify = { type = "file", path = "{lab_dir}/notes/subnetting.md", min_bytes = 200 }

