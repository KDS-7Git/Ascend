"brief" = "Predict a permission path before inspecting a real directory."
"steps" = ["Open directory-model.json. It contains two users, nested groups, an allow list and an explicit deny. This is a simplified graph; it is not a Windows access-check implementation.", "Draw LabReader → LabReaders → LabOperators. List the read/write permissions suggested by the group edges, then identify the explicit LabReader write deny.", "Write one prediction and the native evidence needed to test it: token membership and the object ACL. If on your own Windows host, inspect identity with whoami /user and whoami /groups; do not create accounts on a work domain.", "Save your own observations from the extracted lab folder. The included report.py asks for scope, setup, prediction, exact actions, actual results, a comparison, explanation, limitations and help used. It does not supply answers or overwrite an existing report.\n```sh\npython3 report.py \"{lab_dir}/foundations-experiment.json\"\n```\nOn Windows use py -3 instead of python3. Review the saved JSON in a text editor. Ascend checks files on the SERVER computer: for a hosted/container deployment, place your report at the server’s configured lab path. A file saved only on your laptop is not visible to that checker. Use Challenge options → Check evidence, then Log progress → Mark as done only after reviewing the finish line. File presence does not grade reasoning or earn automatic skill XP."]
"resource" = "https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/deploy/install-active-directory-domain-services--level-100-"
"verify" = { "type" = "file", "path" = "{lab_dir}/foundations-experiment.json", "min_bytes" = 200 }
"resource_label" = "Free reference (optional)"
"resource_note" = "The challenge and its named lab files define the task. This reference explains the topic; buying or completing a course is not required."
"setup" = "Use Python 3 and a text editor on your own computer. Download the lab files below, extract into a NEW folder, and open a terminal in the folder containing report.py. No course, account or cloud spend is required. These are synthetic training inputs. The foundations task is a static directory model. Later operational tasks require isolated Windows Server and Windows client VMs, an administrator account in YOUR training domain, DNS between those VMs and the AD PowerShell module. Windows evaluation images have time-limited licensing and substantial RAM/disk requirements. Use Microsoft Evaluation Center; no paid training course is required. A model-only result cannot complete an operational task."
"materials" = [{ "label" = "Download this track’s lab files (ZIP)", "url" = "/training/active-directory-security.zip" }]

