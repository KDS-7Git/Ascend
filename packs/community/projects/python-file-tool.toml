[pack]
"id" = "python-file-tool"
"title" = "Build a Python file organizer"
"kind" = "project"
"version" = 2
"source" = "ai-draft"
"reviewed" = false

[vars]
"work_dir" = "~/learning"

[[level]]
"id" = "files"
"title" = "Read and describe files"

[[level]]
"id" = "organize"
"title" = "Plan and safely organize"

[[level]]
"id" = "deliver"
"title" = "Test and document the tool"

[[level]]
"id" = "anytime"
"title" = "Small observations"
"lane" = "side"

[[node]]
"id" = "inspect"
"level" = "files"
"title" = "List a temporary folder"
"size" = "S"
"needs" = []
"done_when" = "A script lists filenames in a disposable folder and I can explain each line"
"resource" = "https://docs.python.org/3/tutorial/"
"minutes" = 20

[[node]]
"id" = "summarize"
"checkpoints" = [{ "id" = "counts", "title" = "Count one extension", "minutes" = 10, "done_when" = "In a disposable folder, count files with one extension and compare the output with a manual count.", "next_step" = "Extend the count to multiple extensions, sizes and an empty folder." }, { "id" = "empty-input", "title" = "Check the empty-folder case", "minutes" = 10, "done_when" = "Run the summary on an empty temporary folder and explain why the result should contain no file groups.", "next_step" = "Finish the multi-extension size totals and review the complete task." }]
"level" = "files"
"title" = "Summarize files by extension"
"size" = "M"
"needs" = ["inspect"]
"done_when" = "My script reports file counts and sizes by extension and handles an empty folder"
"resource" = "https://docs.python.org/3/tutorial/"
"milestone" = true

[[node]]
"id" = "dry-run"
"level" = "organize"
"title" = "Preview an organization plan"
"size" = "S"
"needs" = []
"done_when" = "A dry-run prints source and destination paths without modifying any files"
"resource" = "https://docs.python.org/3/tutorial/"
"minutes" = 30

[[node]]
"id" = "organizer"
"checkpoints" = [{ "id" = "collision-policy", "title" = "Predict a collision safely", "minutes" = 10, "done_when" = "Create a disposable source/destination fixture with the same filename and write the expected skip decision before changing files.", "next_step" = "Implement the skip policy and test it in the disposable fixture." }, { "id" = "single-move", "title" = "Test one safe move", "minutes" = 15, "done_when" = "Move one non-conflicting disposable file, then confirm its content and that the conflicting destination was preserved.", "next_step" = "Handle the rest of the fixture and review the parent finish line." }]
"level" = "organize"
"title" = "Build the organizer"
"size" = "M"
"needs" = ["dry-run"]
"done_when" = "My tool organizes a disposable fixture folder and refuses to overwrite an existing file"
"resource" = "https://docs.python.org/3/tutorial/"
"milestone" = true

[[node]]
"id" = "test-cases"
"level" = "deliver"
"title" = "Exercise failure cases"
"size" = "S"
"needs" = []
"done_when" = "Automated tests cover empty input, duplicate names and invalid folders"
"resource" = "https://docs.python.org/3/tutorial/"
"minutes" = 30

[[node]]
"id" = "release"
"checkpoints" = [{ "id" = "dry-run-example", "title" = "Document one dry-run example", "minutes" = 15, "done_when" = "Write a README example with a disposable input listing, the command and its actual dry-run output.", "next_step" = "Check installation and execution from a clean fixture before completing the project." }]
"level" = "deliver"
"title" = "Demonstrate the finished tool"
"size" = "M"
"needs" = ["test-cases"]
"done_when" = "A README shows installation, dry-run and execution, and all tests pass from a clean fixture"
"resource" = "https://docs.python.org/3/tutorial/"
"milestone" = true

[[node]]
"id" = "observation"
"level" = "anytime"
"title" = "Explain one small observation"
"size" = "S"
"minutes" = 10
"needs" = []
"done_when" = "One original observation saved in my notes with a concrete example I can reproduce"
"resource" = "https://docs.python.org/3/tutorial/"
