[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-tracker"
version = "0.1.0"
description = "Small, proof-backed steps toward skills that matter to you"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "KDS-7Git"}]
dependencies = []

[project.scripts]
ascend = "ascend.cli:main"
ascend-server = "ascend.server.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
dev = ["pytest>=8", "httpx>=0.27,<1", "playwright>=1.49,<2"]

[tool.setuptools.packages.find]
include = ["ascend*"]

[tool.setuptools.package-data]
ascend = ["storage/migrations/*.sql", "community/*.toml", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
