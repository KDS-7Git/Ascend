apiVersion: v1
kind: Namespace
metadata:
  name: ascend-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: ascend-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: ascend-lab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reader-pods
  namespace: ascend-lab
subjects:
  - kind: ServiceAccount
    name: reader
    namespace: ascend-lab
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
