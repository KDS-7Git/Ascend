[[node]]
level = "capstone"
id = "replay-an-old-attack"
title = "Replay one attack from an earlier track, fully monitored"
size = "L"
needs = ["instrument-the-lab"]
done_when = "re-ran one full attack chain from network-penetration-testing or web-application-security against the now-monitored lab, documented what was detected and what wasn't at {lab_dir}/notes/replay.md"
resource = "https://attack.mitre.org/"
verify = { type = "file", path = "{lab_dir}/notes/replay.md", min_bytes = 250 }

[[node]]
level = "capstone"
id = "close-the-gaps"
title = "Write detections for whatever wasn't caught"
size = "M"
needs = ["replay-an-old-attack"]
done_when = "For the replayed lab chain, improved and retested one detectable gap, compared benign traffic after tuning, and documented residual gaps in {lab_dir}/notes/close-gaps.md. Distinguished missing telemetry from a rule problem; did not require every stage to become detectable."
resource = "https://attack.mitre.org/"
verify = { type = "file", path = "{lab_dir}/notes/close-gaps.md", min_bytes = 200 }

[[node]]
level = "capstone"
id = "capstone-milestone"
title = "Full defensive posture report (milestone)"
size = "L"
needs = ["instrument-the-lab", "replay-an-old-attack", "close-the-gaps"]
milestone = true
done_when = "Demonstrated: Measure monitoring coverage and close a bounded detection gap without claiming complete visibility. Completed the experiment, independently tested the changed case, compared the control, and explained the mechanism and limits. Saved predictions, observations, reproduction steps, and help used at {lab_dir}/notes/capstone-report.md."
resource = "https://attack.mitre.org/"
verify = { type = "file", path = "{lab_dir}/notes/capstone-report.md", min_bytes = 250 }
brief = "Measure monitoring coverage and close a bounded detection gap without claiming complete visibility."
steps = ["Before testing, record your prediction and the observation that would change your mind.", "Observe or replay a small documented lab chain, compare expected and observed telemetry, and deliver a reproducible investigation with coverage and gaps.", "Transfer check: Replay a varied form of one stage and evaluate whether the improved rule still detects it.", "Control check: Retest benign traffic after tuning and record residual gaps that require telemetry changes rather than another rule.", "Explain the mechanism and one limitation in your own words. Record references and hints used. If a walkthrough was needed, save partial progress and retry a fresh changed case independently before claiming the assessment.", "Save reproducible evidence and your prediction-versus-observation comparison at {lab_dir}/notes/capstone-report.md."]
hints = ["Use the linked reference or an earlier worked example to isolate the missing concept. Then close that example and try a different input or case.", "If the result disagrees with your prediction, check the lab setup and compare a known-good control before changing several variables."]

