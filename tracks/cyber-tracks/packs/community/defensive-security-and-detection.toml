[[node]]
"level" = "mitre"
"id" = "discovery-2"
"title" = "Separate two sources in a noisy log"
"size" = "S"
"minutes" = 15
"needs" = ["first-discovery"]
"brief" = "Give your investigator self a clean signal among harmless noise."
"done_when" = "Generate two harmless logger messages using different tags, then use journalctl to show only one tag in the last five minutes. Save the filter and matching output, with a sentence on why the other source disappeared."
"resource" = "https://www.freedesktop.org/software/systemd/man/latest/journalctl.html"
"verify" = { "type" = "manual" }

[[node]]
"level" = "mitre"
"id" = "discovery-3"
"title" = "Test a tiny detection against a harmless lookalike"
"size" = "S"
"minutes" = 20
"needs" = ["discovery-2"]
"brief" = "A useful detection needs a match and a non-match."
"done_when" = "Create a local text fixture with a synthetic failed-login line and a successful-login line. Write a grep or Python filter that returns only the failed event. Save the fixture, command, and result; label the data as synthetic."
"resource" = "https://www.gnu.org/software/grep/manual/grep.html"
"verify" = { "type" = "manual" }
