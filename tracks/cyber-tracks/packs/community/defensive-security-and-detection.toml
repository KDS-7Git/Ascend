# ---------------------------------------------------------------- 3: network-monitoring
brief = "Build a detection query and evaluate it against labeled positive and negative data."
steps = ["Before testing, record your prediction and the observation that would change your mind.", "Use a small labeled training dataset containing suspicious and ordinary requests. Design a query without looking at the answer labels, then compare its results with ground truth.", "Transfer check: Change the source address or request ordering in a synthetic copy; test whether the same behavior is still found.", "Control check: Record true positives, false positives, and false negatives with counts and explain at least one ambiguity.", "Explain the mechanism and one limitation in your own words. Record references and hints used. If a walkthrough was needed, save partial progress and retry a fresh changed case independently before claiming the assessment.", "Save reproducible evidence and your prediction-versus-observation comparison at {lab_dir}/notes/log-milestone.md."]
hints = ["Use the linked reference or an earlier worked example to isolate the missing concept. Then close that example and try a different input or case.", "If the result disagrees with your prediction, check the lab setup and compare a known-good control before changing several variables."]

