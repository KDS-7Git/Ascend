brief = "Explain the differences between connection metadata and signature alerts."
steps = ["Before testing, record your prediction and the observation that would change your mind.", "Replay a documented benign-plus-test PCAP through Zeek and Suricata; confirm the relevant parser and rule are enabled before comparing outputs.", "Transfer check: Change a protocol field or replay a different small capture and predict the connection record and alert outcome.", "Control check: Use a benign control capture; a generic nmap scan is not guaranteed to trigger an arbitrary default ruleset.", "Explain the mechanism and one limitation in your own words. Record references and hints used. If a walkthrough was needed, save partial progress and retry a fresh changed case independently before claiming the assessment.", "Save reproducible evidence and your prediction-versus-observation comparison at {lab_dir}/notes/network-monitoring-milestone.md."]
hints = ["Use the linked reference or an earlier worked example to isolate the missing concept. Then close that example and try a different input or case.", "If the result disagrees with your prediction, check the lab setup and compare a known-good control before changing several variables."]

