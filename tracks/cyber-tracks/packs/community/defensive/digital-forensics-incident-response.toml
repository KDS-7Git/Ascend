[[node]]
"id" = "foundations-experiment"
"level" = "foundations"
"title" = "Hash an evidence copy without changing the original"
"size" = "M"
"minutes" = 30
"needs" = ["foundations-reasoning"]
"done_when" = "Save the named inputs, your exact actions, observed results and the explanation requested in the final step in {lab_dir}/foundations-experiment.json. Compare against the checks below before marking done; leave any required live-system test incomplete until actually performed."
"brief" = "Preserve an authored file and distinguish content integrity from provenance."
"steps" = ["Read original/manifest.json. This is a synthetic note, not an acquired disk image; extraction timestamps are not original event times.", "Copy and hash the note using Python.\n```sh\npython3 -c \"from pathlib import Path; import hashlib, shutil; shutil.copytree('original', 'analysis-copy'); [print(p, hashlib.sha256(p.read_bytes()).hexdigest()) for p in (Path('original/note.txt'),Path('analysis-copy/note.txt'))]\"\n```", "Compare hashes and explain what equality shows about bytes and what it cannot show about who created the note. Keep original unchanged.", "Save your own observations from the extracted lab folder. The included report.py asks for scope, setup, prediction, exact actions, actual results, a comparison, explanation, limitations and help used. It does not supply answers or overwrite an existing report.\n```sh\npython3 report.py \"{lab_dir}/foundations-experiment.json\"\n```\nOn Windows use py -3 instead of python3. Review the saved JSON in a text editor. Ascend checks files on the SERVER computer: for a hosted/container deployment, place your report at the server’s configured lab path. A file saved only on your laptop is not visible to that checker. Use Challenge options → Check evidence, then Log progress → Mark as done only after reviewing the finish line. File presence does not grade reasoning or earn automatic skill XP."]
"resource" = "https://docs.python.org/3/library/hashlib.html"
"verify" = { "type" = "file", "path" = "{lab_dir}/foundations-experiment.json", "min_bytes" = 200 }
"resource_label" = "Free reference (optional)"
"resource_note" = "The challenge and its named lab files define the task. This reference explains the topic; buying or completing a course is not required."
"preview" = "Preserve an authored file and distinguish content integrity from provenance."
"requirements" = "Python 3 and a text editor. Any larger external analysis environment is identified separately below."
"setup" = "Use Python 3 and a text editor on your own computer. Download the lab files below, extract into a NEW folder, and open a terminal in the folder containing report.py. No course, account or cloud spend is required. These are synthetic training inputs. The memory task additionally requires a compatible public memory image and analysis tool; its specific external download and host requirements are listed in that task. No paid course is required."
"materials" = [{ "label" = "Download this track’s lab files (ZIP)", "url" = "/training/digital-forensics-incident-response.zip" }]

