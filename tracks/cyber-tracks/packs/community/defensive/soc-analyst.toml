"steps" = ["Open events.csv and context.json. Each row has an id, timestamp, user, host, source address, kind and result. The investigation window is 09:00–09:10 UTC on 1 October 2026.", "Print timestamps in UTC using the standard library.\n```sh\npython3 -c \"import csv; from datetime import datetime, timezone; rows=csv.DictReader(open('events.csv')); [print(r['id'], datetime.fromisoformat(r['time']).astimezone(timezone.utc).isoformat(), r['user']) for r in rows]\"\n```", "Write down the exact row IDs for alice inside the window. Explain why alice-test and an earlier alice event are different. Use result to distinguish failed actions from successful ones; the rows alone do not prove compromise.", "Save your own observations from the extracted lab folder. The included report.py asks for scope, setup, prediction, exact actions, actual results, a comparison, explanation, limitations and help used. It does not supply answers or overwrite an existing report.\n```sh\npython3 report.py \"{lab_dir}/foundations-experiment.json\"\n```\nOn Windows use py -3 instead of python3. Review the saved JSON in a text editor. Ascend checks files on the SERVER computer: for a hosted/container deployment, place your report at the server’s configured lab path. A file saved only on your laptop is not visible to that checker. Use Challenge options → Check evidence, then Log progress → Mark as done only after reviewing the finish line. File presence does not grade reasoning or earn automatic skill XP."]
"resource" = "https://docs.python.org/3/library/datetime.html"
"verify" = { "type" = "file", "path" = "{lab_dir}/foundations-experiment.json", "min_bytes" = 200 }
"resource_label" = "Free reference (optional)"
"resource_note" = "The challenge and its named lab files define the task. This reference explains the topic; buying or completing a course is not required."
"setup" = "Use Python 3 and a text editor on your own computer. Download the lab files below, extract into a NEW folder, and open a terminal in the folder containing report.py. No course, account or cloud spend is required. These are synthetic training inputs."
