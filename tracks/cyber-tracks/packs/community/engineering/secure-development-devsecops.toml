"preview" = "Make one real HTTP request and find its handler in source."
"requirements" = "Python 3, curl, Git and a text editor. Use a new local project; no paid course is required."
"setup" = "Use Python 3 and a text editor on your own computer. Download the lab files below, extract into a NEW folder, and open a terminal in the folder containing report.py. No course, account or cloud spend is required. These are synthetic training inputs. The service.py fixture uses curl and a second terminal. Start it with python3 service.py; it listens only on 127.0.0.1:8765. Stop it with Ctrl+C. Restart to reset its in-memory notes. X-Lab-User is a simulated identity, not real authentication. Git is needed for versioned changes; use a new local repository inside the extracted folder."
