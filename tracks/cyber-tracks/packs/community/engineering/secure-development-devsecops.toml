"steps" = ["Open service.py and find do_GET. In Terminal A start the local fixture.\n```sh\npython3 service.py\n```", "In Terminal B request health and the owner’s note.\n```sh\ncurl --noproxy \"*\" -i http://127.0.0.1:8765/health\ncurl --noproxy \"*\" -i -H \"X-Lab-User: alice\" http://127.0.0.1:8765/notes/1\n```", "Record status, JSON body and the source branch returning each. Stop the service. Create a new local Git repo if desired; do not modify Ascend’s source repository for this exercise.", "Save your own observations from the extracted lab folder. The included report.py asks for scope, setup, prediction, exact actions, actual results, a comparison, explanation, limitations and help used. It does not supply answers or overwrite an existing report.\n```sh\npython3 report.py \"{lab_dir}/foundations-experiment.json\"\n```\nOn Windows use py -3 instead of python3. Review the saved JSON in a text editor. Ascend checks files on the SERVER computer: for a hosted/container deployment, place your report at the server’s configured lab path. A file saved only on your laptop is not visible to that checker. Use Challenge options → Check evidence, then Log progress → Mark as done only after reviewing the finish line. File presence does not grade reasoning or earn automatic skill XP."]
