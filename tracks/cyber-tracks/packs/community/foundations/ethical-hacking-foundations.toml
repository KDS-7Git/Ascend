"steps" = ["Use Linux, macOS or WSL for this filesystem exercise. Work only on the extracted permissions.txt file. Inspect your identity and its mode.\n```sh\nid\nls -l permissions.txt\nchmod 644 permissions.txt\nls -l permissions.txt\n```", "Mode 644 gives the owner read/write and group/others read. Change only this training file to 600, then inspect the mode again and confirm you can still read it.\n```sh\nchmod 600 permissions.txt\nls -l permissions.txt\ncat permissions.txt\n```", "Record the removed group/other read bits and the retained owner read/write bits. A mode listing predicts permissions; it does not prove access as another OS user. If you have only one account, explicitly leave the second-identity runtime check untested.", "Save your own observations from the extracted lab folder. The included report.py asks for scope, setup, prediction, exact actions, actual results, a comparison, explanation, limitations and help used. It does not supply answers or overwrite an existing report.\n```sh\npython3 report.py \"{lab_dir}/permissions-experiment.json\"\n```\nOn Windows use py -3 instead of python3. Review the saved JSON in a text editor. Ascend checks files on the SERVER computer: for a hosted/container deployment, place your report at the server’s configured lab path. A file saved only on your laptop is not visible to that checker. Use Challenge options → Check evidence, then Log progress → Mark as done only after reviewing the finish line. File presence does not grade reasoning or earn automatic skill XP."]
