[[node]]
"id" = "foundations-experiment"
"level" = "foundations"
"title" = "Serve a webpage and inspect two HTTP responses"
"size" = "M"
"minutes" = 30
"needs" = ["foundations-reasoning"]
"done_when" = "You observed the page response and the missing-page response, explained the address and port in your own words, saved your observations in {lab_dir}/foundations-experiment.json, and stopped your practice server."
"brief" = "Build a tiny web server on your own computer and see what an HTTP request returns. Use two Ubuntu/Linux terminal windows, Python 3 and curl. No paid course, account, vulnerable app or cloud lab is needed."
"steps" = ["Prepare two terminal windows on the computer where you will run this lab. We will call them Terminal A and Terminal B. Your workspace is open. Run the commands below in your terminals; Ascend does not execute them automatically.\n\nIn Terminal A, check that both tools are available:\n```sh\npython3 --version\ncurl --version\n```\nA Python 3 version and a curl version mean you can continue. If a tool is missing, end this session and use the first hint to repair your setup before continuing practice.", "In Terminal A, make a new temporary folder containing one page, then serve that folder on your own computer:\n```sh\nlab_site=$(mktemp -d /tmp/ascend-http.XXXXXX)\nprintf '<h1>My first lab</h1>\\n' > \"$lab_site/index.html\"\npython3 -m http.server 8765 --bind 127.0.0.1 --directory \"$lab_site\"\n```\nLeave this terminal running. A message beginning “Serving HTTP on 127.0.0.1” means the server started. 127.0.0.1 means this computer; 8765 is the port identifying this server. No public website is involved.", "In Terminal B, request your page:\n```sh\ncurl --noproxy \"*\" -i http://127.0.0.1:8765/\n```\nThis sends a GET request for /. The -i option shows response headers as well as the body. Find the first HTTP line: expect status 200. Below the headers, find the page text “My first lab”. Also look at Terminal A: it should log this request. Record what you actually see.", "In Terminal B, ask the same server for a page you did not create:\n```sh\ncurl --noproxy \"*\" -i http://127.0.0.1:8765/missing-page\n```\nExpect status 404. The server is still running and answering; this path simply has no page. Compare the two status codes and response bodies. A 404 here is an expected observation, not a failed setup.", "Save your observations from Terminal B. Copy this whole block. It asks for your actual results and your own short explanations, then creates the JSON report at the finish-line path. It does not supply the answers or overwrite an existing report.\n```sh\npython3 -c '\nimport json\nfrom pathlib import Path\nreport = {\n    \"scope\": \"Only my own local practice server\",\n    \"target\": input(\"URL you requested: \").strip(),\n    \"home_status\": input(\"Status code for /: \").strip(),\n    \"home_body\": input(\"One line from the / response body: \").strip(),\n    \"missing_status\": input(\"Status code for /missing-page: \").strip(),\n    \"loopback_meaning\": input(\"What does 127.0.0.1 mean? \").strip(),\n    \"port_meaning\": input(\"What is the port number for? \").strip(),\n    \"comparison\": input(\"Why did the two requests give different responses? \").strip(),\n    \"limitations\": input(\"What did this lab not test? \").strip()\n}\nif not all(report.values()):\n    raise SystemExit(\"An answer was empty. No report saved; run again when ready.\")\npath = Path(\"{lab_dir}/foundations-experiment.json\").expanduser()\npath.parent.mkdir(parents=True, exist_ok=True)\nif path.exists():\n    raise SystemExit(\"A report already exists. Open it in your text editor to update it.\")\nwith path.open(\"x\") as output:\n    json.dump(report, output, indent=2)\nprint(\"Saved:\", path)\n'\n```\nIf the report already exists, open it in your text editor to review or update your notes instead of replacing it. This exercise checks the file on the computer running Ascend. For a hosted/container server, the report must be placed at that server’s configured lab path; a file saved only on your laptop will not be visible to the checker.", "Stop your practice server: return to Terminal A and press Ctrl+C. Keep your saved report.\n\nBack in Ascend, open Challenge options → Check evidence to check that the report file is present. Then use Log progress, briefly describe what you learned, and select Mark as done when your report contains the observations and explanations above. This file check does not grade your reasoning and this task does not earn automatic XP."]
"resource" = "https://docs.python.org/3/library/http.server.html#command-line-interface"
"verify" = { "type" = "file", "path" = "{lab_dir}/foundations-experiment.json", "min_bytes" = 200 }
"resource_label" = "Free HTTP server reference (optional)"
"resource_note" = "The steps here are the lab. This link is optional Python documentation, not a course to buy or enrol in."
"hints" = ["Ubuntu/Linux setup: if Python 3 or curl is missing, install the free packages with sudo apt update followed by sudo apt install python3 curl. If you need to repair setup, end the session before installing packages. No paid course is required.", "“Address already in use” means port 8765 is occupied. Use 8766 in the server command and in BOTH curl URLs; do not stop an unrelated service.", "“Connection refused” means curl could not reach a running server at that address/port. Check Terminal A and the URL. This differs from 404, which is a response from a running server.", "A 200 response demonstrates that this page was served. It does not demonstrate a vulnerability, an exploit, authentication or authorization. This is the networking setup skill you will use in later security labs."]
"setup" = "Use Python 3, curl and two terminal windows on your own Ubuntu/Linux computer. This walkthrough creates its own temporary page; no course, account or downloaded app is needed. Check the tools before timing. The optional ZIP contains inputs for later tasks; do not start its service.py for this walkthrough."
"checkpoints" = [{ "id" = "tools-and-address", "title" = "Check tools and explain the address", "minutes" = 10, "done_when" = "Check Python 3 and curl versions in your terminals. In your own words, state what 127.0.0.1 and port 8765 identify.", "next_step" = "Open the full task to create the temporary page and compare two responses." }, { "id" = "response-notes", "title" = "Capture the two response observations", "minutes" = 10, "done_when" = "After following the full task setup, record both HTTP status lines and body observations in your notes. Stop the local server before leaving.", "next_step" = "Resume the full task to save the report at its required path and review the explanations." }]
"preview" = "Observe how a local web server responds to different requests, then explain the results."
"requirements" = "Python 3, curl and two terminal windows on Linux or WSL. No course or account is required."
"materials" = [{ "label" = "Download this track’s lab files (ZIP)", "url" = "/training/ethical-hacking-foundations.zip" }]

[[node]]
"id" = "foundations-milestone"
"level" = "foundations"
"title" = "Repeat your HTTP lab on a different port"
"size" = "M"
"minutes" = 30
"needs" = ["foundations-reasoning", "foundations-experiment", "lab-readiness"]
"milestone" = true
"done_when" = "Save {lab_dir}/foundations-assessment.json with your prediction, the request on port 8766, the observed response, the stopped-server result and an explanation of how that differs from 404. Ask a reviewer or use an honest self-review; the file check does not grade your explanation."
"brief" = "Use the same small page to check that you understand ports and the difference between a server error response and a connection failure. You can reuse your temporary page folder or recreate it from the previous lab."
"steps" = ["Repeat the local page request on port 8766. Predict which part of the URL must change, then record the actual response. In Terminal A, reuse the folder and start: python3 -m http.server 8766 --bind 127.0.0.1 --directory \"$lab_site\". If this is a new terminal, recreate the page folder using the previous challenge first.", "In Terminal B, request the new address and record the actual response:\n```sh\ncurl --noproxy \"*\" -i http://127.0.0.1:8766/\n```\nExplain which URL component changed and why.", "Stop your local server and repeat the same request. Explain why a connection failure differs from an HTTP 404 returned by a running server.\n\nPress Ctrl+C in Terminal A. Then run in Terminal B:\n```sh\ncurl --noproxy \"*\" --max-time 3 -i http://127.0.0.1:8766/\n```\nA connection error after stopping the server is expected. There should be no HTTP status line from that stopped server.", "Save your prediction, observations and explanation from Terminal B. Answer these prompts in your own words; use “none” if you used no help. Existing reports are kept.\n```sh\npython3 -c '\nimport json\nfrom pathlib import Path\nreport = {\n    \"prediction\": input(\"Before testing, what did you expect the port change to do? \").strip(),\n    \"changed_url\": input(\"What URL did you request on port 8766? \").strip(),\n    \"running_response\": input(\"What status and body did the running server return? \").strip(),\n    \"stopped_response\": input(\"What did curl report after you stopped the server? \").strip(),\n    \"why_not_404\": input(\"Why is that different from HTTP 404? \").strip(),\n    \"help_used\": input(\"What notes or help did you use? \").strip(),\n    \"limitations\": input(\"What did this test not establish? \").strip()\n}\nif not all(report.values()):\n    raise SystemExit(\"An answer was empty. No report saved; run again when ready.\")\npath = Path(\"{lab_dir}/foundations-assessment.json\").expanduser()\npath.parent.mkdir(parents=True, exist_ok=True)\nif path.exists():\n    raise SystemExit(\"A report already exists. Open it in your text editor to update it.\")\nwith path.open(\"x\") as output:\n    json.dump(report, output, indent=2)\nprint(\"Saved:\", path)\n'\n```\nLeave the server stopped. Use Challenge options → Check evidence, then Log progress → Mark as done after reviewing your report. A reviewer or your honest self-review must assess the explanation; the file check alone cannot do that."]
"hints" = ["Predict the outcome before testing. If a walkthrough reveals the answer, practice and try a fresh variation before claiming independent transfer."]
"resource" = "https://docs.python.org/3/library/http.server.html#command-line-interface"
"verify" = { "type" = "file", "path" = "{lab_dir}/foundations-assessment.json", "min_bytes" = 300 }
"resource_label" = "Free HTTP server reference (optional)"
"resource_note" = "The steps here are the lab. This link is optional Python documentation, not a course to buy or enrol in."
"setup" = "Use Python 3, curl and two terminal windows on your own Ubuntu/Linux computer. This walkthrough creates its own temporary page; no course, account or downloaded app is needed. Check the tools before timing. The optional ZIP contains inputs for later tasks; do not start its service.py for this walkthrough."
"preview" = "Observe how a local web server responds to different requests, then explain the results."
"requirements" = "Python 3, curl and two terminal windows on Linux or WSL. No course or account is required."
"materials" = [{ "label" = "Download this track’s lab files (ZIP)", "url" = "/training/ethical-hacking-foundations.zip" }]

