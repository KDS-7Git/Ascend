"title" = "Return later: explain and transfer"
"lane" = "side"

[[node]]
"id" = "lab-readiness"
"level" = "models"
"title" = "Use a tiny local service as your network lab"
"size" = "S"
"minutes" = 20
"needs" = []
"brief" = "Establish the prerequisites with a small demonstration. Use a foundations lesson if you cannot yet explain the result."
"done_when" = "Start and stop a loopback-only HTTP server; make a client request, identify the address and port, and locate where you will store captures. If a command is unfamiliar, use the foundations resource before advancing."
"resource" = "https://docs.python.org/3/library/http.server.html"
"verify" = { "type" = "manual" }
"resource_label" = "Free setup reference (optional)"
"resource_note" = "Use the task instructions and your own training environment. This link is documentation, not a course purchase."

[[node]]
"level" = "models"
"id" = "osi-vs-tcpip"
"title" = "Catch a request in the act"
"size" = "S"
"needs" = ["lab-readiness"]
"done_when" = "Saved {lab_dir}/notes/osi-vs-tcpip.md with an OSI-to-TCP/IP comparison grounded in my own local request, including what I observed and what I could not see."
"resource" = "https://www.practicalnetworking.net/series/packet-traveling/osi-model/"
"verify" = { "type" = "file", "path" = "{lab_dir}/notes/osi-vs-tcpip.md", "min_bytes" = 150 }
"minutes" = 20
"brief" = "Your browser hides a whole conversation. Make one local request, then connect the packet layers to something you can actually see."
"steps" = ["Start a temporary local HTTP server with python3 -m http.server 8000 --bind 127.0.0.1 in an empty folder.", "In another terminal, run curl -v http://127.0.0.1:8000/ and find the connection, request, and response.", "Save a small OSI-to-TCP/IP comparison in {lab_dir}/notes/osi-vs-tcpip.md. Tie application, transport, and network layers to this request; mark layers you did not observe. Stop the server with Ctrl+C."]
"hints" = ["Start with the HTTP request line, the TCP port, and the IP address. You do not need to memorise seven definitions."]

[[node]]
"level" = "models"
"id" = "mac-and-arp"
"title" = "Find the device answering your laptop"
"size" = "S"
"needs" = ["lab-readiness"]
"done_when" = "Saved an owned LAN ARP capture or neighbour-table output, identified IP-to-MAC resolution, and explained why a cached entry may prevent a fresh ARP request."
"resource" = "https://www.wireshark.org/docs/wsug_html_chunked/"
"minutes" = 20
"brief" = "Turn your own LAN into a tiny detective case: which MAC address belongs to your gateway?"
"steps" = ["Find the default gateway with ip route (or your operating system’s network settings).", "Capture on your LAN interface with Wireshark while pinging your own gateway once. Look for ARP; if the entry is already cached, inspect ip neigh instead.", "Save the capture or neighbour-table output, and identify the requested IP and answering MAC. Explain the lookup in one sentence."]
"hints" = ["An ARP request asks who has an IP address. The reply supplies a link-layer address."]

[[node]]
"level" = "models"
"id" = "ethernet-framing"
"title" = "Read the envelope around a packet"
"size" = "S"
"needs" = ["mac-and-arp"]
"done_when" = "opened one captured frame in Wireshark, identified source/dest MAC, EtherType, and payload boundary, noted in {lab_dir}/notes/ethernet.md"
"resource" = "https://www.practicalnetworking.net/series/packet-traveling/ethernet/"
"verify" = { "type" = "file", "path" = "{lab_dir}/notes/ethernet.md", "min_bytes" = 100 }
"minutes" = 20
"brief" = "Find out why a packet can name one machine at the Ethernet layer and another at the IP layer."
"steps" = ["Open a frame from your own LAN capture and expand Ethernet and IP.", "Identify the source MAC, destination MAC, EtherType, and the start of the payload.", "Save those fields in {lab_dir}/notes/ethernet.md and explain whether this frame is addressed to the final destination or the next hop."]
"hints" = ["For off-LAN traffic, the destination MAC normally belongs to your gateway."]

[[node]]
"level" = "models"
"id" = "layers-milestone"
"title" = "Follow one request from app to wire"
"size" = "M"
"needs" = ["lab-readiness", "osi-vs-tcpip", "mac-and-arp", "ethernet-framing"]
"milestone" = true
"done_when" = "Demonstrated: Distinguish link, network, transport, and application evidence. Completed the experiment, independently tested the changed case, compared the control, and explained the mechanism and limits. Saved predictions, observations, reproduction steps, and help used at {lab_dir}/notes/layers-milestone.md."
"resource" = "https://www.practicalnetworking.net/series/packet-traveling/osi-model/"
"verify" = { "type" = "file", "path" = "{lab_dir}/notes/layers-milestone.md", "min_bytes" = 250 }
"minutes" = 45
"brief" = "Distinguish link, network, transport, and application evidence."
"steps" = ["Before testing, record your prediction and the observation that would change your mind.", "Capture an owned HTTP exchange; identify addresses, ports, request and response by frame number. State what the capture does not reveal.", "Transfer check: Repeat with a different destination or port and predict which fields change.", "Control check: Compare a loopback capture with a LAN frame; do not invent Ethernet or physical-layer evidence on loopback.", "Explain the mechanism and one limitation in your own words. Record references and hints used. If a walkthrough was needed, save partial progress and retry a fresh changed case independently before claiming the assessment.", "Save reproducible evidence and your prediction-versus-observation comparison at {lab_dir}/notes/layers-milestone.md."]
"hints" = ["Use the linked reference or an earlier worked example to isolate the missing concept. Then close that example and try a different input or case.", "If the result disagrees with your prediction, check the lab setup and compare a known-good control before changing several variables."]

