# Public starter project; unreviewed draft. Keep all credentials out of evidence.
[pack]
"id" = "home-hack-lab"
"title" = "Home hack lab: build, investigate and harden your own lab"
"kind" = "project"
"version" = 4
"source" = "ai-draft"
"reviewed" = false

[vars]
"pi_user" = "YOUR_USER"
"pi_ip" = "lab-host.local"
"hack_dir" = "~/ascend-lab"

[[level]]
"id" = "setup"
"title" = "Build the lab"
"lane" = "main"

[[level]]
"id" = "attack"
"title" = "Recon and attack the basics"
"lane" = "main"

[[level]]
"id" = "attack2"
"title" = "Go deeper: more of the OWASP Top 10"
"lane" = "main"

[[level]]
"id" = "defend"
"title" = "Harden and report"
"lane" = "main"

[[level]]
"id" = "warmup"
"title" = "Daily warm-up (Bandit)"
"lane" = "side"

[[node]]
"level" = "setup"
"id" = "pi-reachable"
"title" = "Prepare your lab host and demonstrate SSH access"
"size" = "M"
"needs" = []
"done_when" = "Update your own lab host, enable SSH, verify its host key and establish an authenticated session. The check confirms key-based access; prepare the key first if using the server verifier."
"resource" = "https://www.raspberrypi.com/documentation/computers/remote-access.html"
"verify" = { "type" = "command", "cmd" = "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=5 {pi_user}@{pi_ip} true" }
"minutes" = 60

[[node]]
"level" = "setup"
"id" = "ssh-key-login"
"title" = "Log in to the Pi with an SSH key"
"size" = "S"
"needs" = ["pi-reachable"]
"done_when" = "ssh to the Pi works without typing a password"
"resource" = "https://www.raspberrypi.com/documentation/computers/remote-access.html"
"verify" = { "type" = "command", "cmd" = "ssh -o BatchMode=yes -o ConnectTimeout=5 {pi_user}@{pi_ip} true" }
"minutes" = 15

[[node]]
"level" = "setup"
"id" = "docker-on-pi"
"title" = "Docker running on the Pi"
"size" = "M"
"needs" = ["ssh-key-login"]
"done_when" = "The Docker daemon responds on your lab host. Run hello-world yourself to check image execution as well; the verifier checks daemon availability."
"resource" = "https://docs.docker.com/engine/install/debian/"
"verify" = { "type" = "command", "cmd" = "ssh -o BatchMode=yes -o ConnectTimeout=5 {pi_user}@{pi_ip} docker info" }
"minutes" = 60

[[node]]
"level" = "setup"
"id" = "juice-shop-up"
"title" = "OWASP Juice Shop running on the Pi (milestone)"
"size" = "L"
"needs" = ["docker-on-pi"]
"milestone" = true
"done_when" = "Start the isolated Juice Shop profile, reach it through localhost or an SSH tunnel and discover its scoreboard. The signed bridge must observe scoreBoardChallenge solved."
"resource" = "https://owasp.org/www-project-juice-shop/"
"verify" = { "type" = "ctf", "provider" = "juice-shop", "challenge" = "scoreBoardChallenge" }
"minutes" = 120
"brief" = "Use your individually assigned Juice Shop instance. Start a session before work, then ask the lab administrator to refresh the signed proof receipt and verify within five minutes. The receipt confirms game state; explain the mechanism separately."

[[node]]
"level" = "attack"
"id" = "recon-scan"
"title" = "Scan the Pi with nmap and explain the result"
"size" = "M"
"needs" = []
"done_when" = "scan saved to {hack_dir}/scans/pi-before.txt, plus 5 lines in my own words on what each open port is"
"resource" = "https://nmap.org/book/man.html"
"verify" = { "type" = "file", "path" = "{hack_dir}/scans/pi-before.txt", "min_bytes" = 200 }
"minutes" = 60

[[node]]
"level" = "attack"
"id" = "burp-setup"
"title" = "Burp Suite Community intercepting the browser"
"size" = "M"
"needs" = []
"done_when" = "I can see a request to Juice Shop in Burp's HTTP history"
"resource" = "https://portswigger.net/burp/communitydownload"
"minutes" = 60

[[node]]
"level" = "attack"
"id" = "juice-sqli"
"title" = "Solve the login-bypass SQL injection challenge"
"size" = "M"
"needs" = ["burp-setup"]
"done_when" = "logged in as admin without the real password; one paragraph in {hack_dir}/juice-notes.md on why the query broke"
"resource" = "https://pwning.owasp-juice.shop/"
"minutes" = 60
"verify" = { "type" = "ctf", "provider" = "juice-shop", "challenge" = "loginAdminChallenge" }
"brief" = "Use your individually assigned Juice Shop instance. Start a session before work, then ask the lab administrator to refresh the signed proof receipt and verify within five minutes. The receipt confirms game state; explain the mechanism separately."

[[node]]
"level" = "attack"
"id" = "juice-three"
"title" = "Solve scoreboard, privacy policy and login bypass (milestone)"
"size" = "L"
"needs" = ["juice-sqli", "recon-scan"]
"milestone" = true
"done_when" = "All three named challenges are confirmed in the assigned game. Explain the login flaw and what each discovery taught you; the bridge grades challenge state, not the explanation."
"resource" = "https://pwning.owasp-juice.shop/"
"verify" = { "type" = "ctf", "provider" = "juice-shop", "challenge" = "loginAdminChallenge", "all_of" = ["scoreBoardChallenge", "privacyPolicyChallenge"] }
"minutes" = 120
"brief" = "Use your individually assigned Juice Shop instance. Start a session before work, then ask the lab administrator to refresh the signed proof receipt and verify within five minutes. The receipt confirms game state; explain the mechanism separately."

[[node]]
"level" = "attack2"
"id" = "juice-xss"
"title" = "Solve the reflected XSS challenge"
"size" = "M"
"needs" = []
"done_when" = "The assigned game records reflectedXssChallenge solved. Explain the vulnerable input/output path and a suitable defense."
"resource" = "https://pwning.owasp-juice.shop/"
"minutes" = 60
"verify" = { "type" = "ctf", "provider" = "juice-shop", "challenge" = "reflectedXssChallenge" }
"brief" = "Use your individually assigned Juice Shop instance. Start a session before work, then ask the lab administrator to refresh the signed proof receipt and verify within five minutes. The receipt confirms game state; explain the mechanism separately."

[[node]]
"level" = "attack2"
"id" = "juice-broken-access"
"title" = "Solve a broken-access-control challenge (view/edit someone else's data)"
"size" = "M"
"needs" = []
"done_when" = "one broken-access-control challenge solved; note on which check was missing"
"resource" = "https://pwning.owasp-juice.shop/"
"minutes" = 60
"verify" = { "type" = "ctf", "provider" = "juice-shop", "challenge" = "basketAccessChallenge" }
"brief" = "Use your individually assigned Juice Shop instance. Start a session before work, then ask the lab administrator to refresh the signed proof receipt and verify within five minutes. The receipt confirms game state; explain the mechanism separately."

[[node]]
"level" = "attack2"
"id" = "owasp-top10-notes"
"title" = "Write a one-pager mapping what I exploited to the OWASP Top 10 (milestone)"
"size" = "M"
"needs" = ["juice-xss", "juice-broken-access"]
"milestone" = true
"done_when" = "{hack_dir}/owasp-top10.md lists at least 4 Top 10 categories, each with which Juice Shop challenge demonstrated it"
"resource" = "https://owasp.org/www-project-top-ten/"
"verify" = { "type" = "file", "path" = "{hack_dir}/owasp-top10.md", "min_bytes" = 300 }
"minutes" = 60

[[node]]
"level" = "defend"
"id" = "harden-pi"
"title" = "Harden the Pi: key-only SSH and a firewall"
"size" = "M"
"needs" = []
"done_when" = "password SSH login is off, ufw allows only the ports I chose, and I re-scanned into {hack_dir}/scans/pi-after.txt"
"resource" = "https://help.ubuntu.com/community/UFW"
"verify" = { "type" = "file", "path" = "{hack_dir}/scans/pi-after.txt", "min_bytes" = 100 }
"minutes" = 60

[[node]]
"level" = "defend"
"id" = "report"
"title" = "Write the one-page report (milestone)"
"size" = "S"
"needs" = ["harden-pi"]
"milestone" = true
"done_when" = "{hack_dir}/report.md says what I attacked, what I found, what I changed, and which mission is next"
"resource" = "https://owasp.org/www-project-juice-shop/"
"verify" = { "type" = "file", "path" = "{hack_dir}/report.md", "min_bytes" = 400 }
"minutes" = 15

[[node]]
"level" = "warmup"
"id" = "bandit"
"title" = "OverTheWire Bandit, level {n}"
"series" = { "from" = 0, "to" = 32 }
"size" = "S"
"needs" = []
"done_when" = "Solve challenge {n}, then demonstrate SSH access as bandit{next} through the host-side proof collector. Explain your commands without copying passwords into Ascend. Account access alone does not prove independent solving."
"resource" = "https://overthewire.org/wargames/bandit/"
"minutes" = 15
"verify" = { "type" = "ctf", "provider" = "bandit", "challenge" = "bandit-{n}" }
"brief" = "Start at level 0 using the official instructions. Verify the official SSH host key before using the collector; level passwords remain in your SSH terminal and are never stored by Ascend."

[[node]]
"id" = "bandit-33"
"level" = "warmup"
"title" = "Bandit final account: consolidate what you learned"
"size" = "S"
"minutes" = 15
"needs" = ["bandit-32"]
"done_when" = "Reach bandit33 after challenge 32, explain one changed example without notes and check the official endpoint. Level 34 is not available; the receipt confirms access to bandit33, not this reflection."
"resource" = "https://overthewire.org/wargames/bandit/bandit34.html"
"verify" = { "type" = "ctf", "provider" = "bandit", "challenge" = "bandit-32" }
