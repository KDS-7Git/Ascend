# ---------------------------------------------------------------- side lane: quick drills
[[node]]
level = "boxes"
id = "retired-box"
title = "Retired HTB/VulnHub box #{n}, start to root"
series = { from = 1, to = 15 }
size = "M"
needs = []
done_when = "fully rooted retired box #{n} and wrote a 3-line summary of the one technique it taught you, at {lab_dir}/notes/boxes-log.md"
resource = "https://www.vulnhub.com/"

[[node]]
"level" = "boxes"
"id" = "discovery-2"
"title" = "Prove whether a local service is reachable"
"size" = "S"
"minutes" = 15
"needs" = ["first-discovery"]
"brief" = "Turn a listening-port observation into a connection test."
"done_when" = "Choose an owned local HTTP service, identify its binding with ss, connect with curl, then stop it and repeat. Save both results and distinguish a listener from a successful request."
"resource" = "https://man7.org/linux/man-pages/man8/ss.8.html"
"verify" = { "type" = "manual" }

[[node]]
"level" = "boxes"
"id" = "discovery-3"
"title" = "Read one service banner without a scanner"
"size" = "S"
"minutes" = 20
"needs" = ["discovery-2"]
"brief" = "Confirm a version clue using the service’s own protocol."
"done_when" = "On an owned lab host, connect to one known SSH or HTTP service and inspect the greeting or response headers. Record what the banner claims and one reason that claim alone does not establish vulnerability."
"resource" = "https://nmap.org/book/man-version-detection.html"
"verify" = { "type" = "manual" }
