id = "recall-recon"
level = "retrieval"
title = "Return later: Enumeration and reconnaissance"
size = "S"
minutes = 20
needs = ["recon-milestone"]
brief = "On a later day, check what you can reconstruct and apply without your original notes. The 2–7 day window is a suggested practice interval, not an enforced schedule."
steps = ["Start with closed notes: Explain the next check for a new banner, including what would falsify the suspected weakness.", "Try the small changed case first. Then open your evidence to compare, correct mistakes, and name what needs another practice session."]
