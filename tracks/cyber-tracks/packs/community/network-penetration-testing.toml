# ---------------------------------------------------------------- 8: capstone
brief = "Map observed actions to telemetry and distinguish visibility gaps from evidence of absence."
steps = ["Before testing, record your prediction and the observation that would change your mind.", "Map the stages of a completed lab exercise to ATT&CK techniques and actual log or network evidence, including a harmless scheduled-task persistence fixture and synthetic file transfer.", "Transfer check: Change the task name or transfer channel and predict how the evidence changes.", "Control check: Remove the lab artifact and confirm its absence; label an unlogged action as a visibility gap instead of claiming it did not happen.", "Explain the mechanism and one limitation in your own words. Record references and hints used. If a walkthrough was needed, save partial progress and retry a fresh changed case independently before claiming the assessment.", "Save reproducible evidence and your prediction-versus-observation comparison at {lab_dir}/notes/attck-mapping.md."]
hints = ["Use the linked reference or an earlier worked example to isolate the missing concept. Then close that example and try a different input or case.", "If the result disagrees with your prediction, check the lab setup and compare a known-good control before changing several variables."]

[[node]]
level = "capstone"
id = "capstone-recon"
title = "Capstone box: full recon, no shortcuts"
size = "M"
needs = []
done_when = "picked a fresh, never-attempted VulnHub/TryHackMe/HTB box and did complete recon before any exploitation attempt, saved at {lab_dir}/notes/capstone-recon.md"
resource = "https://www.vulnhub.com/"
verify = { type = "file", path = "{lab_dir}/notes/capstone-recon.md", min_bytes = 200 }

[[node]]
level = "capstone"
id = "capstone-foothold"
title = "Get an initial foothold"
size = "L"
needs = ["capstone-recon"]
done_when = "gained initial access (any shell, any privilege level) on the capstone box, documented the exploitation path at {lab_dir}/notes/capstone-foothold.md"
resource = "https://www.vulnhub.com/"
verify = { type = "file", path = "{lab_dir}/notes/capstone-foothold.md", min_bytes = 200 }

[[node]]
level = "capstone"
id = "capstone-privesc"
title = "Escalate to full root/SYSTEM"
size = "L"
needs = ["capstone-foothold"]
done_when = "escalated to root or SYSTEM on the capstone box, documented the privesc path at {lab_dir}/notes/capstone-privesc.md"
resource = "https://www.vulnhub.com/"
verify = { type = "file", path = "{lab_dir}/notes/capstone-privesc.md", min_bytes = 200 }

[[node]]
level = "capstone"
id = "capstone-milestone"
title = "Full written report, start to root (milestone)"
size = "L"
needs = ["capstone-recon", "capstone-foothold", "capstone-privesc"]
milestone = true
done_when = "Demonstrated: Complete and report a scoped assessment without following a target walkthrough. Completed the experiment, independently tested the changed case, compared the control, and explained the mechanism and limits. Saved predictions, observations, reproduction steps, and help used at {lab_dir}/notes/capstone-report.md."
resource = "https://www.vulnhub.com/"
verify = { type = "file", path = "{lab_dir}/notes/capstone-report.md", min_bytes = 250 }
brief = "Complete and report a scoped assessment without following a target walkthrough."
steps = ["Before testing, record your prediction and the observation that would change your mind.", "On an unfamiliar training box, progress from reconnaissance to the designated foothold and privilege objective, recording dead ends, evidence, and help used.", "Transfer check: In an owned reproduction, change one account permission, service setting, or route relevant to a key step. Predict the effect on the assessment chain and independently retest.", "Control check: Apply one hardening change in an owned reproduction and show it blocks that step without breaking intended use; clearly label untested fixes.", "Explain the mechanism and one limitation in your own words. Record references and hints used. If a walkthrough was needed, save partial progress and retry a fresh changed case independently before claiming the assessment.", "Save reproducible evidence and your prediction-versus-observation comparison at {lab_dir}/notes/capstone-report.md."]
hints = ["Use the linked reference or an earlier worked example to isolate the missing concept. Then close that example and try a different input or case.", "If the result disagrees with your prediction, check the lab setup and compare a known-good control before changing several variables."]

[[node]]
level = "boxes"
id = "first-discovery"
title = "Match one local port to its process"
size = "S"
minutes = 10
needs = []
brief = "Find one service your own machine is running and identify its owner."
done_when = "Use ss -ltnp (or your operating system’s equivalent) on your own machine. Match one listening port to a process and record whether it binds to loopback or all interfaces."
resource = "https://man7.org/linux/man-pages/man8/ss.8.html"
verify = { type = "manual" }


