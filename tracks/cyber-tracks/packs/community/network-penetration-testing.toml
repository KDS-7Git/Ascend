# ---------------------------------------------------------------- 3: metasploit
brief = "Verify exploit prerequisites and explain the boundary crossed."
steps = ["Before testing, record your prediction and the observation that would change your mind.", "On a designated vulnerable lab, establish a foothold using a documented service weakness after verifying its required conditions. Save sanitized evidence.", "Transfer check: Use a comparable training service with one changed configuration or prerequisite. Predict whether the technique still applies, adapt the test, and explain success or failure.", "Control check: Remove one prerequisite in an owned reproduction and show that the exploit fails while legitimate access remains.", "Explain the mechanism and one limitation in your own words. Record references and hints used. If a walkthrough was needed, save partial progress and retry a fresh changed case independently before claiming the assessment.", "Save reproducible evidence and your prediction-versus-observation comparison at {lab_dir}/notes/service-milestone.md."]
hints = ["Use the linked reference or an earlier worked example to isolate the missing concept. Then close that example and try a different input or case.", "If the result disagrees with your prediction, check the lab setup and compare a known-good control before changing several variables."]

