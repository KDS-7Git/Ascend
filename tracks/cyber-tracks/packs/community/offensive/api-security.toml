"brief" = "Use two synthetic identities against one concrete note."
"steps" = ["Read NOTES and do_GET in service.py. Note 1 belongs to alice. Start the fixture with python3 service.py.", "Compare a known owner, another known user and no identity.\n```sh\ncurl --noproxy \"*\" -i -H \"X-Lab-User: alice\" http://127.0.0.1:8765/notes/1\ncurl --noproxy \"*\" -i -H \"X-Lab-User: bob\" http://127.0.0.1:8765/notes/1\ncurl --noproxy \"*\" -i http://127.0.0.1:8765/notes/1\n```", "Record status and whether note content is returned. Explain why recognizing a user is different from authorizing that user for this object. Stop the service.", "Save your own observations from the extracted lab folder. The included report.py asks for scope, setup, prediction, exact actions, actual results, a comparison, explanation, limitations and help used. It does not supply answers or overwrite an existing report.\n```sh\npython3 report.py \"{lab_dir}/foundations-experiment.json\"\n```\nOn Windows use py -3 instead of python3. Review the saved JSON in a text editor. Ascend checks files on the SERVER computer: for a hosted/container deployment, place your report at the server’s configured lab path. A file saved only on your laptop is not visible to that checker. Use Challenge options → Check evidence, then Log progress → Mark as done only after reviewing the finish line. File presence does not grade reasoning or earn automatic skill XP."]
"resource" = "https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/"
"verify" = { "type" = "file", "path" = "{lab_dir}/foundations-experiment.json", "min_bytes" = 200 }
"resource_label" = "Free reference (optional)"
"resource_note" = "The challenge and its named lab files define the task. This reference explains the topic; buying or completing a course is not required."
"preview" = "Use two synthetic identities against one concrete note."
"requirements" = "Python 3, curl and two terminal windows on your computer. No paid service or account is needed."
"setup" = "Use Python 3 and a text editor on your own computer. Download the lab files below, extract into a NEW folder, and open a terminal in the folder containing report.py. No course, account or cloud spend is required. These are synthetic training inputs. The service.py fixture uses curl and a second terminal. Start it with python3 service.py; it listens only on 127.0.0.1:8765. Stop it with Ctrl+C. Restart to reset its in-memory notes. X-Lab-User is a simulated identity, not real authentication."
"materials" = [{ "label" = "Download this track’s lab files (ZIP)", "url" = "/training/api-security.zip" }]

