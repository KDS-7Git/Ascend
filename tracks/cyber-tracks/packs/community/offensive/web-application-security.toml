[pack]
"id" = "web-application-security"
"title" = "Web Application Security: beyond the OWASP Top 10 basics"
"kind" = "proficiency"
"version" = 4
"source" = "ai-draft"
"reviewed" = false

[vars]
"lab_dir" = "~/cyber/webapp"
"pi_ip" = "192.168.1.50"

[[level]]
"id" = "injection"
"title" = "Injection: SQL, command, and beyond"
"lane" = "main"

[[level]]
"id" = "auth"
"title" = "Broken authentication and session management"
"lane" = "main"

[[level]]
"id" = "access-control"
"title" = "Broken access control, in depth"
"lane" = "main"

[[level]]
"id" = "xss-and-csrf"
"title" = "XSS, CSRF, and client-side trust"
"lane" = "main"

[[level]]
"id" = "ssrf-and-deserialization"
"title" = "SSRF, insecure deserialization, XXE"
"lane" = "main"

[[level]]
"id" = "logic-flaws"
"title" = "Business logic vulnerabilities"
"lane" = "main"

[[level]]
"id" = "api-security"
"title" = "API security: REST, GraphQL, JWTs"
"lane" = "main"

[[level]]
"id" = "capstone"
"title" = "Full assessment on one target"
"lane" = "main"

[[level]]
"id" = "drills"
"title" = "PortSwigger Academy drills"
"lane" = "side"

[[level]]
"id" = "retrieval"
"title" = "Return later: explain and transfer"
"lane" = "side"

[[node]]
"id" = "lab-readiness"
"level" = "injection"
"title" = "Capture and replay a request in a training lab"
"size" = "S"
"minutes" = 30
"needs" = []
"brief" = "Establish the prerequisites with a small demonstration. Use a foundations lesson if you cannot yet explain the result."
"done_when" = "Launch an authorized Academy lab, capture one request in Burp Community or browser tools, replay it, and identify method, path, parameter, status, and cookie role. Explain which identity the server sees; save no live tokens."
"resource" = "https://developer.mozilla.org/en-US/docs/Web/HTTP"
"verify" = { "type" = "manual" }
"resource_label" = "Free setup reference (optional)"
"resource_note" = "Use the task instructions and your own training environment. This link is documentation, not a course purchase."

[[node]]
"level" = "injection"
"id" = "sqli-union"
"title" = "Make a lab reveal a hidden row"
"size" = "M"
"needs" = ["lab-readiness"]
"done_when" = "Solved one PortSwigger UNION lab and saved the successful request, solved status, and why the column counts/types match in {lab_dir}/notes/sqli-union.md."
"resource" = "https://portswigger.net/web-security/sql-injection/union-attacks"
"verify" = { "type" = "file", "path" = "{lab_dir}/notes/sqli-union.md", "min_bytes" = 150 }
"minutes" = 45
"brief" = "A product page trusts its input. Use one UNION-based Academy lab to discover what else its database can reveal."
"steps" = ["Open the resource and choose one apprentice UNION lab on PortSwigger Academy. Use only the provided lab instance.", "Capture a normal request, then change one input at a time until your UNION query returns the lab’s target value.", "Save the solved-lab evidence, your request, and one sentence on column compatibility in {lab_dir}/notes/sqli-union.md. Redact any secrets."]
"hints" = ["A UNION query needs the same number of columns, with compatible types. Establish the shape before trying to extract a value."]

[[node]]
"level" = "injection"
"id" = "sqli-blind"
"title" = "Ask a database a question without seeing its answer"
"size" = "M"
"needs" = ["sqli-union"]
"done_when" = "Solved one blind SQLi lab and saved repeated true/false evidence and an explanation of the signal in {lab_dir}/notes/sqli-blind.md."
"resource" = "https://portswigger.net/web-security/sql-injection/blind"
"verify" = { "type" = "file", "path" = "{lab_dir}/notes/sqli-blind.md", "min_bytes" = 150 }
"minutes" = 60
"brief" = "The page hides query results. Find a reliable signal that distinguishes true from false."
"steps" = ["Choose one blind SQL injection lab from the linked Academy topic.", "Compare a known-true and a known-false condition. Repeat the comparison to rule out noise.", "Solve the lab and save the contrasting requests, observed signal, and root cause in {lab_dir}/notes/sqli-blind.md."]
"hints" = ["Look for a content difference, an error, or a repeatable delay. Match the signal to the lab you chose."]

[[node]]
"level" = "injection"
"id" = "command-injection"
"title" = "Make a lab server do one unintended thing"
"size" = "M"
"needs" = ["lab-readiness"]
"done_when" = "completed one OS command injection lab and wrote the exact payload plus why the application's input handling allowed it, at {lab_dir}/notes/command-injection.md"
"resource" = "https://portswigger.net/web-security/os-command-injection"
"verify" = { "type" = "file", "path" = "{lab_dir}/notes/command-injection.md", "min_bytes" = 150 }
"minutes" = 45
"brief" = "Find the boundary between harmless user input and a command the server executes."
"steps" = ["Launch one command-injection lab on PortSwigger Academy and capture its normal request.", "Use the lab’s intended harmless proof to show that input reaches a shell.", "Save the solved status, request, and the unsafe input boundary in {lab_dir}/notes/command-injection.md."]
"hints" = ["Compare a normal input with your test input. Explain why the application should treat both as data."]

[[node]]
"level" = "injection"
"id" = "injection-milestone"
"title" = "Solve an injection lab, then explain the repair"
"size" = "L"
"needs" = ["lab-readiness", "sqli-union", "sqli-blind", "command-injection"]
"milestone" = true
"done_when" = "Demonstrated: Infer an injection mechanism from request/response evidence and distinguish a real signal from noise. Completed the experiment, independently tested the changed case, compared the control, and explained the mechanism and limits. Saved predictions, observations, reproduction steps, and help used at {lab_dir}/notes/injection-milestone.md."
"resource" = "https://portswigger.net/web-security/sql-injection"
"verify" = { "type" = "file", "path" = "{lab_dir}/notes/injection-milestone.md", "min_bytes" = 250 }
"minutes" = 90
"brief" = "Infer an injection mechanism from request/response evidence and distinguish a real signal from noise."
"steps" = ["Before testing, record your prediction and the observation that would change your mind.", "Solve an unfamiliar scoped Academy injection lab; save redacted baseline and successful requests, observations, root cause, and a specific repair.", "Transfer check: Solve a second small variation of the same mechanism with a different input location, data shape, or response signal.", "Control check: Include a negative request and explain why a status change or delay alone is insufficient evidence.", "Explain the mechanism and one limitation in your own words. Record references and hints used. If a walkthrough was needed, save partial progress and retry a fresh changed case independently before claiming the assessment.", "Save reproducible evidence and your prediction-versus-observation comparison at {lab_dir}/notes/injection-milestone.md."]
"hints" = ["Use the linked reference or an earlier worked example to isolate the missing concept. Then close that example and try a different input or case.", "If the result disagrees with your prediction, check the lab setup and compare a known-good control before changing several variables."]

