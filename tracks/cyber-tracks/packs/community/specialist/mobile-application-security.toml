"brief" = "Identify exposed components in a synthetic app declaration."
"steps" = ["Open AndroidManifest.xml as text. It declares the INTERNET permission, cleartext-traffic setting, an exported activity and an exported provider.", "Make a table of each component, its exported value and any required caller permission actually shown. Identify which question requires runtime testing.", "Explain that this file is a training snippet, not a buildable or installed APK. Do not claim a data leak solely from exported=true without testing the component implementation.", "Save your own observations from the extracted lab folder. The included report.py asks for scope, setup, prediction, exact actions, actual results, a comparison, explanation, limitations and help used. It does not supply answers or overwrite an existing report.\n```sh\npython3 report.py \"{lab_dir}/foundations-experiment.json\"\n```\nOn Windows use py -3 instead of python3. Review the saved JSON in a text editor. Ascend checks files on the SERVER computer: for a hosted/container deployment, place your report at the server’s configured lab path. A file saved only on your laptop is not visible to that checker. Use Challenge options → Check evidence, then Log progress → Mark as done only after reviewing the finish line. File presence does not grade reasoning or earn automatic skill XP."]
"resource" = "https://mas.owasp.org/MASTG/apps/android/MASTG-APP-0011/"
"verify" = { "type" = "file", "path" = "{lab_dir}/foundations-experiment.json", "min_bytes" = 200 }
"resource_label" = "Free reference (optional)"
"resource_note" = "The challenge and its named lab files define the task. This reference explains the topic; buying or completing a course is not required."
"preview" = "Identify exposed components in a synthetic app declaration."
"requirements" = "A browser and text editor for a static model. No VM, emulator or device is needed for this introductory task."
"setup" = "Use Python 3 and a text editor on your own computer. Download the lab files below, extract into a NEW folder, and open a terminal in the folder containing report.py. No course, account or cloud spend is required. These are synthetic training inputs. The service.py fixture uses curl and a second terminal. Start it with python3 service.py; it listens only on 127.0.0.1:8765. Stop it with Ctrl+C. Restart to reset its in-memory notes. X-Lab-User is a simulated identity, not real authentication. The foundation is static manifest reading only. Device tasks require Android Studio’s free emulator (hardware virtualization and disk space) or your own Android test device, adb and a sanctioned practice APK. Use the named OWASP MASTG Hacking Playground, never a personal/banking app. A manifest file is not an installed app."
"materials" = [{ "label" = "Download this track’s lab files (ZIP)", "url" = "/training/mobile-application-security.zip" }]

