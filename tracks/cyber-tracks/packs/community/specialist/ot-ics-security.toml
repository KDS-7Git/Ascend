"brief" = "Separate a numeric observation from an operational conclusion."
"steps" = ["Read process.json and registers.py. Register 10 models tank level; the normal range is 40–60 percent. Run the model.\n```sh\npython3 registers.py\n```", "Record the actual address/value pairs. Explain which unit/range comes from the scenario and cannot be inferred from the integer alone.", "Write the stated risk of losing operator visibility during containment. No packet was sent and no physical tank was observed.", "Save your own observations from the extracted lab folder. The included report.py asks for scope, setup, prediction, exact actions, actual results, a comparison, explanation, limitations and help used. It does not supply answers or overwrite an existing report.\n```sh\npython3 report.py \"{lab_dir}/foundations-experiment.json\"\n```\nOn Windows use py -3 instead of python3. Review the saved JSON in a text editor. Ascend checks files on the SERVER computer: for a hosted/container deployment, place your report at the server’s configured lab path. A file saved only on your laptop is not visible to that checker. Use Challenge options → Check evidence, then Log progress → Mark as done only after reviewing the finish line. File presence does not grade reasoning or earn automatic skill XP."]
"resource" = "https://www.cisa.gov/resources-tools/resources/ics-recommended-practices"
"verify" = { "type" = "file", "path" = "{lab_dir}/foundations-experiment.json", "min_bytes" = 200 }
"resource_label" = "Free reference (optional)"
"resource_note" = "The challenge and its named lab files define the task. This reference explains the topic; buying or completing a course is not required."
"preview" = "Separate a numeric observation from an operational conclusion."
"requirements" = "Python 3 and a text editor. These are offline simulations and tabletops; no industrial device is required."
"setup" = "Use Python 3 and a text editor on your own computer. Download the lab files below, extract into a NEW folder, and open a terminal in the folder containing report.py. No course, account or cloud spend is required. These are synthetic training inputs. These are offline simulations/tabletops, with no industrial device connection. registers.py models integer reads only; it is not a Modbus implementation."
"materials" = [{ "label" = "Download this track’s lab files (ZIP)", "url" = "/training/ot-ics-security.zip" }]

