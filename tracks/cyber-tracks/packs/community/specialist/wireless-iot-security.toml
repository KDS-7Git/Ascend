"brief" = "Read one concrete IoT scenario before starting a broker."
"steps" = ["Open device.json. Identify the owner, model, topic and payload. Draw sensor → broker → subscriber as a three-component path.", "Read broker.conf. It binds port 18883 only on 127.0.0.1 and initially permits anonymous access. Explain why this setting is for the local exercise only.", "Write the expected publish and subscribe identities, allowed topic and one denied topic. This plan does not demonstrate wireless transmission or real firmware behavior.", "Save your own observations from the extracted lab folder. The included report.py asks for scope, setup, prediction, exact actions, actual results, a comparison, explanation, limitations and help used. It does not supply answers or overwrite an existing report.\n```sh\npython3 report.py \"{lab_dir}/foundations-experiment.json\"\n```\nOn Windows use py -3 instead of python3. Review the saved JSON in a text editor. Ascend checks files on the SERVER computer: for a hosted/container deployment, place your report at the server’s configured lab path. A file saved only on your laptop is not visible to that checker. Use Challenge options → Check evidence, then Log progress → Mark as done only after reviewing the finish line. File presence does not grade reasoning or earn automatic skill XP."]
"resource" = "https://mosquitto.org/man/mosquitto-conf-5.html"
"verify" = { "type" = "file", "path" = "{lab_dir}/foundations-experiment.json", "min_bytes" = 200 }
"resource_label" = "Free reference (optional)"
"resource_note" = "The challenge and its named lab files define the task. This reference explains the topic; buying or completing a course is not required."
"preview" = "Read one concrete IoT scenario before starting a broker."
"requirements" = "Python 3 and a text editor. MQTT tasks also require the free Mosquitto broker and clients. No physical sensor is required for the local models."
"setup" = "Use Python 3 and a text editor on your own computer. Download the lab files below, extract into a NEW folder, and open a terminal in the folder containing report.py. No course, account or cloud spend is required. These are synthetic training inputs. MQTT needs the free Mosquitto broker and clients installed locally. The wireless task uses the bundled synthetic capture in Wireshark; no radio adapter is required for that analysis. Actual device/firmware operations need separately owned hardware."
