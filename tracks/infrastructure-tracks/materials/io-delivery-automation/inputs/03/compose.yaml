services:
  app:
    image: ascend-relay:lab
    ports: ["127.0.0.1:8088:8000"]
    volumes: ["relay_data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
volumes:
  relay_data:
