# Disposable Ubuntu 24.04 / Dovecot 2.3 guest only.
listen = 127.0.0.1, ::1
protocols = imap
mail_location = maildir:~/Maildir
ssl = required
ssl_cert = </etc/ssl/certs/ascend-mail-lab.pem
ssl_key = </etc/ssl/private/ascend-mail-lab.key
disable_plaintext_auth = yes
auth_mechanisms = plain login
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
